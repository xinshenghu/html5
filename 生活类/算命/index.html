<title>周易 · 六十四卦</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  background:linear-gradient(180deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
  min-height:100vh;color:#fff;overflow-x:hidden}
.container{position:relative;min-height:100vh;padding-bottom:120px}
.flying-guas{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0}
.gua-item{position:absolute;color:rgba(255,255,255,.35);font-weight:bold;z-index:0}
@keyframes f1{0%{transform:translateY(0) translateX(0)}25%{transform:translateY(-50px) translateX(25px)}50%{transform:translateY(-15px) translateX(-15px)}75%{transform:translateY(-60px) translateX(30px)}100%{transform:translateY(0) translateX(0)}}
@keyframes f2{0%{transform:translateY(0) translateX(0)}25%{transform:translateY(50px) translateX(-25px)}50%{transform:translateY(15px) translateX(15px)}75%{transform:translateY(60px) translateX(-30px)}100%{transform:translateY(0) translateX(0)}}
.hint{position:fixed;top:30%;left:0;right:0;text-align:center;pointer-events:none;z-index:1}
.hint-text{color:rgba(255,255,255,.3);font-size:14px;letter-spacing:2px}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100}
.card{background:linear-gradient(135deg,#f39c12,#e74c3c);border-radius:20px;padding:40px 50px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:pop .3s ease-out;max-width:280px}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.card-num{font-size:80px;font-weight:bold;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.2)}
.card-name{font-size:22px;color:rgba(255,255,255,.95);margin-top:8px;font-weight:bold}
.card-btn{display:inline-block;padding:8px 28px;background:rgba(255,255,255,.2);color:#fff;border-radius:20px;font-size:15px;border:none;margin-top:20px;cursor:pointer}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;display:flex;padding:10px 5px;padding-bottom:calc(10px + env(safe-area-inset-bottom,10px));background:rgba(0,0,0,.4);z-index:50}
.gua-btn{flex:1;height:56px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);border-radius:12px;margin:0 3px;border:1px solid rgba(255,255,255,.1);cursor:pointer}
.gua-btn .name{font-size:20px;font-weight:bold;color:#f39c12}
.detail-page{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,#1a1a2e,#16213e,#0f3460);z-index:200;overflow-y:auto;padding:20px}
.detail-page.active{display:block}
.back-btn{display:inline-block;padding:6px 16px;background:rgba(255,255,255,.1);color:#f39c12;border-radius:10px;font-size:14px;cursor:pointer;margin-bottom:16px;border:1px solid rgba(255,255,255,.1)}
.detail-num{text-align:center;font-size:64px;font-weight:bold;color:#f39c12;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.detail-name{text-align:center;font-size:20px;color:rgba(255,255,255,.7);margin-bottom:16px}
.section{background:rgba(255,255,255,.06);border-radius:14px;padding:16px;margin-bottom:14px}
.section-label{font-size:17px;font-weight:bold;color:#f39c12;margin-bottom:8px}
.section-text{font-size:15px;line-height:1.8;color:rgba(255,255,255,.8);white-space:pre-wrap}
.section-text.o{color:#eb7c06}.section-text.r{color:#e74c3c}.section-text.p{color:#a318da}.section-text.b{color:#8b5cf6}.section-text.g{color:#10b981}
.yao-item{background:rgba(255,255,255,.04);border-radius:10px;padding:12px;margin-bottom:10px}
.yao-label{font-size:14px;font-weight:bold;color:#8b5cf6}
</style>
</head>

  <div id="flying" class="flying-guas"></div>
  <div id="hint" class="hint"><div class="hint-text">点击屏幕 · 随机抽签</div></div>
  <div id="result-overlay" class="overlay" style="display:none">

      <div class="card-num" id="result-num"></div>
      <div class="card-name" id="result-name"></div>

    </div>

</div>

  <div class="back-btn" onclick="hideDetail()">← 返回</div>

</div>
<script>
var GUAS={"1": {"shici": ["乾卦：天行健，君子以自强不息", "象曰：困龙得水交好运，不由喜气上眉梢，一切谋望皆如意，日后时运渐渐高。", "人应当像天一样刚健，永远自强不息", "乾的性质是刚健不息。所以两个单卦乾相叠代表“刚健而又刚健”，刚健的性质增加了一倍，称为“至健”。这种“刚健”对于官运、考学都较有利，但对于与人相处之事，如感情、家运都不吉，具体表现为个性倔强，固执己见，难以接受旁人的劝告，不够圆融，虚荣心强，爱逞能"], "shuoming": ["乾，元亨，利贞。"], "guayi": ["乾卦运势（事业、爱情、经商、诉讼、出行、人生）\n            本文所属分类：乾卦 \n            \n            运势：地位提升，名利双收，凡事谦和为贵，应坚忍不拔，把握机会。\n            \n            事业：春风得意，如日中天，但要提高警惕，修心养性，冷静处世。\n            \n            爱情：常有矛盾，不可逞强，应多沟通迁就，刚柔并济，不以自我为中心。\n            \n            疾病：病多为头脑、神经之病，应细心调养。若变卦有解仍为吉。\n            \n            经商：十分顺利，有大展宏图的机会。不可操之过急，应审时度势而后动。\n            \n            诉讼：自己一方有理，应该据理力争。\n            \n            出行：一人独行，或伙伴分散。不宜独行，如果结伴而行则吉。\n            \n            人生：个性鲜明，有主见，能感知“命运”的存在，适合进入政界。"], "yunshi": [{"yaoci": "初九：潜龙勿用", "fanyi": "初九是爻的名称。其中“九”表示阳爻，“初”表示第一个。此句爻辞的意思是：身居下位，时机还没有成熟，所以应当像潜藏的龙一样不要施展你的才干。", "jiedu": "阳气初生的阶段，位卑力薄，一切刚刚起步，要养精蓄锐。如同学行未成、人微言轻之时，不可强行出头、多管闲事，因为还没有兴云作雨的能力和条件。只能等待，像卧龙一样潜伏水中。"}, {"yaoci": "九二：见龙在田，利见大人", "fanyi": "龙出现在田野之上，有利于见到大人物，并以此来发展自己。", "jiedu": "气质刚健，既有足够的雄心和魄力，又能妥善行事，便具备了成功的素质。虽有更高的能力，可是不容易发挥出来。此时要抓住机遇，借助大人物来发展自己。比如周文王贿赂纣王，从而得到了征讨诸侯的大权，壮大了国力。再如1982年刘永行四兄弟变卖家产，筹资一千元创业，20年后资产达83亿。"}, {"yaoci": "九三：君子终日乾乾，夕惕若厉，无咎", "fanyi": "君子终日自强不息，每天晚上对自己进行深刻反省，保持警惕的心，检查自己的失误之处，才不会给自己带来灾难。", "jiedu": "事业将成而未成，如龙刚刚飞起在半空，既不能凭借崇高威望获得尊重，又失去了立足保身之地。进不能只顾向上飞，退又不能返回地面。这是最尴尬的不上不下时期。如同刚从监狱里出来的周文王，上面有纣王，下面有诸侯。如果受到纣王的猜忌，则又要大难临头；如果引起诸侯不满，也会有凶险。"}, {"yaoci": "九四：或跃在渊，无咎", "fanyi": "九四：根据不同时机，可以一跃九天，也可以复沉于渊，都不会有什么灾难。", "jiedu": "处于多惧之地，如果一直处在当前的位置上就凶险了。只有“跃”和“渊”是解决的办法。跃是升到上位；渊是回到下位。如同武王发展成当时最大的诸侯国。殷商三分之二的天下都由武王管辖的。此时他再给纣王送礼，纣王也明白心腹大患是武王。所以他只有两种出路，或者推翻纣，或者交出土地，归隐保全。"}, {"yaoci": "九五：飞龙在天，利见大人", "fanyi": "九五：飞龙遨游于天际，有利于见到大人物", "jiedu": "此位置在所有卦里都是最吉的，称为“君位”，代表事物发展到最完美的阶段。皇帝通称为“九五之尊”就是这么来的。其德高位高，品德、才智、地位兼备。客观条件已尽善尽美，这是一飞冲天、大展鸿图的时候。已经是君王，还要见大人物吗？天外有天，人外有人，君王之上是祖先或百姓中有能力辅佐天下的人。"}, {"yaoci": "上九：亢龙有悔", "fanyi": "上九：龙向上飞得太高了，便会有后悔的事情发生。", "jiedu": "客观形势上处于极盛，在主观意识上也满盈了，到了止进而退的时候，如果进而不退就要走向反面。凡事不可以走极端，就像人不能吃得过饱。由于阳升阴降，上九无法下降到九五之位。就好比君王已经把位子传给了太子，自己没权利了，没有考虑好退路，便开始后悔。"}, {"yaoci": "用九：见群龙无首，吉", "fanyi": "用九是乾卦独有的一个爻。在乾卦六爻全变的时候才取用。此爻意思是：出现一群龙而没有首领，不过每条龙都能各尽其职，这很吉祥。", "jiedu": "各卦爻辞都只有六个，唯独乾卦多出“用九”、坤卦多出了“用六”。“用九”意味着六个阳爻全变为阴爻，乾变为坤。“用六”意味着六个阴爻全变为阳爻，坤变为乾。这表现了乾坤互相转化的思想。“用九”所得之卦既不完全是乾，也不完全是坤。是乾，却将变为坤；变坤，却又仍然是乾。他处在乾坤转变之中，刚健与柔和二者兼备。刚健者勇于进取，其弊是咄咄逼人；柔和者亲切宽厚，其弊是软弱被动。两者兼备，尽善尽美。爻辞说，群龙无首会吉祥，尽管没有首领，但每条龙都各尽其职，做好分内事。这是统治者最高明的统治方法，也就是老子的“无为而治”"}]}, "2": {"shici": ["象曰：地势坤，君子以厚德载物。", "大地收藏万物，人应该效仿大地的宽厚和包容", "坤卦，初始亨通，利于像母马那样保持温顺的德行。君子有所行动，起初会迷失方向，后得到主人，到西南方向可以得到朋友，在东北方向则丧失朋友。安于正道则会吉祥"], "shuoming": ["坤，元亨，利牝马之贞。君子有攸往，先迷，后得主，利西南得朋，东北丧朋。安贞吉。"], "guayi": ["坤卦运势（事业、爱情、经商、诉讼、出行、人生）\n          本文所属分类：坤卦 \n          \n          运势：不应急进，应退守幕后，含蓄温和、持之以恒、以静制动。\n          \n          事业：获得支持、与人合作则吉。不可冒险急进或独断专行。适合当副手。\n          \n          爱情：进展缓慢，欲速则不达，急则有失，缓则易成。\n          \n          疾病—多为慢性病。阳气为元气，过弱，所以抵抗力弱。宜向东南方求医。\n          \n          经商：机遇不佳，不应冒险，应固守本分，稳健保守，小心为上。\n          \n          诉讼：会因田土之事产生争执，为有始无终之象，宜和解。\n          \n          出行：出行者未归，可能将有音信，如果是官事，有走失的可能。\n          \n          人生：仕途上难有发展，适合从事文化类工作。有宗教倾向，易信仰女神。"], "yunshi": [{"yaoci": "初六：履霜，坚冰至。", "fanyi": "初六：当脚踩到霜的时候，应该明白结冰的日子快到了。", "jiedu": "要见微知著，防微杜渐。所以，一开始就要谨小慎微。这正是阴柔品格的特点和优点。不但要细心觉察微小迹象，还要从中预测发展趋势。一叶知秋，而这种见识还不够高远，应该在夏天就预见到秋天的霜与冬天的冰，这便是文王的智慧，也是为臣者必须具备的远见。"}, {"yaoci": "六二：直方大，不习无不利。", "fanyi": "六二：正直、方正、大方，不反复没有什么不利的。", "jiedu": "当处于有利的位子上时，要充分发挥自己的能力。而且要正直、端方、胸襟阔大，做到这三点，并且做事不反复无常，才会得到君王的重用，担负起辅佐之重任。坤以乾为主，顺乾而行，乾动而坤应之即可，自己不必另有作为。如此行事对于坤来说是最佳的，无往而不利。"}, {"yaoci": "六三：含章可贞，或从王事，无成有终。", "fanyi": "六三：蕴涵美德可以坚守正道，或者效力于君王，虽然没有成就但却有好的结果。", "jiedu": "功业小成，接近于上层，但形势不利，需要谨慎，以免猜忌。为君王做事不要过于显露自己的才华，有功要归于君王。如果能不露锋芒，做成了事也不专有其功，功成而不居功自傲，采取外表糊涂内心明白的方式，便能获善终。这是很难达到的修养。"}, {"yaoci": "六四：括囊，无咎无誉。", "fanyi": "六四：将口袋的口束紧，没有灾难也没有荣誉。", "jiedu": "天地闭塞，处境尴尬，在嫌疑是非之地，贤人应当隐退，怀着大智慧观察时局的动态，归隐保全以等待出仕的时机。为了免遭猜忌谗谤，要像囊袋扎口一样勿言勿动，非如此不能逃祸。恶不可为，善也不可为，恶不为则无咎，善不为则无誉。既没有过失，也没有荣誉，这便是免祸之道。"}, {"yaoci": "六五：黄裳元吉。", "fanyi": "六五：黄色的下衣，大吉大利。", "jiedu": "地位极高，但仍保持柔顺的本性，恭顺谦下，这是大吉之兆。君子处在六五的地位上，应保持自己中庸的本色。如同大权在握的诸葛亮，位极尊崇，而对后主刘禅仍然恭顺谦下，鞠躬尽瘁。这种精神来自内心的忠诚。所以诸葛亮始终吉星高照，左右的小人屡次想陷害他而不能得手。”"}, {"yaoci": "上六：龙战于野，其血玄黄。", "fanyi": "上六：与龙在旷野厮杀，旷野到处是青与黄色的血迹。", "jiedu": "阴气受到阳气的猜疑，必然要发动战争。因为六爻全是阴气，使阳气怀疑自己失去了地位。坤阴发展到了极盛，一反柔顺从阳的本性，要与乾争个高低，局面很糟糕，势必两败俱伤，血流遍野。因此，此时的辅佐者要居卑而静，事业声誉极盛时要警惕争斗的局面。"}, {"yaoci": "用六：利永贞。", "fanyi": "用六：利于永远坚守正道。", "jiedu": "六个阴爻都要变为阳爻，坤卦将变而为乾。虽变为乾，坤性仍存，但带有乾的精神。阴柔中带有阳刚之质，有利于永久守持坤道。正如主宰者乾虽应刚健却不应刚愎自用一样，辅佐者坤阴虽应柔顺却不应一味附和。乾卦用九是刚而能柔，坤卦用六是柔而能刚。刚柔应该相济。这里说明了臣道的原则便是永贞，这也是为妻之道的原则。永远忠贞，才可以得到大的善终。这好比周公称王摄政。武王死后，十多岁的成王继位。周公取代了成王来治理国家，巩固了政权后又把王位转给了成王，自己退回到臣子的位置上，这便是“永贞”。"}]}, "3": {"shici": ["象曰：云雷屯；君子以经纶。", "在艰难中行动，要处处小心", "乾坤两卦象征天地，其余六十二卦象征由乾坤相交错而生的万物。屯意为“初生”，象征万物始生状态，故以屯作为乾坤二卦始交而产生的第一卦。此时万物处在一片混沌中"], "shuoming": ["屯，元亨利贞，勿用有攸往，利建侯。"], "guayi": ["运势：身处困境，多有困惑，欲进难进，应坚守不出，试图解决困难。\n\n          事业：万事开头难，应小心翼翼，修心养性，观察时机，静以待变。\n          \n          爱情：感情发展受阻，多波折，双方都不妥协。多为男性得利、女性失利。\n          \n          疾病：病在手足、肠胃、泌尿生殖系统或神经系统，应往东北方求医。经商—创业初期，步履维艰，若无法打开出路，应退守保全，等待机会。\n          \n          诉讼：有阻碍，为凶象。如果对方借钱给我方，吉。\n          \n          出行：二人同行，中途有阻。需防口舌。\n          \n          人生：多出生在社会底层。适合晚婚。不应久居家中，或信仰宗教。"], "yunshi": [{"yaoci": "初九：磐桓，利居贞，利建侯。", "fanyi": "初九：像大石与木柱一样坚定，有利于居守正道，宜于树立王侯的威信。", "jiedu": "创始期不能轻举妄动，应在坎险之前徘徊不进。如同心怀大志而处于下层岗位的员工。举个例子，日本东京帝国酒店聘用了一名妙龄女郎，其工作是洗厕所，开始时她感到反胃，但一位领导给她做了示范：他耐心地将厕所洗干净后，用杯子从中盛了一杯水，一口气喝光了。她受到了启发，于是极其自信地打扫起了厕所。她就是后来的邮政大臣野田圣子。人处在低贱的岗位上，只要胸怀大志，便并不下贱。"}, {"yaoci": "六二：屯如檀如，乘马班如。匪寇婚媾，女子贞不字，十年乃字。", "fanyi": "六二：坎坷难于行进，骑在马上盘旋前进。不是贼寇，而是来求婚的人。女子坚守正道不出嫁，十年后才出嫁。", "jiedu": "力量柔弱，在艰难创始时，自身无力。虽有高昂的斗志，但在坎险之前只能徘徊彷徨。六二表明天地间云雨过后，万物便生长起来，此时人们开始了婚姻活动。但女子并没有嫁给前来的求婚者，求婚者是有权势的九五。居中的六二与初九两小无猜，她在等自己喜爱的初九事业有成以后，与他成婚。所以说择偶的要点不在于金钱、地位，只在于是不是意中人，以及他是不是胸怀大志。这位有眼光的六二在十年后嫁给了事业有成的初九。"}, {"yaoci": "六三：即鹿无虞，唯入于林中，君子几不如舍，往吝。", "fanyi": "六三：追逐野鹿却没有猎官做向导，只有迷入山林之中。君子胸怀机智，不如舍弃，再往前走会有灾难。", "jiedu": "六二讲的是婚姻故事，六三讲的是打猎故事。本性决定他躁于进取，有所贪求，如果不及时停止，不仅徒劳，还会陷入困境。如同一个人追着一头鹿来到了森林中，这是一片陌生的森林，他没有向导而急于得到这只鹿，面临迷路的危险。继续追还是放弃？这个人是明智的，他选择了放弃。如果只想拥有而不愿放弃，最终吃亏的是自己。"}, {"yaoci": "六四：乘马班如，求婚媾，往吉，无不利。", "fanyi": "六四：骑马团团打转，前去求婚，前进吉祥，没有不利的后果。", "jiedu": "爻辞说，一队人乘着四匹马拉的车缓慢行进，马队还团团打转，这是去求婚，没有什么不利的。举例来说，美国有一位很富有的喜剧大师，但他一直没有意中人。一天他骑自行车外出，在街上遇到一位姑娘，这位姑娘的美丽深深打动了小伙子，他发挥自己的幽默天赋，进行别致的自行车骑术表演。姑娘被逗乐了，最后两人结为连理。"}, {"yaoci": "九五：屯其膏，小贞吉，大贞凶。", "fanyi": "九五：屯聚云雨，雨小则吉祥，雨大则凶。", "jiedu": "凡事不可太过。比如丈夫爱妻子、爱子女、爱工作是好事，但如果太过分便会产生不好的后果。过分爱妻子往往会使妻子产生依赖心理；过分溺爱子女不利于子女的成长；过分爱工作会忽略对家人的关心。爻辞主要说明了婚姻上的过火行为的害处。如同上古时期的男人抢新娘，抢回来后便是自己的财产，做妻做妾或做奴随男主人的心意。”"}, {"yaoci": "上六：乘马班如，泣血涟如。", "fanyi": "上六：骑在马上艰难行走，泣血涟涟，泪如雨下。", "jiedu": "爻辞说，男方的人马抢了新娘子，结果新娘子在途中又跑了回来，男方再来抢，新娘途中又跑，泣血涟涟，泪如雨下。崇尚礼制的大才子周公也感叹：这种婚姻怎么会长久？现在有不少男女结合并非是出于自己的心愿，有的是因为父母的强迫，有的是由于年龄大了没办法，有的是未婚先育不得不结婚，但愿人们能从古代的抢婚制中吸取教训，明白强扭的瓜不甜的道理。"}]}, "4": {"shici": ["因为有险而停滞不前，所以蒙昧不明", "屯为初生，蒙为蒙昧。事物发展的初期阶段多处于蒙昧状态，所以需要启蒙教育。蒙是一种蔓草，茂盛时将树木遮蔽，其下阴暗，表示在无知蒙昧的幼儿状态，启蒙是当务之急"], "shuoming": ["蒙，亨。匪我求童蒙，童蒙求我。初筮告，再三渎，渎则不告。利贞。"], "guayi": ["蒙卦运势（事业、爱情、经商、诉讼、出行、人生）\n本文所属分类：蒙卦 \n\n运势：初时迷惑，不知方向，应忍耐，多听他人，尤其是长辈的意见。\n\n事业：初始阶段，混乱无序，胆小、不果断，应接受教育，避免好高骛远。\n\n爱情：矛盾多现，难以沟通，缺乏勇气。应注意对方品德，宽容理解。\n\n疾病：病情不明，反复难治。应做好长期抗战的准备。可往西北方求医。\n\n经商：应小心谨慎，不可急功近利、贸然行事，更不宜为他人作担保。\n\n诉讼：案情纠结很久，事态不明朗，难以结案。\n\n出行：不宜出去，否则破财且有是非。如果要找人，寻找方向很难定。\n\n人生：应终生学习，求知不止。从事不断读书学习的行业会受益匪浅。"], "yunshi": [{"yaoci": "九二：包蒙吉；纳妇吉；子克家。", "fanyi": "九二：包容蒙昧，吉祥。娶妇吉祥。儿子可以持家了。", "jiedu": "聪明人能够包容蒙昧的人是吉祥的。本爻就是能包容蒙昧的受教者。爻辞中说，不要娶见了有钱的男人就会失身的女子。俗话说“人比人，气死人”，再有钱的男人，也会遇到比自己更有钱的男人。"}, {"yaoci": "六三：勿用取女；见金夫，不有躬，无攸利。", "fanyi": "六三：不要娶这个女子，她见到有钱的男人就失去了自身的体统，没有什么好处。", "jiedu": "此爻也是一个受教的蒙童，但却是一个不可教的人。他的品性恶劣，凌辱位卑而中正刚明的良师九二，攀附与他同样不中不正而处于极位的上九。教育不是万能的，朽木不可雕。不过，逐出师门、弃而不教、鸣鼓攻之，有时候这些也是施教的特殊方式。六三也代表多夫的女子，在男权社会，这种女人肯定没有市场。在私有制的社会，谁娶了这种女人都不会有好结果的。"}, {"yaoci": "六四：困蒙，吝。", "fanyi": "六四：被困在蒙昧中，有忧吝。", "jiedu": "六四得不到明师的教化，周围都是蒙昧阴暗之气，本身又气质昏暗，亟待教化。如同流浪街头的少年犯、弃学经商的儿童。六四处于艮卦的下面像被一座山压着，难逃被困的命运。不过由于六四得位，所以不会有凶险，只是有些忧吝。"}, {"yaoci": "六五：童蒙，吉。", "fanyi": "六五：儿童的蒙昧，吉祥。", "jiedu": "全卦中只有九二和六五是吉的。九二启迪群蒙，是有道的老师；六五居尊谦逊，是好学的君子。九二与六五正应，是理想的师生关系，当然是吉祥的。儿童的蒙昧，是天真无邪的表现，没有人会因为儿童的无知而生气，正因为儿童的无知才会产生强烈的好奇心、求知欲望，并且儿童柔顺而谦虚，听大人的话，是大人保护的重要对象，怎么会不吉祥呢？"}, {"yaoci": "上九：击蒙；不利为寇，利御寇。", "fanyi": "上九：用武力对付蒙昧，不利于追杀贼寇，利于防御贼寇。", "jiedu": "蒙卦的两个阳爻代表两种施教方法不同的师长：九二能够包容群蒙，治之以宽，叫“包蒙”；上九则高居上位，刚极而不中，以严厉措施治蒙，叫“击蒙”。蒙师不同，治蒙方式也各异。“击蒙”容易产生弊病，要注意分寸。可采取适当的严厉之举，但不能超越限度，能防止对方作乱就可以。如果举动暴烈，击之过猛，怎能教育别人？"}]}, "5": {"shici": ["因为前面有险阻，所以应该等待时机", "本卦在蒙卦之后，因为在启蒙之后，民智大开，寻求发展，遇到险阻，这时不可急躁。这里需要“等待的哲学”。耐心待时，这里面大有文章"], "shuoming": ["需，有孚，光亨，贞吉。利涉大川。"], "guayi": ["需卦运势（事业、爱情、经商、诉讼、出行、人生）\n本文所属分类：需卦 \n\n运势：不应冒险前进，投机急取反而失利。应待时而行，大器晚成。\n\n事业：不可轻举妄动，应审时度势，保持冷静，积蓄实力，等待时机。\n\n爱情：初始时为多事之秋，不如意。应耐心等待，逐渐培养感情。\n\n疾病：此卦为“游魂卦”，多为长期之病，病情拖延，疗效不明显。\n\n经商：情况困难，应以极大的耐心创造条件，观时待变。切莫功亏一篑。\n\n诉讼：案情可能与女人有关，眼下还没有清晰的头绪。出行—有贵人和合，也有得财禄之喜。若寻人，在近处，不久会遇见。\n\n人生：能力够用，但并不十分突出。事业达到巅峰也不会成为顶级人才。"], "yunshi": [{"yaoci": "九二：需于沙。小有言，终吉。", "fanyi": "九二：在沙滩上等待，有些小的口舌是非，最终是吉祥的。", "jiedu": "渔民的生活不错，虽然比不上当朝的士大夫，但却也悠哉游哉，可以吃到不少海鲜。只是会发生一些口舌事非。因为需卦下面的互卦为兑，兑即含有口舌之意，九二正处于兑卦的最下，并且九二与初九和九三同性相斥，所以会有些小口舌。不过兑卦也有喜悦的含义，并且九二居中，所以说九二这个渔民的生活还是悠哉游哉，最终吉祥的。"}, {"yaoci": "九三：需于泥，致寇至。", "fanyi": "九三：在淤泥中等待，导致贼寇来到。", "jiedu": "九三如同一群人在淤泥中捕鱼或捕捉猎物，结果陷入泥中不能自拔，这时一群贼寇过来了，抢走了淤泥中的猎物。处于这种情况怎么办呢？人在矮檐下，不得不低头，好汉不要吃眼前亏。人类在蒙昧时期，常用惊吓的方法把猎物赶到沼泽地里，再进行捕捉，但此时会有其他原始群的人们过来抢夺猎物，此爻反映的便是这种捕猎的缺点。"}, {"yaoci": "六四：需于血，出自穴。", "fanyi": "六四：在忧患中等待，从洞穴中逃出。", "jiedu": "已经进入坎险中，并且受伤，极其危险，只有在血泊中冷静地等待脱险的时机。顺应形势，听从变化。能够如此行事，终究会化险为夷。比如周文王被商纣王囚于羡里，镇定自若，静待形势变化，同时潜心研究八卦，最后终于获释。这种气度非凡人所能及。"}, {"yaoci": "九五：需于酒食，贞吉 。", "fanyi": "九五：在酒食宴乐中等待，守正道则吉祥。", "jiedu": "处于危难中，朝不保夕，给你酒食能吃得下么？九五能若无其事地品尝酒食，处变不惊，履险如夷，这才是处险待时的大境界。没有大胸襟、大气魄、大智慧是很难达到这地步的。如同孔子对颜回的赞美：“贤哉回也！一箪食，一瓢饮，在陋巷，人也不堪其忧，回也不改其乐。贤哉回也！”"}, {"yaoci": "上六：入于穴，有不速之客三人来，敬之终吉。", "fanyi": "上六：进入洞穴，有不请自来的三位客人来到，尊敬他们，最终会得到吉祥。", "jiedu": "已经到了坎险的极端，终于掉进陷阱中，无法脱身，只有等待外援。和上六有正应关系的是九三。九三会主动救上六。同时带动九二和初九，三阳并进，同来增援，很像富有侠义精神的“三剑客”。三阳虽然地位低下，但是勇武有力，忠肝义胆，上六地位虽高，但这时要尊重来自下层的义士，不能显示出丝毫架子，如此才能上下契合。幸好上六属阴，敬重三阳，终于获得救援。"}]}, "6": {"shici": ["象征人们各怀私心，在争夺利益时引发斗争", "讼卦上为天，下为水。日月星辰从东往西转，地上的江河水流则从西往东流，二者是反方向运行的。古人看到这一现象，联想到在反向中存在着矛盾，预示着争讼的可能。“讼”就是诉讼。…"], "shuoming": ["讼，有孚窒。惕中吉。终凶。利见大人，不利涉大川。"], "guayi": ["讼卦运势（事业、爱情、经商、诉讼、出行、人生）\n本文所属分类：讼卦 \n\n运势：百事不顺，事与愿违，伤害频繁，小人加害。息事宁人为上策。\n\n事业：起初顺利，有利可图，继而受挫，退让可化解矛盾或意外之灾。\n\n爱情：是非频频，反复不定，有口舌之争、散离之象，应温和协调。\n\n疾病：此卦为“游魂卦”，多病之象，病情严重，应往西北方求医。\n\n经商：吃亏是福，和气生财。坚持互利的原则，尽量避免冲突。\n\n诉讼：矛盾由言语口舌之事引起，不宜再起风波，应撤诉。\n\n出行：不利，可能有口舌是非。若与公差之人同行则吉。\n\n人生：年轻有为，自视较高，适合辅佐他人。也适合公检法的工作。"], "yunshi": [{"yaoci": "九二：不克讼，归而逋，其邑人三百户，无眚。", "fanyi": "九二：官司败诉，回来后便躲起来，他采邑中的三百户人家不会受到牵连。", "jiedu": "地位和形势都极为不利。与九五处于相对位置，九五势不可敌，两刚相遇而不相应，造成争讼。九二居下，必然吃亏，祸患将俯拾皆是。幸亏九二很快就明白了过来，发现官司不能再打下去，立即打退堂鼓，退出争讼，急流勇退，十分明智。"}, {"yaoci": "六三：食旧德，贞厉，终吉，或从王事，无成。", "fanyi": "六三：吃祖宗留下的余荫，守正道有危险，最终会吉祥。或者为朝廷效力，没有成就。", "jiedu": "六三与世无争，只想安享俸禄，保持既得利益，可以靠祖宗留下的余荫生活，不与人争，自然吉祥了。六三与上九相应，上九为宗庙之位，所以有六三受益于宗庙的卦象。古语有“功高盖主”、“狡兔死，走狗烹”的说法，故在下者对在上者，切忌以功自居，唯有这样，“无成”才能“有成”，这即是人生的辩证法。"}, {"yaoci": "九四：不克讼，复即命，渝安贞，吉。", "fanyi": "九四：不能胜诉，回来后承认自己命该如此，开始变得安分于正道，吉祥。", "jiedu": "与初六相对，以上压下，以强凌弱，不得人心。初六以柔克刚，退而不争，仅仅解释几句就使九四理屈辞穷。九四阳刚好争，见到自己在道义上失败了，赶快转弯，改变蛮横态度，修正行为，改弦易辙，丢掉一点小面子不算损失。他的可贵之处就在于回头和改变，变刚为柔，化讼为和。像是《水浒传》中的李逵。"}, {"yaoci": "九五：讼元吉。", "fanyi": "九五：裁决人们的争讼，大吉。", "jiedu": "讼卦中只有九五是听讼之主，其余五爻都是诉讼之人。九五是个贤明的法官，象征刚健中正、明快无私的主讼者，能明断曲直，让人心悦诚服，而无不平之气，这是最大的吉祥。这也反映出平民对明镜高悬的公平法官的期待，所以包拯被呼为包青天。"}, {"yaoci": "上九：或锡之鞶带，终朝三褫之。", "fanyi": "上九：受到君王赐给的腰带，一天之内就三次被夺。", "jiedu": "六三顺从上九，使得上九不讼而获胜，并因此而升官。这只是由于遇上了退让不争的六三而占了便宜。一般来说，这种强讼不止的人没有好下场。通过争讼而获得的高官厚禄也极不光彩，必然受到谴责，而且保不住，甚至在一天内被君王连下三道命令加以剥夺，被拔去顶戴花翎。身败名裂，咎由自取。"}]}, "7": {"shici": ["象征引众犯险，带来伤害", "上一卦讼卦讲争讼，若没解决矛盾便会升级为战争，所以讼卦之后是师卦。师是兵众的意思，是古代军队的一级编制。“师”就是两千五百人的编制，引申为战争之意，有战争必有忧患。…"], "shuoming": ["师，贞，丈人，吉无咎。"], "guayi": ["师卦运势（事业、爱情、经商、诉讼、出行、人生）\n          本文所属分类：师卦 \n          \n          运势：养兵聚众、出师攻伐则彼此有伤。忌独断专行，应提防潜在敌人。\n          \n          事业：阻力很大，应谨小慎微，与他人密切合作，不贪功。忌盲目冒险。\n          \n          爱情：外柔顺而内险恶，易有不和，求婚难成，应防多角关系、口舌冲突。\n          \n          疾病：虽非绝症，但病况严重，需尽快找出原因。宜往南方或北方求医。\n          \n          经商：已有积蓄，可做大事，但易卷入商战。加强沟通可摆脱困境。\n          \n          诉讼：若有贵人参与则吉，先有忧，后有财。出行—行人已在途中。若寻人，会有公事阻隔，较难相见。\n          \n          人生：好为人师，适合当老师、律师、军人。与人竞争容易获得成功。"], "yunshi": []}, "8": {"shici": ["象征亲密比辅，但应比辅于有德的长者", "甲骨文中的“比”字是两人步调一致，并列、并排之象。比卦表示地上有水，象征着大地承载流水。如果没有水，地就会成为沙漠，如果没有地，水就没有地方可以停留，所以地与水亲密无间…"], "shuoming": ["比，吉。原筮元永贞，无咎。不宁方来，后夫凶。"], "guayi": ["比卦运势（事业、爱情、经商、诉讼、出行、人生）\n          本文所属分类：比卦 \n          \n          运势：应速战速决，不可迟疑。适合做短平快的事情。与人相亲为吉。\n          \n          事业：有亲密的伙伴相助，相互扶持，应注意择友，多与贤良者交往。\n          \n          爱情：婚恋跟随世风。两相情悦，彼此忠诚，有桃花但不影响感情。\n          \n          疾病：阴气紧密侵入阳体，久病则难医，近病速解可救。宜往东方求医。\n          \n          经商：与他人合作会有丰厚利润。唯利是图、贪心不足会导致严重损失。\n          \n          诉讼：局面较为平稳，宜和解，只需两日便见分晓。\n          \n          出行：内忧外吉，中途有相识人说话，且志趣相投，路也不远。\n          \n          人生：性格乐观，缺乏长远的计划，心思和行动都快，容易追风，有投机心理。"], "yunshi": []}, "9": {"shici": ["风行天上表示政令迅速普及全国，蓄养鸡马表明财富小有积蓄", "前面的比卦描述了君臣相亲、上下和谐的状态，这有利于经济建设，积蓄随之而增多。比卦之后的小畜卦就是小有积蓄的意思。《易经》中有小畜卦和大畜卦之分，其差别主要在于积蓄的少与多。…"], "shuoming": ["小畜，亨。密云不雨，自我西郊。", "小畜卦，亨通。浓云密布却没有下雨，从我西郊的上空压过来。"], "guayi": ["小畜卦运势（事业、爱情、经商、诉讼、出行、人生）\n          本文所属分类：小畜卦 \n          \n          运势：有阻止、反复难调之意，应忍耐，有节制，蓄养实力，静待时机。\n          \n          事业：应耐心而积极地积存力量，不可冒险行动。对于所得应满足，适可而止。\n          \n          爱情：不融洽或有观点分歧，或遭受长辈反对，或有第三者插足，要耐心应对。\n          \n          疾病：少有疾病，身体健壮。若重病则难治，慢性病较危险，宜往南方求医。\n          \n          经商：已有基础，但已失去，要慎重。争取合作，戒除贪心，适可而止。\n          \n          诉讼：败诉的可能性很大，因为有阴险小人从中作梗。\n          \n          出行：受到风雨的阻碍，出门将较为不利。若寻人，可能有两人到来。\n          \n          人生：适合在幕后，多为偏职副职，适宜于在大人物之后工作。宜亲近佛教。"], "yunshi": []}, "10": {"shici": ["象征君王言而有信，履行承诺，广施恩泽于民众", "履是踏、实践的意思，实践就会遇到危险，要战战兢兢、如履薄冰而行。虽有险难，但多为有惊无险，能平安度过，为小凶带吉之象。如同卦辞所说，“履虎尾，不咥人”。…"], "shuoming": ["履虎尾，不咥人，亨。", "踩在老虎的尾巴上，虎不咬人，亨通。"], "guayi": ["履卦运势（事业、爱情、经商、诉讼、出行、人生）\n          本文所属分类：履卦 \n          \n          运势：反复不和。先劳后逸、始惊后安。不应急进，应反省并请教于长辈。\n          \n          事业：起初不顺，受到威胁，不应逞强、急于求成。应提高警惕，量力而行。\n          \n          爱情：两情相悦，但阻碍重重，不易成功。也有先苦后甜之象。\n          \n          疾病：多为慢性病，糖尿病、肝病等。心腹疼痛，行动不得，可往西方求医。\n          \n          经商：财运尚可，不要为小利而动摇计划，更不可贪得无厌，应全面了解信息。\n          \n          诉讼：对方主动来侵犯我方，官司可能有头无尾，不了了之。\n          \n          出行：当前的态度是举棋不定，利于远行，如果不是出远门则失利。\n          \n          人生：为人活跃，喜欢游走。但信义方面有所欠缺。适合以文字工作进入仕途。"], "yunshi": []}, "11": {"shici": ["象征阴阳交合，万物通常，平安稳定\n            前面的小畜卦代表小的积蓄，人们在积蓄中不断发展（履卦），便过上了更富裕的生活。所以履卦之后是泰卦。泰象征通泰无滞，天地交感，因为君子之道占上风，小人之道占下风，正气压倒了邪气。…"], "shuoming": ["泰，小往大来，吉亨。", "泰卦，小的逐渐消失，大的逐渐来到，吉祥而亨通。彖辞说：泰，失小得大，吉祥亨通。"], "guayi": ["泰卦运势（事业、爱情、经商、诉讼、出行、人生）\n          本文所属分类：泰卦 \n          \n          运势：百事吉祥。但应求内实，不求外虚。避免过于活跃，防止乐极生悲。\n          \n          事业：非常顺利，应坚持由小而大、循序渐进原则，居安思危，不因循守旧。\n          \n          爱情：情投意合，良缘缔结。不可任性、放肆妄为，否则会转为冷漠无情。\n          \n          疾病：久病不利，下腹部易有病。心中热结，饮食不进，应往东南方求医。\n          \n          经商：全凭自己闯荡创业。善于积累、固守财产，也易吝啬。\n          \n          诉讼：是三人的事，或因小孩引起，宜和解，不宜打官司。\n          \n          出行：已经动身，有三个人同行，不久之后会相见。\n          \n          人生：适合文化艺术类工作。无法借助家族力量，仕途上不易有大作为。"], "yunshi": []}, "12": {"shici": ["象征闭塞不通，小人得势，君子被排斥\n              所谓“泰往否来”，前面的泰卦亨通到了极点，物极必反地出现了否卦。否的意思是闭塞、变坏、灭绝，上下不和，万事隔绝，不吉到了极点。否卦的天在地上，这本来是自然的情形，怎么会不吉祥呢？…"], "shuoming": ["否，否之匪人，不利君子贞，大往小来。", "否卦，闭塞而没有人道，不利于君子坚持正道，大的离去，小的来到。"], "guayi": ["否卦运势（事业、爱情、经商、诉讼、出行、人生）\n          本文所属分类：否卦 \n          \n          运势：百事不顺，损失较重，稍偏差则有灾害。遇事应忍，否极泰来。\n          \n          事业：陷入逆境、衰退阶段，受小人干扰而不得志，应自保待机。\n          \n          爱情：阴阳相背，是非很多，矛盾难调，易节外生枝，有离别之象。\n          \n          疾病：病多在脑、肺、肾。凶兆，慎防癌症等绝症。可往东南方求医。\n          \n          经商：处境不利。遇到强大的对手，应坚持守势，等待有利时机的到来。\n          \n          诉讼：有不明之事，有口难言，或被人污蔑为小偷，日后会得理，吉。\n          \n          出行：如果还没有出发则平安，已出发者有口舌是非，迟出发则吉。\n          \n          人生：是辅佐型人才。性格上很孤独、孤苦、寂寞。动则生，不动则死。"], "yunshi": []}, "13": {"shici": ["上面一卦是否卦，经历了大的磨难后，人们开始懂得团结的力量，所以接下来便是同人卦。在天底下生起一堆火是同人卦的卦象。这个场面正是上古时期、甚至是原始时期人类的生活写照。…"], "shuoming": ["同人，同人于野，亨。利涉大川，利君子贞。", "同人卦，大家聚集在野外，同心同德，亨通。有利于涉过大川险阻，有利于君子守正道。"], "guayi": ["同人卦运势（事业、爱情、经商、诉讼、出行、人生）\n本文所属分类：同人卦 \n\n运势：百事顺通、平安如意，应掌握时机，维持盛泰。寻求私利则有破败。\n\n事业：与人合作会成功，应广泛建立人脉，克服门户之见，协调多方面的关系。\n\n爱情：谦和相待，互敬互谅，定成美眷。无恋人者可多认识异性，广撒大网。\n\n疾病：多为脑部、神经或呼吸系统之病，头痛腹痛，血气聚心，往东北方求医。\n\n经商：应真诚合作、精诚团结。照顾各方面的利益，求大同，存小异。\n\n诉讼：我方受到侵犯的可能性较大，不久之后将和解。\n\n出行：有人同行，一路上和顺喜悦，没有什么可疑虑的。\n\n人生：喜欢交友，多依靠师友相助。仕途上先有威望后有权势，权势生于威望。"], "yunshi": []}, "14": {"shici": ["前面一卦为同人，众人同心同德，自然会有大的收获，所以接下来是大有卦。同人是我与人同，大有是物归我有。因为我与人同，所以物归我有。火着到了天上是大有卦的卦象。…"], "shuoming": ["大有，元亨。", "大有卦，大的亨通。"], "guayi": ["大有卦运势（事业、爱情、经商、诉讼、出行、人生）\n            本文所属分类：大有卦 \n            \n            运势：得时得运，隆盛昌荣。但物极必反，有盛极而衰的预兆，不得不慎。\n            \n            事业：已有成就，应戒惧谨慎，大而不盈，满而不溢。得意忘形将有损失。\n            \n            爱情：有情人终成眷属。对女性来说，可供选择者多，以慎重为好。\n            \n            疾病：服药疗效不大。寒热往来，头痛眼昏，胸痛，可往东南方求医。\n            \n            经商：兴隆昌盛，如能克勤克俭，注意动向，适时转轨，可以长久。\n            \n            诉讼：大事可成，小事则有头无尾。以姓名中有“木”的人为贵人。\n            \n            出行：出行到西方则吉。若寻人，到西方可以遇到。\n            \n            人生：在与财富不相关的领域上难有成功。比如农业、水利、教育。"], "yunshi": []}, "15": {"shici": ["谦为谦虚不出风头之意。其卦象为地下有山，内高外低，比喻功高不自居，名高不自誉，位高不自傲，不显山不露水。山本来是高于土地的，但由于谦逊，他甘于埋于地中，体现…"], "shuoming": ["谦，亨，君子有终。", "谦卦，亨通。君子会把事情完成到底，得到好的结果。"], "guayi": ["谦卦运势（事业、爱情、经商、诉讼、出行、人生）\n          本文所属分类：谦卦 \n          \n          运势：吉利平安。谦受益，谦者前途大利；满招损，骄者横行招败。\n          \n          事业：尚未被器重，不必有意表现，谦虚学习，埋头苦乾，终会被发现。\n          \n          爱情：重视家庭的稳定。以谦恭之态相处，可获良缘，反之则失利。\n          \n          疾病：腹部与头部之疾，或旧病复发。病留连难脱，宜往东南方求医。\n          \n          经商：较顺利，但不会获暴利，须逐步积累，要小心谨慎，诚心与人合作。\n          \n          诉讼：纷争包括两三人在内，宜息事宁人。\n          \n          出行：有阻碍但无灾害，虽有口舌但没有严重的后果。\n          \n          人生：有文化修养，但明谦暗争，不适合文字工作，适合经商、仕途。"], "yunshi": []}, "16": {"shici": ["豫的本义是指大象，大象的特点是走路缓慢，一副悠然自得的样子，所以豫卦是阴阳和乐的景象。在卦象上，雷声在大地上空轰鸣，使大地上的万物振作起来，这是大自然生机勃发的表现…"], "shuoming": ["豫，利建侯行师。", "豫卦，有利于建立王侯大业出兵征伐。"], "guayi": ["豫卦运势（事业、爱情、经商、诉讼、出行、人生）\n          本文所属分类：豫卦 \n          \n          运势：万物欣畅，如意安泰，但不能因繁华而怠惰，或沉醉于声色中。\n          \n          事业：十分顺利，但不可放松警惕，陷于懒散享乐。不可玩物丧志。\n          \n          爱情：天赐良缘，一帆风顺，女大于男。但不可掉以轻心，更不可玩弄感情。\n          \n          疾病：肝脏、腹内之疾。气急咳喽，咽喉痛，骨节疼痛，宜往东南方求医。\n          \n          经商：时运已到，应大胆行动，即使发生挫折，也可化险为夷。\n          \n          诉讼：有头无尾，不见官，只破财，事情可能导致有人受牵连。\n          \n          出行：还没出门则有人来访，有好事，不需要疑虑。\n          \n          人生：好动，不安分，适合从事电脑、司机等手脚小动的行业。"], "yunshi": []}, "17": {"shici": ["“元亨利贞”是《易经》中的最高荣誉，在六十四卦中只有六个卦得到了“元亨利贞”的评价，随卦就是其中之一。随表示随遇而安、顺从、随缘、随和，也可以表示有实力者退让一步…"], "shuoming": ["随，元亨利贞，无咎。", "初始亨通，利于坚守正道，不会有灾难。"], "guayi": ["随卦运势（事业、爱情、经商、诉讼、出行、人生）\n          本文所属分类：随卦 \n          \n          运势：有去旧迎新之吉象，与他人沟通协商为吉。三心二意或独立单行则凶。\n          \n          事业：向人学习，择善而从，谦虚随和，会受到器重。但不可趋炎附势。\n          \n          爱情：双方情投意合，重于情欲，依赖心重，感情深厚。\n          \n          疾病：有头疾，咽喉痛，四肢沉重，饮食不安，须长期治疗，宜往西南方求医。\n          \n          经商：顺利。在与他人的合作下能达到预期目的。应多从大处、长远考虑。\n          \n          诉讼：没有大的纷争，但如果不快速处理，将有变化。\n          \n          出行：应随时准备出发。若寻人，其行止不定，要费力寻找。\n          \n          人生：有赌徒心理。喜欢流浪走动，性格优柔寡断，摇摆于两种意见之间。"], "yunshi": []}, "18": {"shici": ["远古时代有些人会一种巫术。他们将一百种有剧毒的虫子放到一个坛子里，然后把坛口封住埋在地下。坛子里的毒虫互相攻击，若干年后只剩下一条最毒的虫子，这条虫子便叫“蛊”…"], "shuoming": ["蛊，元亨，利涉大川。先甲三日，后甲三日。", "蛊卦，大亨通，有利于跋涉大川。适宜于甲日的前三天与后三天。"], "guayi": ["蛊卦运势（事业、爱情、经商、诉讼、出行、人生）\n          本文所属分类：蛊卦 \n          \n          运势：积弊已深，不能进展，气运杂乱，艰难迷惑。应大胆改革，除旧布新。\n          \n          事业：多事之秋，运气不佳，事业衰落，应找出弊端，大胆求变，不惜冒险。\n          \n          爱情：多有障碍艰难。朽木不可为雕，当弃则弃，再婚、另觅新侣为吉。\n          \n          疾病：心腹疼痛，寒热往来，或风劳气急及疮瘤，多为慢性病，宜往北方求医。\n          \n          经商：备受困扰，不应继续走老路。应当机立断，另外找寻出路。\n          \n          诉讼：事关三五个人，开始是对方帮我，后来我侵犯对方，可找姓张的人和解。\n          \n          出行：如果是三人同行，将有矛盾、口舌是非。若寻人，宜急不宜缓。\n          \n          人生：煽动他人、著书立说能成就事业。仕途上没有大发展。"], "yunshi": []}, "19": {"shici": ["临是由上往下看的意思，引申为上级给予、支配、保护下级，是上下亲近的状态。临有大驾光临、贵人来到之意。临又为“君王临幸”之意，是上级对下级之象，贴近群众、亲近下属…"], "shuoming": ["临，元亨，利贞。至于八月有凶。", "临卦，初始亨通，利于正道。到八月有凶险。"], "guayi": ["临卦运势（事业、爱情、经商、诉讼、出行、人生）\n          本文所属分类：临卦 \n          \n          运势：运势渐增，百事亨通，上下安合，前途有望，仕途有成，不应急进。\n          \n          事业：是成功的极好时机，但时运会转瞬即逝，务必抓紧。\n          \n          爱情：加紧进行，全力以赴。在准备充分的情况下不必再犹豫。\n          \n          疾病：夜梦颠倒，狂言妄语，或因酒得病，心腹疼痛，应向东南方求医。\n          \n          经商：十分顺利，但须随时注意动向，防止出现意外，尤其注意人际关系。\n          \n          诉讼：事关三个人，本来想告对方，结果反而是自己受伤，宜和解。\n          \n          出行：三人同行，应该有一人到别处去，自己有疑虑，但不为患。\n          \n          人生：聪明又保守，适合搞文化艺术，无官运。偏好佛教，有灵气，很敏感。"], "yunshi": []}, "20": {"shici": ["观的意思是凝视、清楚地观察，彻底透视其深层原因。此时需静思，静思比行动更重要。观也指众人看天子，这与临卦的天子去看民众正好相反。观察事物的立足点要高…"], "shuoming": ["观，盥而不荐，有孚颙若。", "观卦，在祭祀之前洗净双手，尚未献上祭品便显示出庄严恭敬、无比虔诚。"], "guayi": ["观卦运势（事业、爱情、经商、诉讼、出行、人生）\n          本文所属分类：观卦 \n          \n          运势：阴长阳消，正道衰微，万物难行。处于变化中，应观望时势之利弊。\n          \n          事业：不应轻率行动。不可陷入近视行为中。多培养预见性，注意人心动向。\n          \n          爱情：不顺利，外表看好，内则虚浮，漂动不定。应经受住考验，从长计议。\n          \n          疾病：寒热头痛，或牙疾，病情怪异且变动，不能轻下结论。可往南方求医。\n          \n          经商：形势不稳定，处于变动时期，应随时观察动向，做好退却的准备。\n          \n          诉讼：得贵人的助力，贵人为姓名中带草字头的人。\n          \n          出行：不宜独行，应结伴而行。最好有三四个人结伴。\n          \n          人生：隔山观火之人，易从事文化工作。要成就事业适合于到处走走看看。"], "yunshi": []}, "21": {"shici": ["“噬”即咬的意思。“嗑”是用上下门牙咬有壳的或硬的东西。咬东西与法律有什么关系？上下牙齿相合，象征君民相合，口中的硬物则象征一小撮不法分子…"], "shuoming": ["噬嗑，亨。利用狱。", "噬嗑卦，亨通。利于决断讼狱。"], "guayi": ["噬嗑卦运势（事业、爱情、经商、诉讼、出行、人生）\n本文所属分类：噬嗑卦 \n\n运势：吉凶未定，是个状况卦，偏小凶。百事被阻，去除阻碍才可成功。\n\n事业：阻力很大，应联合各种力量，或采取强硬手段，一鼓作气排除障碍。\n\n爱情：初时多是非，有被阻隔或横刀夺爱之象，应勇往直前，大胆出手。\n\n疾病：病情严重，可能有神经、心脏、足部之症。应往西北方求医。\n\n经商：处境不利，应头脑冷静，明察形势，不得徇私情，更不得触犯刑律。\n\n诉讼：有外面市、县的公事，外人的言辞不可信。\n\n出行：将出门而还没出门，与姓名中有草字头人的同行可免口舌。\n\n人生：适合从事公检法行业，从事其他行业易因财务纠纷引起诉讼是非。"], "yunshi": []}, "22": {"shici": ["贲由“卉”与“贝”组成，花草与贝壳都是古人的装饰品，所以贲卦表示装饰的艺术。质优价廉的产品，如果包装粗劣便不被认同。所以不仅要实干，也应懂得装饰。“文质彬彬，然后君子”…"], "shuoming": ["贲，亨。小利有所往。", "贲卦，亨通，有小的利益，有所交往。"], "guayi": ["贲卦运势（事业、爱情、经商、诉讼、出行、人生）\n          本文所属分类：贲卦 \n          \n          运势：外表好看，内在空虚。落日灿烂，但光明力量渐消，阴暗的力量扩大。\n          \n          事业：好务虚名，不切实际，或半途而废。应收敛自重，追求实质性的内容。\n          \n          爱情：不可自视太高，或过高估计对方，不要为表面现象欺骗，而忽略内涵。\n          \n          疾病：多为非器质性疾病，与情绪有关。头痛手脚无力，可到东南方求医。\n          \n          经商：起初会小有收获，但不可为开始的小利而忽略了长远的目标。\n          \n          诉讼：我方开始占优势，中途开始产生麻烦，最后难以和解。\n          \n          出行：将要出门而还没动身，左顾右盼，举棋不定。\n          \n          人生：善于修饰自己。适宜于艺术性行业，或做不动产投资。"], "yunshi": []}, "23": {"shici": ["过度的奢侈就像腐烂物一样，会逐渐剥蚀盛世的繁荣，使盛世走向衰落。就像我们搞家装一样，过几年墙表面就得剥落，还得重新装修。所以贲卦之后便是剥卦。剥指去掉物体表面上的东西…"], "shuoming": ["剥，不利有攸往。", "剥卦，不利于有所前往。"], "guayi": ["剥卦运势（事业、爱情、经商、诉讼、出行、人生）\n          本文所属分类：剥卦 \n          \n          运势：动荡严重、变化剧烈，厄运缠身，正义被损。大凶象。应重新部署。\n          \n          事业：时运不佳，大势已去，不可抱持野心，应暂停行动，谨慎隐忍。\n          \n          爱情：不顺利，有生离死别之苦。男防桃色纠纷，女防争风吃醋。\n          \n          疾病：有病情恶化之象。手术治疗的效果好。可往东南方求医。\n          \n          经商：进入不景气时期，需要进行整顿，等待时机，东山再起。\n          \n          诉讼：因钱财而产生争斗，若见官则事散，不见官则小心打斗之事。\n          \n          出行：三人同行，不和睦，互相之间多猜疑。若寻人，可向东南方找。\n          \n          人生：喜好炫耀，适合当老板。周围没有剥削的对象时，就会剥削自己。"], "yunshi": []}, "24": {"shici": ["事物都有一个循环往复、周而复始的规律，前面剥卦群阴剥去阴爻，接下来便开始一阳复生。所以剥卦的下面是复卦。一阳来复，使天地出现了生机…"], "shuoming": ["复，亨。出入无疾，朋来无咎。反复其道，七日来复，利有攸往。", "复卦，亨通。出入没有疾病，朋友来访没有灾难。还回其道，七天往返一次，有利于前往。"], "guayi": ["复卦运势（事业、爱情、经商、诉讼、出行、人生）\n            本文所属分类：复卦 \n            \n            运势：春回大地，一阳来复，万事苏伸，即将好转。但初时不应急进。\n            \n            事业：已过难关，但不可操之过急，要冷静思考，一旦有反复，应暂行退让。\n            \n            爱情：顺利，但不可性急，性急则败，缓可得利，应冷静考虑。\n            \n            疾病：为慢性病，可治但不易好，会反复发作，应疗养。可向东方求医。\n            \n            经商：可大胆投资，不要因小挫折而退缩。还可以打入外地，开发新市场。\n            \n            诉讼：事关五个人，没有大的纷争，讨论个三五次就可了结。\n            \n            出行：走到半途后折回，回来后可能又要出门。\n            \n            人生：在仕途上能有所作为。这主要得益于反复，越反复越有利于事业。"], "yunshi": []}, "25": {"shici": ["“妄”字的结构为“亡”字与“女”字相结合，本义是指女奴逃亡。引申为虚妄、极不真实、悖乱的意思。“无妄”便是不可虚妄、不可妄为的意思。阳气的复生使阴气不再妄为了…"], "shuoming": ["无妄，元亨，利贞。其匪正有眚，不利有攸往。", "无妄卦，初始亨通，利于坚守正道。若不守正道则会有灾害。不利于前往。"], "guayi": ["无妄卦运势（事业、爱情、经商、诉讼、出行、人生）\n本文所属分类：无妄卦 \n\n运势：小凶。有空幻、虚妄、不切实际的想法。行为不检点会遭受灾祸。\n\n事业：贵有自知之明，不抱非分之想，检点行为，遵循礼法可防意外灾祸。\n\n爱情：有不顺、不和，有被伤害者欲分离之象。不可轻率或急于求成。\n\n疾病：有虚惊，自愈能力较强，意气用事则凶。宜往西南方求医。\n\n经商：摒弃投机心理，不可勉为其难，不可贪图暴利。\n\n诉讼：多因死伤之事而争斗，适宜和解，但没有贵人出来相助。\n\n出行：还没出门，不久后将有消息，虚惊无大事，不必担忧。\n\n人生：标榜自我，喜欢评说是非。在仕途上易成为行政的一把手、正职主官。"], "yunshi": []}, "26": {"shici": ["人们都不妄为不妄想，社会财富就可以得到大的积蓄，所以在无妄卦的后面是大畜卦。大畜卦象征大的涵养、积蓄、包容精神，也表示大丰收，包括德才、知识、资金、气力等…"], "shuoming": ["大畜，利贞，不家食吉，利涉大川。", "大畜卦，守正道有利。不在家吃饭，吉祥。有利于跋涉大川险阻。"], "guayi": ["大畜卦运势（事业、爱情、经商、诉讼、出行、人生）\n          本文所属分类：大畜卦 \n          \n          运势：应脚踏实地、务实行事。不可好高骛远，气盛凌人，目空一切。\n          \n          事业：应适可而止，有所畏惧，保守面对阻力，不可贪图小利或冒险。\n          \n          爱情：日久生情。虽有阻碍，但终有望。如果气盛凌人则会遭到破败。\n          \n          疾病：病为缓慢形成，有思想负担，心腹浮肿，日轻夜重，往东北方求医。\n          \n          经商：有获大利之象。应循序渐进，保守行事，深思熟虑，忌贪心不足。\n          \n          诉讼：多因田土之争而争讼，事情有头无尾，可能要破财。\n          \n          出行：有一人出来阻拦，迟一些时间可出行。若寻人，会有二人同归。\n          \n          人生：喜欢反复酝酿，幻想不切实际的东西，思考多，行动少。"], "yunshi": []}, "27": {"shici": ["财物有了极大的积蓄后，人们便开始注重饮食的养生之道了。所以大畜卦之后是颐卦。颐卦上为山下为雷，山下怎么会有雷呢？这指的是山崩或地震，因倒塌而埋藏大山表面的万物…"], "shuoming": ["颐，贞吉。观颐，自求口实。", "颐卦，守正道吉祥。看人家吃东西，不如自己谋求食物。"], "guayi": ["颐卦运势（事业、爱情、经商、诉讼、出行、人生）\n          本文所属分类：颐卦 \n          \n          运势：小吉带凶。须慎言，注重细节。任性非为，欠缺周详考虑则有害。\n          \n          事业：不能依赖他人，不可粗心大意，应自食其力，慎言敏行，不贪功。\n          \n          爱情：容易自恋，应加强修养，不傲气凌人。有阻碍时要改进言行，重估利弊。\n          \n          疾病：饮食引起的病症。久病者有险。寒热水痛，服药无效，可往东北方求医。\n          \n          经商：不可急于求成，循序渐进，不断追求新方向，必要时可适当冒险。\n          \n          诉讼：事情有头无尾，是我方起诉对方，最终不了了之。\n          \n          出行：一往一来，事多疑虑，要动而不动，在途中会有相遇之事。\n          \n          人生：注重保健、生命质量。性格小心谨慎，常有怀疑态度，容易颐指气使。"], "yunshi": []}, "28": {"shici": ["大过是大为过度的意思。凡事都要适度，不及或者过头都不好，都要纠正。卦辞中以栋梁弯曲作为比喻。四阳在中间，两阴在头尾，中间过强，两头太弱，然而栋梁是着力于两头的…"], "shuoming": ["大过，栋桡，利有攸往，亨。", "大过卦，栋梁弯曲。前往有利，亨通。"], "guayi": ["大过卦运势（事业、爱情、经商、诉讼、出行、人生）\n          本文所属分类：大过卦 \n          \n          运势：力弱不支，负担过重，势将摧折。大凶。变化是突发的，应慎重行动。\n          \n          事业：危机四伏，此时不应作决策。不可轻举妄动、优柔寡断。\n          \n          爱情：困难重重，双方眼光都很高。他人介绍的姻缘难成，偶遇之人易成。\n          \n          疾病：大凶。女性得此卦多为妇科病、肿瘤等。宜往西南方求医。\n          \n          经商：处于不利地步，操之过急，发展过快，应收缩调整。不可刚愎自用。\n          \n          诉讼：有内贼为患，有姓名中有木的人劝解则吉，但仍然不能了断。\n          \n          出行：外忧内，内忧外，不久将有消息，可能有人相约。\n          \n          人生：仕途上追求一帆风顺。家庭的支撑对仕途有助，否则会发展艰难。"], "yunshi": []}, "29": {"shici": ["象曰：一轮明月照水中，只见影儿不见踪，愚夫当财下去取，摸来摸去一场空。", "习坎，有孚，维心亨，行有尚。\n            \n            坎卦，在重险中有诚信，因为心诚而亨通，行动会有功赏。\n            \n            事物不可能永远是顺利地得以通过，总会有坎坷阻挡，所以大过之后便是坎卦。八纯卦相重都用八卦原名，惟有坎卦称作“习坎”。“习”是重，习坎就是重坎。也就是说坎卦是两个三爻坎卦重叠而成，象征一个陷阱接着一个陷阱，一个险阻接着一个险阻，进也险、退也险，陷中有险，困上加困，进退两难，有灭顶之患。历史上最大的灾难就是伏羲女娲时期的洪水。重坎时期就是洪荒时期，每次洪荒时期都极其危险，坎水灭人丁，使生灵涂炭。\n\n坎卦为四大难卦之一。上卦的坎可代表天上的水，即雨、露、霜、雪、云、雾等，也代表外面来的灾难；下卦的坎可代表地中的水，即河、海、泉、湖、泊等，也代表内部引发的灾难。坎卦内忧外患，可是卦辞中却没有凶险二字，这是怎么回事？原来人类是不怕任何艰难险阻的，因为人类可以克服任何艰难险阻，人类就是在与险难的搏斗中成长起来的。怎样冲破重重险难的呢？只有靠诚信。诚信是人类的大智慧，靠小聪明是无法冲破险难的。\n\n得此卦者应处处小心，随时留意警惕。预测婚姻，多反复折磨，进退难断，受阻难成。男性得此卦有色情之灾，女性也有败节受困之恼。坎卦容易有好的财运，但运转不停的只是过手财富，随来随走。"], "shuoming": [], "guayi": ["坎卦运势（事业、爱情、经商、诉讼、出行、人生）\n           本文所属分类：坎卦 \n           \n           运势：大凶之象。危机重重，应忍辱负重，保持平和，吃得苦中苦。\n           \n           事业：陷入重重艰难中，不可冒险，应镇定自若，运用智慧，静观待变。\n           \n           爱情：自身和外界的困扰和压力都很大。有私奔或分裂之忧，应慎重行事。\n           \n           疾病：久病者凶，近病者速医可救。病在泌尿生殖系统。可向东南方求医。\n           \n           经商：十分不利，甚至面临破产，应保持冷静，不轻举妄动，先求自保。\n           \n           诉讼：因田地或盗贼之事起争讼，须反复二三次争辩，我方有理。\n           \n           出行：有艰险不安之象。若寻人，可到南方坑坝河川之处。\n           \n           人生：要靠自己去打拼，适合农业、水力、养殖等行业，财富会不断聚积。"], "yunshi": [{"yaoci": "初六：习坎，入于坎窞，凶。", "fanyi": "初六：重重险阻，陷入危险的深渊，凶。", "jiedu": "初六是从临卦的五位推移到初位，成为坎的最下一爻。自己走错路，掉到坎下之坎。落入坎中就不易出来，再落坎下之坎，陷得太深了，无法出来，故凶。陷入困境，是因为没有固守正行，加上自身的性格软弱和能力不足，没有外人帮助，遭致凶境也就是必然的了。"}, {"yaoci": "九二：坎有险，求小得", "fanyi": "九二：坎中有险，小的要求会得到满足。", "jiedu": "求取小有所得，是还未从中走出。九二也在下坎之中，在中位，行为不失中，又有初六比邻，故有得。但仍未离开坎中，故有险；上下有两个柔爻相辅，所以有所得。虽然获得了一些小的成功，但是仍然处于险境之中，这点小问题的解决并不能改变大趋势。此时尚未脱离危险。"}, {"yaoci": "六三：来之坎坎，险且枕，入于坎窞，勿用。", "fanyi": "六三：来去都是险阻，险境很深，小心落入危险的深渊，不要有所行动。", "jiedu": "进入坎陷之中，满地都是险，进入坎陷丛里去了，拔不出腿来，不会成功。这一爻与上六爻相互呼应，表明这时处在危险的最底端，难以获得安全的保证，只有暗自等待，万不可轻率行事。这个时候向前进发和向后退却都会招致祸患，不如苟且自守，如果急于获得安宁，反而会带来更大的危机，不利于走出险境。"}, {"yaoci": "六四：樽酒簋贰，用缶，纳约自牖，终无咎。", "fanyi": "六四：一樽酒，两盘供品，用瓦缶装着酒与供品，安置在窗户边，最终不会有灾难。", "jiedu": "在艰难的境况中能诚信交往，刚柔并用，就可以避开灾难。好比舜治理天下的时候，水灾泛滥，而大禹则主动向帝尧提出要担任治水的重担。他不负众望，呕心沥血十三载，三过家门而不入，最后终于成功地制伏了水患。而舜因此把天子的位子禅让给大禹。可见，心怀诚信会得到好处。"}, {"yaoci": "九五：坎不盈，只既平，无咎。", "fanyi": "九五：水流动而不满盈，仅与河床水平。没有灾难。", "jiedu": "土坑中的水还没有溢出来，但是已经与地面平齐了，表明灾害还没有降临。很多灾难是由于骄傲造成的。据史料记载，在太戊执政之前，商王朝出现了衰落的局面，内忧外患不断，天灾人祸频频，一些诸侯国趁机进行叛乱，以摆脱商朝的控制。太戊执政后任用贤臣，励精图治，使商朝呈现“中兴”的大好形势。"}, {"yaoci": "上六：系用徽纆，置于丛棘，三岁不得，凶。", "fanyi": "上六：用绳子捆住，放到丛棘中，三年不能够解脱，凶险。", "jiedu": "古代监狱的围墙上为了防止犯人逃跑，往往放着一些有刺的荆棘，所以此处的“丛棘”也代指监狱。“三岁不得”按现在的话来说便是给判了三年徒刑。上六为什么会犯罪呢？象辞的解释是“上六失道”。也就是说，水本该向下流，可是上六却居于坎卦的最上面，所以违背了水的运行之道而导致凶险。"}]}, "30": {"shici": ["离，利贞，亨。畜牝牛，吉。\n            \n            离卦，利于守正道，亨通。畜养母牛，吉祥。\n            \n            陷入坑里，肯定会附着在一处地方，所以坎卦之后是离卦。古字的“离”是“鹂”的本字。古人认为太阳便是一种神鸟，所以离的引申义也指日。又由于日光是光明、温暖又酷热的，离便又有光明、火、火热的含义。鸟不能总是飞翔，经常会停落在某处，于是离又有依附、附丽的意思。又由于黄鹂鸟总是成双成对地飞翔，所以离又有雌雄相依，阴阳相对的含义。\n\n前面的比卦是紧靠、并列的依附，强调的是一方亲近地辅助另一方，侧重于亲辅关系；离卦强调一方密切地依附于另一方，侧重于主从之间的依附关系。人是需要互助依存的。但依附行为并不等于有依附人格，也并不妨碍独立人格的发展成长。应该把“依附”看作是一种手段，而不是目的。\n\n得此卦者，心不易定，事物易变化，性急者易败事。有先凶后利之象。与人不亲和，易有损失。在婚恋上追求纯粹的感情交流。容易有艳遇，但当桃花运进入到肉体关系阶段时会形成纠纷困扰。男性得此卦，有良女为友。女性得此卦，有红杏出墙的可能。预测婚姻，女方无定性，有败丈夫之财之象。若是再嫁之女则有获得好配偶之象。"], "shuoming": [], "guayi": ["离卦运势（事业、爱情、经商、诉讼、出行、人生）\n            本文所属分类：离卦 \n            \n            运势：六冲卦，大吉大凶之象。外表极盛，但可能为虚假之象，内情多不实。\n            \n            事业：已达到顶点，耀眼靓丽。但盛极而衰，应居安知危，寻求依托，求助他人。\n            \n            爱情：热情奔放，相互依附，但不应性急，否则会弄巧反拙。请他人搭桥为吉。\n            \n            疾病：情绪浮动，虚火旺，急病有解，久病则凶。宜往西北方求医。\n            \n            经商：不可投机取巧、急于求成。应忧深虑远，与他人合作，或依附强势者。\n            \n            诉讼：我方发动，则会有凶险，宜找姓名中有木的人调停。\n            \n            出行：在外多凶险。若寻人，不宜去寻，若有消息皆为虚假。\n            \n            人生：在事业上无法依靠家人，多为独立自主。仕途上一旦有发展就会衔阶较高。"], "yunshi": [{"yaoci": "初九：履错然，敬之无咎。", "fanyi": "初九：做事井然有序，错落有致，恭敬行事不会有灾难。", "jiedu": "刚上场就乱了步伐，处离之始，以刚居刚，处于刚刚依附于人之时就躁动冒进。这时还没有得到对方的信任，也不知应该如何做事，行为举止必然有不得当处，难免乱了章法。依附之事贵柔，初九以阳刚的姿态出场就错了。幸亏初九居下，有谦虚恭敬的优点，这才没有继续闯祸，挽回了不良影响。"}, {"yaoci": "六二：黄离，元吉。", "fanyi": "六二：六二爻黄中文明，大吉祥。", "jiedu": "黄在五色里为中之色，象征中道。六二以柔爻居阴位得正，又居于下体之中。能以柔顺中正之道依附于人，是吉祥的。当依附之时，初九过刚当然不可取，六二能柔并不难做到，难在一面柔顺依人，一面又不失其中正。这就是外圆内方的人格，在依附于人的同时，保持自己独立的人格。对利和义的追求很难平衡。"}, {"yaoci": "九三：日昃之离，不鼓缶而歌，则大耋之嗟，凶。", "fanyi": "九三：太阳西斜后，听不到人们敲打着瓦盆唱歌，而是听到老人们的哀叹声，凶险。", "jiedu": "太阳已经西斜了，仍然恋恋不舍地依附在天上。夕阳无限好，只是近黄昏。九三处于下离之终，光明已接近终点。日薄西山，精力俱衰，如不及时退休，等到年岁更加老迈时就该后悔了。唱歌行乐，以娱晚年，这是老人的最佳选择。如果仍然恋栈不舍，难免被视为老朽昏庸，自取其辱是必然的。"}, {"yaoci": "九四：突如其来如，焚如，死如，弃如。", "fanyi": "九四：灾难突然而来，焚烧房屋，人死，丢弃亲人的尸体逃命。", "jiedu": "处于多惧之地，急欲向上逼近六五，有强宾逼主之势。名为依附，实为逼迫，会引起六五的戒备。六五拒绝、抵制九四。比如刘备势单力薄时曾多次依附于人，曹操，袁绍，刘表，处处谦顺任劳，韬晦自抑。等待时机，缓图进取，并不操之过急，更不采取“突如其来如”的强宾夺主的形式，在辗转寄人篱下的过程中，不仅保存了自己，还积蓄了力量。而吕布与刘备相反，先后依附过丁原、董卓、袁术、刘备、曹操，但处处以强宾夺主，咄咄逼人，终于被杀。"}, {"yaoci": "六五：出涕沱若，戚嗟若，吉。", "fanyi": "六五：泪水、鼻涕如大雨一样，悲伤哀叹，吉祥。", "jiedu": "六五是一位心怀仁慈的君王，面对这种不孝的社会习俗，他感到很伤心，所以痛哭流涕，愁眉不展地连连哀叹，他在为这种时代悲哀。正是他心怀仁慈与悲哀，给他带来了吉祥。因为他会得到更多人的共鸣，会得到更多人的拥护，三国中刘备的哭就是这样。”"}, {"yaoci": "上九：王用出征，有嘉。折首，获匪其丑，无咎。", "fanyi": "上九：君王带兵出征，战绩很好。斩了敌人首领，俘虏了二头目，没有灾难。", "jiedu": "众人皆来依附，这时仍有少数顽固分子要讨伐问罪。但是六五柔弱，无力征讨。六五任用具有刚健之才的上九为将，去征伐尚未依附的异己力量。诛杀首恶，其余没有归附的民众俘虏过来就行。武力征伐和分化争取相结合，实现了百姓的依附。"}]}, "31": {"shici": ["象征无心的感应，这是异性间的自然感情\n\n            咸，亨，利贞，取女吉。\n\n            咸卦，亨通，宜于守正道。娶少女为妻吉祥。\n\n            咸卦是《易经》的一个新开始。《易经》上经以乾坤两卦开篇，讲的是天道与地道；《易经》下经以咸、恒两卦开篇，讲的是人道，并以夫妻为五伦之首。整个六十四卦是一个完整的整体，起于万物的开端乾坤，终于万物的结局既济、未济。其中，上经三十卦是一个段落，下经三十四卦又是一个段落。乾、坤为天地之始，有天地然后有万物；天地始于阴阳二气。咸、恒为人伦之始，有万物然后有男女，人伦之始，始于夫妻。这样，下经三十四卦就从男女夫妇开始。咸、恒二卦便指男女和夫妻关系。\n\n咸卦象征男女相感，少男少女的相感尤深。少男以笃实的态度相求，少女以喜悦的态度相应，交相感应，爱情专一。咸为感应、交感、沟通之意。“咸”字就是“感”的意思，表示没有利益纠葛的较感性的感情，包括纯真的认同和欣赏。产生心灵感应的常见事例为男女之情。所以预测男女感情时得此卦是最大的吉象。卦辞中说：“君子以虚受人”。男女相合与虚心按受别人的意见有联系吗？当少男少女一见钟情时，往往会感到对方全是优点。喜欢对方，便会认为对方的任性是有个性，对方的自私是人的天性。恋爱中的人能轻易接受对方的缺点，以及对方对自己的批评，而不恋爱的人往往难以做到这一点。"], "shuoming": [], "guayi": ["咸卦运势（事业、爱情、经商、诉讼、出行、人生）\n          本文所属分类：咸卦 \n          \n          运势：主吉象，求财、与人共事皆吉。但不要为不正当感情而意乱情迷。\n          \n          事业：人际关系好，善于交际。总有两条路可同时走。应以诚待人。\n          \n          爱情：正常恋情为吉。但欲望难以控制，不名正言顺的两性关系会带来混乱。\n          \n          疾病：多为泌尿系统之症。寒多热少，内热外冷，应往西南方求医。\n          \n          经商：有利可图。但不可强求，应以诚待人，加强合作，静待发展。\n          \n          诉讼：宜和解，有带病的美人参与此事。姓名中有口字的人是贵人。\n          \n          出行：有相识的人阻隔，可能有小口舌，可与买卖人同行。\n          \n          人生：常被夹在中间，左右为难，在官运、财运、感情上都易有这种纠纷。"], "yunshi": []}, "32": {"shici": ["卦辞指出了“恒”的两重含义：不易之恒与不已之恒。不易之恒是守持正道不动摇；不已之恒是坚持不懈。这两个方面构成了一个统一完整的“恒”…"], "shuoming": ["恒，亨，无咎，利贞，利有攸往。", "恒卦，亨通，没有灾难，利于守正道，前往有利。"], "guayi": ["恒卦运势（事业、爱情、经商、诉讼、出行、人生）\n          本文所属分类：恒卦 \n          \n          运势：此卦是状况卦，吉凶未定。不论吉或凶都会长久地持续下去。\n          \n          事业：不可急于求成，不应变动或着手新事物，应持之以恒，守静而勿动。\n          \n          爱情：可成，且有顺利如意、长久幸福之象。初婚者有口舌，久婚则较安稳。\n          \n          疾病：有慢性病，不易在短期内治愈，内服药效果较好。宜往西北方求医。\n          \n          经商：不得改变常理常道，坚持慎重选择的方向，勿追随潮流。\n          \n          诉讼：争讼之事由口舌引起，有惊无害。\n          \n          出行：不利，有口舌是非，破财。需要有贵人和解。\n          \n          人生：性格温和不敏捷。持之以恒才能成功，但多会在中间出现变化导致失败。"], "yunshi": []}, "33": {"shici": ["遁的本义是逃跑、逃避，引申义为隐遁、躲避。遁卦代表小暑至立秋的三十余天。由于阴气的加重使天气更加闷热而潮湿，人与动物此时只能躲藏起来，以避暑气…"], "shuoming": ["遁，亨，小利贞。", "遁卦，亨通，小的地方利于正道。"], "guayi": ["遁卦运势（事业、爱情、经商、诉讼、出行、人生）\n本文所属分类：遁卦 \n\n运势：时运不佳，应退不应进，应韬光养晦，独善其身，勿管闲事。\n\n事业：不可与人同流合污。应断然离去，暂避而发展个人实力，隐忍待机。\n\n爱情：有别离之象。婚姻难合，虽成亦破。经济富裕后离婚的现象较多。\n\n疾病：病情严重。多为经络不畅，肾精系统麻痹、疼痛，注意血气的调养。\n\n经商：不应执意追求、盲目投入，应远离小人奸商，保存自己的实力。\n\n诉讼：受到争斗之事牵连，如果逃移到远处，可大事化小，免罪。\n\n出行：不宜动，动则有险。被同行人欺负，或同行人有灾。\n\n人生：经济富裕。富裕后适合转移居住地区、变换工作、另择配偶等。"], "yunshi": []}, "34": {"shici": ["古人将三十岁的男子称为壮年。可见“壮”是壮大、强壮的意思。遁卦是归隐保全，就好比隐者居于山林中积蓄自己的能力，经过不断的积蓄，终于变得能力强大了，所以遁卦后面是大壮卦…"], "shuoming": ["大壮，利贞。", "大壮卦，利于守正道。"], "guayi": ["大壮卦运势（事业、爱情、经商、诉讼、出行、人生）\n本文所属分类：大壮卦 \n\n运势：声势浩大，行动迅速，积极冲动，但物极必反，容易犯错，一般为凶。\n\n事业：即将进退维谷，谋略重于勇气，不可逞强妄动，注意防范小人。\n\n爱情：看似可成，实则空虚。不可高傲，忌血气方刚。否则将自取其辱。\n\n疾病：健壮者遇此卦不利。多为呼吸道疾病，可不药而愈。宜往东北方求医。\n\n经商：形势大好，但易反遭不测。不可逞强妄动，应做好衰退的准备。\n\n诉讼：我方有大惊，遇贵人可相助。\n\n出行：有惊阻，防失脱。若寻人，二人同行，不久将至，有惊恐。\n\n人生：利于在文化行业发展，适合同一时间内在多各领域展开事业。"], "yunshi": []}, "35": {"shici": ["晋为日出地面、光明普照的上进之象。事物不可能总是停留在强壮的状态中，强壮后必有前进、发展，所以大壮卦的后面是晋卦。如果将太阳比作君王，君王对臣民最大的恩泽就是加官晋爵…"], "shuoming": ["晋，康侯用锡马蕃庶，昼日三接。", "晋卦，武王的弟弟康侯用武王赐给的良马生育许多良种马，武王因此而一天三次接见他。"], "guayi": ["晋卦运势（事业、爱情、经商、诉讼、出行、人生）\n本文所属分类：晋卦 \n\n运势：事业繁荣，声誉渐高，于人、事、物都有利，有加官晋爵之兆。\n\n事业：非常顺利，不断上升，阻力很小。不可犹豫，更忌优柔寡断。\n\n爱情：可能会偶遇某人，应柔顺而求，不可蛮横或清高挑剔。适合早婚。\n\n疾病：久病者凶，近病无妨。寒热头痛，上热下浮，可到西南方求医。\n\n经商：行情好，但也会遇到困难，应迎难而上，因势利导，克敌制胜。\n\n诉讼：二人官司，内外不和，我方不可动，终能得理。\n\n出行：二人同行，将出行而未出行，中途遇到另一个人则有恐。\n\n人生：有精神追求，适合求学，能因学问成就事业。为官多为虚职，无实权。"], "yunshi": []}, "36": {"shici": ["夷是受伤之意，明夷就是光明受损。卦象为日落于地，光明熄灭，昏君在上，小人得势，世道黑暗，形势险恶，有才能的人被压抑在下，光明正大之人必受伤害…"], "shuoming": ["明夷，利艰贞。", "明夷，利于艰难中守正道。"], "guayi": ["明夷卦运势（事业、爱情、经商、诉讼、出行、人生）\n本文所属分类：明夷卦 \n\n运势：运气极差，主大凶象。君子被小人伤，贤臣被昏君伤，应忍耐自重。\n\n事业：处境不利，应表面柔顺，内心明察，隐忍行志，当离则离，避免灾祸。\n\n爱情：未被对方接受，有被背叛抛弃之象。应全面分析对方，注意大节。\n\n疾病：有不安、凶险之象。若为眼疾有失明之象。可往南方或北方求医。\n\n经商：应韬光养晦。适合在西方文化背景下的机构、行业从事工作。\n\n诉讼：处于罗网中，上了法庭也难脱罪责。\n\n出行：到中途有阻，急则安，动则险。可问他人。\n\n人生：外表忠厚，内心火爆。性格怪异。晚上思想活跃，白天爱打瞌睡。"], "yunshi": []}, "37": {"shici": ["上面的明夷卦代表受伤，人受伤后便会回到家中养伤，所以明夷卦之后是家人卦。家人就是家里人，卦辞极其简单，只有三个字——利女贞。这三个字却说出了家庭中女人的重要作用…"], "shuoming": ["家人，利女贞。", "家人卦，有利于女人守正道。"], "guayi": ["家人卦运势（事业、爱情、经商、诉讼、出行、人生）\n本文所属分类：家人卦 \n\n运势：风助火势，火助风威，可与家人协力发展事业，与他人合作也易成。\n\n事业：成功与否与家庭支持密切相关。应严格治家，防止“后院起火”。\n\n爱情：大吉之象，终成美眷。妻子是家道的根本，择妻应慎重。\n\n疾病：若为腹部之病不严重，若为心脏病则危重，可往东南方求医。\n\n经商：以治家的方式来经商，集中权力，严宽结合，以严为主。\n\n诉讼：我方得理，不过有疑虑，但最终没有妨碍。\n\n出行：与姓名中有木的人同行，事情与女人有关，钱财上反复。\n\n人生：起步较晚。仕途应由“齐家”开始，结婚生子后才可有所发展。"], "yunshi": []}, "38": {"shici": ["睽的本意是两只眼睛不朝一个地方看，引申为背离、反目。如果家中穷困了，便会离异、不合，所以家人卦的后面是睽卦。卦象为上火下泽，火苗向上，泽水向下，二者目标相反，互相违背…"], "shuoming": ["睽，小事吉。", "睽卦，做小事吉。"], "guayi": ["睽卦运势（事业、爱情、经商、诉讼、出行、人生）\n本文所属分类：睽卦 \n\n运势：处于矛盾、对应状态。气运不通，势行低落，处变不惊可转危为安。\n\n事业：小事可成，小事积累可成大事。成于协力合作，败于众志相异。\n\n爱情：不和睦。若相互怀疑，可能有第三者介入。深藏不露则无大碍。\n\n疾病：易有诊断错误，失先机，应尽快转换医治方法。可往东南方求医。\n\n经商：多阻碍，难成，成也有损。应求大同而存小异，避免纠纷。\n\n诉讼：双方反目成仇，意见相悖，宜和解。\n\n出行：动则利，回则难，利于二人同行。若寻人，难寻。\n\n人生：走仕途易成事业。在台上则挥洒自如，在台下则心里不平衡。"], "yunshi": []}, "39": {"shici": ["蹇卦为四大难卦之一。蹇的意思是跛足，行走困难。上一卦睽卦表示家道衰落，“家贫百事哀”，所以睽卦的后面是蹇卦。从卦象上看，坎于前，艮于后，山高水深，前路险陷，后有阻碍，主凶象…"], "shuoming": ["蹇，利西南，不利东北；利见大人，贞吉。", "蹇卦，西南方有利，不利于东北方。宜于拜见大人物，守正道吉祥。"], "guayi": ["蹇卦运势（事业、爱情、经商、诉讼、出行、人生）\n          本文所属分类：蹇卦 \n          \n          运势：衰运，进退维谷，如跛足者举步维艰。应明哲保身，不妄动。\n          \n          事业：开头难，不可冒险，应坚持下去，以柔克刚，候时待机。\n          \n          爱情：困境重重，情缘有破，舍弃难定。不可武断。\n          \n          疾病：病危，有疏忽医治之现象。多为足疾，可向南方求医。\n          \n          经商：改行、开业不吉。有是非、损耗之象。应交结贤人，坚守正道。\n          \n          诉讼：步履艰难，不宜见官，只宜回避。\n          \n          出行：动则有阻，或者路费不够用。若寻人，难以找到。\n          \n          人生：学业对事业影响很大，有经商的天赋，能积累巨大的财富。"], "yunshi": []}, "40": {"shici": ["解是解脱、缓解、解决的意思。解卦象征在险中行动，并因为行动而脱离险境，凶带小吉。解相当于春分时坚冰溶解，万物觉醒…"], "shuoming": ["解，利西南，无所往，其来复吉。有攸往，夙吉。", "解卦，有利于西南方，无所往，返回来吉祥。如有所往则提前一些吉祥。"], "guayi": ["解卦运势（事业、爱情、经商、诉讼、出行、人生）\n            本文所属分类：解卦 \n            \n            运势：冰冻三尺非一日之寒，事出有因，到了可解决的时候。应快速处理。\n            \n            事业：元气初复，准备就绪应立即行动，争取主动，不可拖延。\n            \n            爱情：开花结果之兆。初有困难，但难关已过。不用犹豫，坚持可成。\n            \n            疾病：久病可治愈，近病则危。肾脏、心脏容易出问题。宜往西北方求医。\n            \n            经商：开业者吉，有很大的展望。行动快速才可摆脱险境。\n            \n            诉讼：事情即将有眉目，丑未之日能见分晓。\n            \n            出行：欲归不归，似有灾，或相识之人相留。\n            \n            人生：能解决具体问题，但缺乏整体目光。适合开拓性的工作，以及副职。"], "yunshi": []}, "41": {"shici": ["损的本意是减少。上一卦解卦是缓解、解除危机的意思，但解除危机会带来损失，如同打完官司要交律师费、诉讼费等费用。所以解卦的后面是损卦…"], "shuoming": ["损，有孚，元吉，无咎，可贞，利有攸往，曷之用？二簋可用享。", "损卦，有诚信，大吉，没有灾难，可守正道，前往有利。用什么？用两簋供品祭祀神灵。"], "guayi": ["损卦运势（事业、爱情、经商、诉讼、出行、人生）\n          本文所属分类：损卦 \n          \n          运势：损益相间，损中有益，益中有损。塞翁失马，焉之非福。\n          \n          事业：开拓事业必有投入，应力求损益得当。应有节度，投入适度。\n          \n          爱情：不应斤斤计较，应从大处着眼。女得此卦易有损失。\n          \n          疾病：身体衰弱，元气已动，病情虽重，但积极治疗可愈。往东南方求医。\n          \n          经商：改行、开业可行。勿自我封闭。不必计较利润多少，获利即可。\n          \n          诉讼：为争斗事，先损他人，破财后有理。\n          \n          出行：虽有同行之人，也不可去，防途中有人侵袭。\n          \n          人生：个人利益为上。内心有侵犯性。只能侵占别人，不能被别人侵占。"], "yunshi": []}, "42": {"shici": ["益通溢。器皿上面溢出水是“溢”字的形象。其引申义为增加、增益、增强。不停地减损就会出现损极而反的增益，所以损卦之后是益卦。此卦为由上对下的一种好的给予，主吉象…"], "shuoming": ["益，利有攸往，利涉大川。", "益卦，前往有利，有利于跋涉大川。"], "guayi": ["益卦运势（事业、爱情、经商、诉讼、出行、人生）\n          本文所属分类：益卦 \n          \n          运势：强风配快雷，声威增长，正当吉运，可得贵人之助而成功。\n          \n          事业：勇敢前进，大胆投入，勇于支持他人事业，施善于人，会相得益彰。\n          \n          爱情：相成相益，可成良缘。有喜悦之象、发达之意。\n          \n          疾病：足或胃部疾病，有小血光但无碍，可治愈。应往东南方求医。\n          \n          经商：改行、开业有利可图。勿追求小利，让利于人则获丰厚利润。\n          \n          诉讼：与粮食田地等事物有关，处理不好有牢狱之灾。\n          \n          出行：三人同行，往东南方无险，财不旺。\n          \n          人生：无论男女都有阳刚之气，喜欢争权称王。善于维护自身权益。"], "yunshi": []}, "43": {"shici": ["夬通决，有决溃、决裂之意。上一卦益卦表示受益，但受益过多便会溢极而出，如同水多决堤，所以益卦的后面是夬卦。夬卦是个状况卦，吉凶未定…"], "shuoming": ["夬，扬于王庭，孚号，有厉。告自邑，不利即戎，利有攸往。", "夬卦，在王庭上大声宣扬，竭诚地哭号将有危险，告诉同邑的人们，不利于立即采用军事行动，与对方建立交往有利。"], "guayi": ["夬卦运势（事业、爱情、经商、诉讼、出行、人生）\n            本文所属分类：夬卦 \n            \n            运势：先吉后凶。鸿运当头，但危险将至。不可轻举妄动，应随时警惕。\n            \n            事业：表面刚强兴盛，但危险已孕育。不可莽撞，应柔缓地去除小人。\n            \n            爱情：决裂之象。夕阳虽好，却近黄昏。多为男性摒弃女性之象。\n            \n            疾病：病情严重，应速治疗。多为胃、头和恶性瘤之病。宜往东南方求医。\n            \n            经商：改行、开业者不利。难关重重，有失败破财之害。\n            \n            诉讼：宜急不宜缓，对我方有利。\n            \n            出行：恐有失脱，作事反复多忧，宜守旧。\n            \n            人生：好动，古怪，心性难成熟。如遇坐享其成之事，多无善终。"], "yunshi": []}, "44": {"shici": ["象征邂逅，意外相遇\n              姤卦外卦为乾为天，内卦为巽为风，天下刮起了风。风无孔不入，说明相遇在任何地方都会出现，即邂逅，有聚散不定、思虑模糊之意。这是个状况卦，有始料不及的事情发生，吉凶未定…"], "shuoming": ["姤，女壮，勿用取女。", "姤卦，女子强壮，不要娶这个女子为妻。"], "guayi": ["姤卦运势（事业、爱情、经商、诉讼、出行、人生）\n          本文所属分类：姤卦 \n          \n          运势：风云际会、聚散随缘。阴长阳衰，男性要防因色招祸，注意桃色纠纷。\n          \n          事业：阴阳不协调，潜伏危机，应提防小人的陷害。在恶势未成之前就制止。\n          \n          爱情：互不满意，感情复杂，用情不专，有第三者出现，可能会离散。\n          \n          疾病：多为外来感染或外伤，或泌尿系统之疾，有恶化的情况。\n          \n          经商：改行、开业不吉，强行发展有危险，易受小人之害。应及早脱身。\n          \n          诉讼：事关女人，有口舌之事，有惊阻，但不足为害。\n          \n          出行：往北方有利，防女人勾引，内有女人阻碍，或有口舌。\n          \n          人生：可创造很大财富，但过程复杂。女性开创事业能有大发展。"], "yunshi": []}, "45": {"shici": ["象征会聚，天下汇聚，顺利亨通\n\n                萃，亨。王假有庙。利见大人，亨，利贞。用大牲吉，利有攸往。\n\n                萃卦，举行祭祀时，君王来到宗庙里。有利于拜见大人物，亨通，有利于守正道。有利于用大牲畜作祭品，前往有利。\n\n萃指草茂盛生长，引申义是不同类别的事物聚集、聚拢。姤卦讲的是阴柔与阳刚相遇，相遇便会聚集，所以姤卦后面是萃卦。从卦象上看，外卦兑为泽为喜悦，内卦坤为地为柔顺，沼泽本来比地面要低，可是由于不断积聚使泽水高出了地面，这便是聚集的大形象。物以类聚，人以群分，事物都会以类相聚。\n\n此卦有精华聚集之意，被认为是“鲤鱼跳龙门”之象，但吉中带小凶。卦辞讲的是君王利用敬神来聚集天下人。在古代，统治者建国时最先建造的是宗庙，然后才建宫室。宗庙是国家的政治中心，上天的神命、祖先的福佑、民众的信仰，都围绕着宗庙祭祀体现出来。统治者加强民众对神的信仰，让民众服从天神的旨意，使民众思想得到统一，更好地服从天子。所以天子来到宗庙里祭祀是一种大的聚集，其目的是想聚集天下人心。得此卦者，自视清高，有才气但迷茫。百事平顺，在应试、就职、人事调动等方面为吉，从艰难中起步容易成功。又有与离别之人相遇之意。愿望可达成，但须防女性的妨碍。男性得此卦为吉象，女性则有因顺从而失利之象。预测婚姻为和睦、相聚良缘。恋爱错卦年龄差距比较大，感情纠葛多，类似污泥。"], "shuoming": [], "guayi": ["萃卦运势（事业、爱情、经商、诉讼、出行、人生）\n            本文所属分类：萃卦 \n            \n            运势：吉运昌盛，得信于人，得长辈照顾，但应小心财务上的纠纷。\n            \n            事业：兴旺发达，蒸蒸日上，但人多则竞争激烈，盛则必衰，切勿骄傲。\n            \n            爱情：吉象。可达成愿望。家庭融洽如意，相亲相爱。\n            \n            疾病：多为胸部与腹部之疾。应速诊治，应往东南方求医方。\n            \n            经商：改行、开业适合，可按计划进行。稳妥前进，有备无患。\n            \n            诉讼：姓名有草字头之人是贵人，军人对我方不利，最终是我强他弱。\n            \n            出行：不宜动，动必有口舌，中途会有军人、官员侵害，主破财。\n            \n            人生：祖业败落，从艰难中起步，自视清高，迷茫孤傲，宗教信仰为佛教。"], "yunshi": []}, "46": {"shici": ["象征上升，恒通吉利\n\n                              升就是上升的意思。升卦有“得时应”、“培养实力”、“获后援”三种含义。表示上升的卦有三个（晋、升、渐），从成长的顺利程度的角度看，升卦最吉；以势而言，旭日中升的晋卦最佳，但有些许危险和偏差。晋卦要顺应光明，而升卦是要顺性上升，侧重于要遵循大道、自然规律。两者相似，但侧重点不同。物积聚必增高，增高必向上，所以萃卦之后是升卦。升卦给人一种顺畅无忧、蓬勃向上的感觉，如同幼苗破土而出，成长为栋梁之材。在顺势上升之时，应勇敢前进，去干一番大事业。\n\n从卦象上看，外卦为坤为地，内卦为巽为木，树木从地中向上生长。木之生长有两个特点：一是依时而长，顺势而生；一是从容渐进，积小成大。由幼小细嫩的树苗长成枝繁叶茂的大树，这是一个日积月累、从容积渐的过程。事业之弘大、学养之深厚，道德之崇高，都是积累而成的。不断积累，一方面是素质的积累和能力的积累，不断充电，不被时代淘汰；另一方面是行为的积累，多做好人好事，树立威信。"], "shuoming": ["升，元亨，用见大人，勿恤，南征吉。", "升卦，大亨通。需要拜见大人物，不用忧虑，向南征讨吉祥。"], "guayi": ["升卦运势（事业、爱情、经商、诉讼、出行、人生）\n本文所属分类：升卦 \n\n运势：状况卦，吉凶未定，偏小吉。开运之象，可做计划，但尚不可执行。\n\n事业：积小成大，拼搏得益。不断发展，逐步上升，但不可冒进。\n\n爱情：应逐步培养情感，不应过急，慢慢追求。\n\n疾病：多为腹、胆之病。病重，近日内会有不利变化。宜往西北方求医。\n\n经商：从小处着手，逐渐开拓，稳重为好，不可冒失。\n\n诉讼：宜进不宜退，最终不会有大害，防姓名中有草字头者之害。\n\n出行：欲动不动，很久以后才会得行。利北方，宜进不宜退。\n\n人生：仕途没有发展，多为百姓。财运一般，婚姻非常好。"], "yunshi": []}, "47": {"shici": ["困，亨，贞，大人吉，无咎，有言不信。", "困卦，亨通，守正道，大人物吉祥，没有灾难，说话没人相信。", "困就是陷入困境之意。困卦为四大难卦之一，主大凶象。甲骨文中的“困”字是一个房屋里面长着树木。屋子里面怎么会长着树木呢？原来是树木与杂草充满房屋的意思。这样的房子应该是没人住的。但流浪的穷苦人会临时把这里当作一个安身的家。所以困的引申义便是穷困、贫穷。升是自下往上升，需要很多气力，如果升进不已，超过一定的限度，强弩之末，气衰力竭，走入困境，所以升卦之后是困卦。处于困境中不能急躁，要从容不迫，徐谋出困之计；还要有精神支柱，要看到光明的前途，而不要在精神上先把自己打垮。要脱困不能光靠口说，而要有实际行动。行动与否要因时因势而定，时不宜动而不可躁动，时适宜动而不可不动。\n\n困穷中仍能自得其乐，唯君子有这般气度。君子能在困中静待时机，处之泰然，便不为大凶。此卦卦辞中说“困而不失其所”，晋代的陶渊明就是其典范。陶渊明生活极其贫困，家中没有存粮；冬天仍然穿短衣，屋子四处漏风，夏天遮不住太阳，冬天挡不住雪花。但在这种穷困中，他写出了“采菊东篱下，幽幽见南山”的田园诗。\n\n摇得此卦者，在事业、财富追求、家庭关系上，都会得势于困难之中，一旦发展起来前途不可限量。婚恋上容易遇到困难，但是结婚之后多为好婚姻。"], "shuoming": [], "guayi": ["困卦运势（事业、爱情、经商、诉讼、出行、人生）\n            本文所属分类：困卦 \n            \n            运势：在最困难之时，四处无援，事事难有进展，只能静待时机。\n            \n            事业：境况很差，被小人欺，劳而无功。若采取不正当的手段，会愈陷愈深。\n            \n            爱情：婚恋难成气候。家中重担多由女方承担，或丈夫有外遇，或夫妇不和。\n            \n            疾病：多为口腔、泌尿系统之病。行走不便，坐卧不安，宜往西南方求医。\n            \n            经商：受小人阻碍而不得志，四处碰壁，有破产的可能。应泰然处之。\n            \n            诉讼：有人在狱中之象，或纷争难解，双方僵持。\n            \n            出行：略有阻隔无妨，宜向西北方去。防财失。\n            \n            人生：性格静若止水。有冒险精神，在困难之中见气节，容易被人利用。"], "yunshi": []}, "48": {"shici": ["井，改邑不改井，无丧无得。往来井井。汔至，亦未繘井，羸其瓶，凶。\n\n            井卦，城邑可以迁移，井却迁不走。没有丧失，也没有获得。人们来来往往到井边打水，提水未到井上的时候，陶罐挂住被井壁碰碎，凶险。\n\n            井指的就是水井。以井喻君子，以井水喻美德。在困境中会力不从心、视野受限，变得保守，这是井卦的含义。所以困卦之后是井卦。井有节俭之意，节水备养，犹如节财备用。井通刑字，有含忧、刑戮、小通大滞之意。井水虽不能种植、畜养，却能养人度日。他取之不尽，经久不竭，永远干净，可自由汲取，象征君子的美德。君子要像井水浇灌田地一样，源源不断地以美德教育民众，让民众懂得团结、互相帮助。但打水需要水桶，否则井水会空自腐坏。水桶可能倾覆，所以平静中暗藏着凶险。另外，井不能移动，要永远守在原地。在井水已汲到接近井口，将要出井时，如果汲水的瓶罐坏了，就会一无所获，必有凶险。同理，人如果不能善始善终，一定会导致凶咎。水井如果只为个人独用而不养大家，这是水井的悲哀。汲用井水的人越多，水井施泽的范围就越广。应该相信井水是源出不穷的，永远流不完。只有这样，水井养人的功用才可发扬光大。\n\n摇得井卦，对人而言，表示心力有限，不能做太大的计划。也表示视野受限，保守心态重。但格局小能过活，主小吉象。忌公事诉讼。有思不定、居所有虚惊之意。预测婚姻有分开再合之象，应迟。"], "shuoming": [], "guayi": ["井卦运势（事业、爱情、经商、诉讼、出行、人生）\n本文所属分类：井卦 \n\n运势：井为静而不能移之物。难以进取，缺乏冲劲，不如守之泰然。\n\n事业：处境平稳。不应贸然前进或后退，应真诚奉献，充实个人实力。\n\n爱情：情况不妙，有破裂或分而再合之象，不必过急，应慢慢发展。\n\n疾病：病在肾、膀胱等泌尿生殖器官。多为旧病复发。宜往西方求医。\n\n经商：有破损之象。利于守业、小交易，但不可大作为或改行。\n\n诉讼：因田土之事而纷争，不可贸然发动攻势。\n\n出行：动则不远，远则必然难动，近则有利。若寻人，暂无音信。\n\n人生：性格安静、警惕。适合在家乡发展，离开家乡则事业难成。"], "yunshi": []}, "49": {"shici": ["革，己日乃孚。元亨利贞，悔亡。\n\n            革卦，己日得到诚信。大亨通而利于守正道，没有悔恨。\n\n            “革”字是象形字，像被剖剥下来的兽皮。其引申义是变革、改革、革命。井水需要不断的清理、革新才能保持洁净，所以井卦的后面是革卦。革卦是个状况卦，吉凶未定。从卦象上看，泽中有火。泽中会有火山爆发，人们必须重新择地而居，这是大的社会变革。不变革就不会前进，变革是历史发展到一定时段的必然产物，代表新时代的开始。变革会转换原有势态，变革的时代会有大机遇，乱世造英雄。\n\n推行变革要克服相当大的阻力，甚至会出现一些不大不小的社会动荡。要成事，既要有“天时地利”的外在条件，又要有“人和”的内在条件。要想成功必须坚持两点：一要抓住时机，二要取信于人。变革旧的事物不是轻而易举的事情，需要一段时间的准备，才能逐渐被人们理解、接受。如果贸然变革，效果会适得其反。顽固的成见是极为可怕的。革卦的六个爻表示不同时位、不同特征、不同做法的变革，以及产生的不同结果。\n\n得此卦者，求财虽可成，但有小错而迟。预测婚姻，女克夫，并有急躁、破财之象，另觅配偶为吉。已婚者得此卦，有缘分破败、另起炉灶之象。"], "shuoming": [], "guayi": ["革卦运势（事业、爱情、经商、诉讼、出行、人生）\n            本文所属分类：革卦 \n            \n            运势：不稳定，事情多有变动，应决心改革。去旧立新，弃腐朽而生新机。\n            \n            事业：正处在转折的关键时刻，应顺应形势，时机成熟后立即变革。\n            \n            爱情：多事之秋，去者难返，迎新为吉。易有外遇或婚外情，容易离婚。\n            \n            疾病：病大难治，病情多变，须转换求医或手术治疗。应往南方或北方求医。\n            \n            经商：改行、开业皆吉。适合乱中求财。应大胆求新，适时改变方向。\n            \n            诉讼：我方被动，有姓名中有草字头的人说合，可以和解。\n            \n            出行：与一人同往，须防此人，否则有连累。\n            \n            人生：性格叛逆，不认可主流意识，有革命精神。追求不平凡的人物。"], "yunshi": []}, "50": {"shici": ["鼎，元吉，亨。\n\n            鼎卦，大吉祥，亨通。\n\n            在甲骨文中，“鼎”字上面的部分像鼎的左右耳及鼎腹，下面像鼎足，是一个象形字。鼎卦六爻的排列正好组成一个鼎的形象。其最底下的阴爻代表鼎足，中间的三个阳爻代表鼎腹，六五代表鼎耳，上九代表鼎杠。鼎是一件不寻常的厨房用品。它集权力、律法、威信于一身，是国家的重器。在中古时代，天子初登龙位的时候，第一件事便是铸鼎，颁布法律，以示吉祥。\n\n            鼎可用来象征变革。革是变故，改变旧事物；鼎是取新，建设新事物。鼎容易折足，也有推陈出新的含义。所以鼎卦紧接在革卦之后。鼎是建立一个新社会，巩固一个新局面。不像革卦是变革旧社会，施行起来还十分复杂，故鼎卦不讲条件，一切都通达顺畅。鼎卦与井卦卦义有一些共通之处，不过，井卦重在养民，而鼎卦重在养贤。\n            \n            鼎以三足而立，态势平稳。此时事业可为，不应延滞。事业与人合伙为佳，可在平稳中发展。事业需要借助家族的力量，家庭团结或有家人帮助。求财可成，求他人之力有利。但对感情、婚姻略有凶象，测婚姻时，家庭顶梁柱会出现问题。此外，三角恋爱、三人同行的机率很高，有外遇出轨的迹象，已婚女性得此卦有两女侍一夫之象，但会理智地解决。最重要的是不可失去相互协助的关系。"], "shuoming": [], "guayi": ["鼎卦运势（事业、爱情、经商、诉讼、出行、人生）\n            本文所属分类：鼎卦 \n            \n            运势：去旧立新，改过迁善之象。适合找人共事或合伙，但不应迟滞。\n            \n            事业：利于创业，可得上辈提拔，主吉象。适合变革，可以迅速进行。\n            \n            爱情：吉中带凶，外表平稳，但可能有第三者介入，且不易被发现。\n            \n            疾病：病情有变，但可无碍。去医院治疗的效果不明显。\n            \n            经商：利于开业，可顺利开展活动，遇到困难也能够克服。\n            \n            诉讼：因小是非而引起矛盾，宜找第三个人劝和，可和解。\n            \n            出行：途中与人同行，可能有忧虑，三个人中有一个人不合。\n            \n            人生：仕途比商场更利于发展。多信奉佛教，但不如祭拜祖先。"], "yunshi": []}, "51": {"shici": ["震，亨。震来虩虩，笑言哑哑。震惊百里，不丧匕鬯。\n            \n            震卦，亨通。大的雷声让人感到害怕，可是人们明白雷声会降下雨泽，所以听到雷声都很高兴，尽管雷声震惊百里，却不会震落手中的酒杯。\n\n            震的本意是雷声。从卦象上看，两震相重，有雷声接连不断的意思。雷电可击杀邪恶势力，也可以给万物赋予生机。所以震卦既含有上天对人间进行惩戒的含义，又含有律法及政治运动对社会的惩治，还象征新秩序建立的起源。古人对雷是极其敬愄的，但它实际上并没有严重灾害，只要冷静对待就会安然度过。所以，此卦也表示虚有其表，虚张声势，要特别警惕。在古人看来，打雷是天发怒了，这时该怎么做？一、不要触犯天道、法律。二、在遇到惊险时要谨慎小心，临危不惧，镇定自若。三、发布号令、制定法规也要震惊百里，像打雷一样，要贯彻到所有人、所有地方，使上下都惊惧，远近无一遗漏。本卦揭示出的大多是心理而不是事理，是心态而不是事态。\n\n得此卦者，初时危难，事情多有受惊、变动、喧噪的情况。须谨慎、戒惧，以免有失。女性预测婚姻，为两女争嫁而处境不利。此卦之阳气为重阴所抑制，压力愈大则抵抗愈强，势有冲破阴爻之象。如男性受女性的无理压制，有大发雷霆，一发不可收拾之势。雷为声势浩大、有声无形之虚象，所以，与人交往多为表面热心，内心不诚。"], "shuoming": [], "guayi": ["震卦运势（事业、爱情、经商、诉讼、出行、人生）\n            本文所属分类：震卦 \n            \n            运势：六冲卦，大好大坏之象。有变动、动荡、不安、有惊无险之象。\n            \n            事业：在转折的关头，面临危险，在突发事件中应泰然处之，以便迅速复原。\n            \n            爱情：有虚无实，是非多杂。常有变动争吵，可能出现变故，应冷静处理。\n            \n            疾病：多为神经系统或急性肝病，病情反复，血气攻上，宜往西南方求医。\n            \n            经商：处于变动中。变动中容易获得权力或财富，但稳定后容易消失。\n            \n            诉讼：口舌争辩中可能有惊扰，事态多反复。\n            \n            出行：身难动，有二三人在途遇同伴，可以平安而归。\n            \n            人生：聪明好动、活跃而暴躁。容易打架或伤害他人，婚姻中容易吵闹。"], "yunshi": [{"yaoci": "初九：震来虩虩，后笑言哑哑，吉。", "fanyi": "初九：雷声响起人们感到不安，雷声过后人们笑语声声，吉祥。", "jiedu": "震雷打来时万民惶恐惊惧，若镇定能导致福泽。临震而能镇定自若，谈笑自如，说明初九在恐惧戒慎之后，行为就能遵循法则而不失常态。有两种人：一种是平日松懈，没有恐惧，当震雷炸响时却恐惧不已；一种是平日不敢自宁，谨慎戒惧，当震雷炸响时反倒镇定自若。初九说的是第一种人，希望这种人由于对震雷的恐惧而能修己省过，从此不敢自宁。"}, {"yaoci": "六二：震来厉，亿丧贝，跻于九陵，勿逐，七日得。", "fanyi": "六二：惊雷袭来有危险，人们丢弃家财，跑到山陵上，不要追赶，七天后会失而复得。", "jiedu": "六二紧临震动的中心，受到震动最严重。六二虽然有中正之德，但非常害怕，逃跑中丢了不少财物。但震动不是针对他而来的，所以震动过后他还会拥有自己的地位与财物。这就好比一场奴隶暴动。奴隶不堪忍受残酷的压迫，结果造反了。在这场运动中，六二很害怕，躲了起来。可是他平时有中正之德，善待奴隶，所以他不会有灾难。"}, {"yaoci": "六三：震苏苏，震行无眚。", "fanyi": "六三：震动使人恐惧不安，行动没有灾难。", "jiedu": "六三远离震动的中心，他是一位有过失的人。这场运动虽然离他的居所较远，却使他很害怕。可正是由于因惧怕使他得以自省改过，所以不会有灾难。"}, {"yaoci": "九四：震遂泥。", "fanyi": "九四：惊雷坠入淤泥里。 九四有雷入泥中的形象。", "jiedu": "九四的引申义可以从两个方面来解释。一是九四为国家重臣之位，所以在严打运动中尽管他受到了牵连，但是由于他位高权重，又与六五君王相合，所以法律无法制裁他。另一方面是，九四想以严法治国，可是他宣扬的法律威胁到了九五的君王，所以这种法无法实施，就像雷入泥潭一样。"}, {"yaoci": "六五：震往来厉，亿无丧，有事。", "fanyi": "六五：在震动中来回奔跑有危险，多亏没有大的损失，只是有些困扰。", "jiedu": "六五身为君位，可是初六的震动也使他产生了惊惧，并且来自九四的震动虽然没有大的发作，却也是隐藏的一种危机。虽然这两方面的震动对君王威胁不大，可是六五阴柔力弱，所以他四处躲闪，害怕给自己造成伤害。如果国君内心摇摆不定，那么对国家及国君本身是有危险的。"}, {"yaoci": "上六：震索索，视矍矍，征凶。震不于其躬，于其邻，无咎。婚媾有言。", "fanyi": "上六：雷声使人们索索发抖，六神无主，征讨凶险。由于震不在自身，而在邻人，所以没有灾难。婚配会有怪责之言。", "jiedu": "九四的雷声没有响起来，初九的雷震到了上六已经力量很弱了，所以上六没有受到大的震动。可是上六阴柔无力，处于老弱状态，所以这一丝震动也让上六非常惊慌，六神无主。这么虚弱胆小的上六自然不适合带兵征讨别人了，由于运动的本身不是针对上六而来的，所以上六不会有灾难，只是他的配偶会责怪他胆小。"}]}, "52": {"shici": ["象曰：财帛常打心头走，可惜眼前难到手，不如意时且忍耐，逢着闲事休开口。", "艮，艮其背，不获其身，行其庭，不见其人，无咎。\n\n            艮卦，停在他的背后看不到他的前身，走进他的庭院，却看不到他本人，没有灾难。\n\n            艮是停止、退守的意思。事物不可能总是处于震动的状态中，总有停止下来的时候，所以震卦的后面是艮卦。在六十四卦中，两雷、两风、两水、两火、两泽都有互相交应的可能，惟独两山对峙，不可能有任何往来，谁都不作迁就，互不相涉，有抑止、受阻的含义。\n\n卦辞认为，人要止于心无外求，也就是自我控制，抑制自己不良的欲望。而不是靠外力来制止。事当做则做，不当做则不做，做就要善始善终；话当讲则讲，不当讲则不讲，讲就要言之有序。控制言行要“思不出其位”，思想上要加强修养，经常反躬修己。\n\n艮卦中的静止是相对的。比如两军对峙，准备开战，其中一方觉得自己没有取胜的把握，便退到城里，进入静止的状态。可是回到城里的将士不可能什么也不做，而是想计策的想计策，练兵的练兵，逃跑的逃跑。所以说静止是相对的。此时要掌握好动静的时机，该止则止，不超越一步。\n\n得此卦者，维持现在的地位、境遇最重要。应沉默思考，安份守常，不可轻举妄动，所思所虑不超出本位。冒进会招致接连的灾难，且难有协助者。此卦又有忧喜相叠之意，半调半难调。又有人合背站立之象，彼此独立而不能相助。求财则似成而不成，有危难损财，但也有外部救援，可逐渐转吉。预测婚姻似有成，但对峙双方有不通之势，有单恋或不被接受之象。若能保守面对、修身养性则安，适时休息方能平安度过。"], "shuoming": [], "guayi": ["艮卦运势（事业、爱情、经商、诉讼、出行、人生）\n本文所属分类：艮卦 \n\n运势：六冲卦，大好大坏之象。百事有阻，应知退，量力而为。\n\n事业：不可依赖，应进行调整，停止行动。强行逞能为凶。\n\n爱情：有对峙、单恋、难合之势，双方各有阻挠，关系停滞不前。\n\n疾病：多为鼻、口、动脉硬化、胃胆之疾。难治。应往东北方求医。\n\n经商：改行、开业不吉。应安静退守，不受外界干扰，静待时机。\n\n诉讼：可能有姓张的人从中作梗，慎防。\n\n出行：去不成，若去则有险。\n\n人生：清高孤傲、适合艺术行业。年轻时有为，中晚年退隐思想严重。"], "yunshi": [{"yaoci": "初六：艮其趾，无咎，利永贞", "fanyi": "初六：脚趾停止运动，没有灾难，利于永远守正道。", "jiedu": "止于其趾。脚趾处人体之下，人要行动则趾先动，而初六在尚未开始行动时就予以抑止，知不可为，则开始就不为之。止有两种情况：止于行和止于止。应当做的事开始就要坚决去做，不应当做的事开始就坚决不去做。这样才不会招致咎害。抑止不正当的行为一定要早，力争抑止于尚未萌发之时，一旦行为产生再去制止，会事倍功半。"}, {"yaoci": "六二：艮其腓，不拯其随，其心不快。", "fanyi": "六二：抑制小腿，不能快步跟随别人，心中不高兴。", "jiedu": "六二的品德使他在危险中能够自我约束，所以不会有大的灾难。只是由于必须对自己严格约束才能脱离危险，所以自己的内心会感到有些压抑。比如文革中被关进牛棚的老一辈革命家就处于六二这种困境中。不能多说，只能违心而说，坚持正义就会带来灾难。所以“其心不快”。"}, {"yaoci": "九三：艮其限，列其夤，厉薰心。", "fanyi": "九三：止住腰部，撕裂脊背，危险如烈火烧心。", "jiedu": "抑止要合乎时宜，不可随便抑止，否则止于君臣则君臣失调，止于家庭则妻离子散，止于朋友则朋友失义。九三的静止不是自觉的静止，而是被困的静止。九三有动的形象。困于危险中而运动，肯定不会有好的结果。比如在文革中，有些人被关在牛棚里还是想要为自己讨个公道，想要伸张正义，结果使自己受到了更大的灾难。"}, {"yaoci": "六四：艮其身，无咎。", "fanyi": "六四： 止住上身， 没有灾难。", "jiedu": "六四发现自己处于危险的境地，便开始严格要求自己，不乱说不乱动，又具有柔顺之德，所以不会有灾难。六四可以受到九三的帮助而免于灾难。并且他也能从九三身上吸取教训，从而严格约束自己，所以他的格外谨慎使他“无咎”。"}, {"yaoci": "六五：艮其辅，言有序，悔亡。", "fanyi": "六五：止住牙床，说话有次序，没有悔恨。", "jiedu": "六五是一卦中最重要的位置，所以也把人最应该静止的部位放在了这里。人最应该静止的部位便是嘴。“病从口入，祸从口出”，信口胡说，会给自己带来灾难。贤明的君王一般是不会提拔伶牙俐齿的人为重臣的。汉朝大臣张释说：“有道德和真才实学的人不会夸夸其谈。越是有德的人，越是器宇深沉，言语简当。”"}, {"yaoci": "上九：敦艮，吉。", "fanyi": "上九：敦厚而懂得适可而止，吉祥。", "jiedu": "“大智若愚”是智的最高境界。上九便是这种境界。以敦厚的态度停止，这是表面上最大的停止。这种停止不是什么都不做，而是类似于老庄的清静无为。这就是无为而无不为，表面上没有做什么，但实际上已经成就了一切。"}]}, "53": {"shici": ["象征缓慢的前进，向上发展\n\n                 渐，女归吉，利贞。\n\n            渐卦，女子出嫁吉祥，利于守正道。\n\n            渐是前进的意思，但不是突飞猛进，而是等待、顺应时势变化的渐进，主吉象。事物不会总是停留在静止状态中，所以艮卦后面是渐卦。从卦象上看，山上生木。山中的森林不是突然形成的，树的缓慢生长就是渐的含义。从人事上看，尽管升卦也要积小为大，但毕竟处在无阻碍的时位，顺势而升；而渐卦则是有所等待而进。品德修养和风俗的改善都是一个渐进的过程，修己、化俗都不能一朝一夕即见成效，而要靠累积渐进。\n\n渐进是一种有次序的进，不越次序，因而缓慢。卦里借用女子出嫁来说明其中的道理。古代女子出嫁要行六礼：纳彩、问名、纳吉、纳征、请期、亲迎等六个步骤，必须严格按照这个程序去做。遵循了这六礼，这桩婚姻就是合理的，否则就是私奔。本卦如同女子出嫁那样，不能随便逾越任何一个步骤。\n\n得此卦，不应急进，急躁必有损失。好事慢慢在进行中，一切遵循正里常规即可，事业投资均能有收益。感情婚姻有欢喜结局，也有再娶或私奔之兆。求财虽可行，但有隔阻难成之象。"], "shuoming": [], "guayi": ["渐卦运势（事业、爱情、经商、诉讼、出行、人生）\n            本文所属分类：渐卦 \n            \n            运势：逐渐顺利，光明开运之象。应打牢根基，循序渐进为吉。\n            \n            事业：欲速则不达。忌急躁冒进，应脚踏实地，小心谨慎，态度谦和。\n            \n            爱情：不可操之过急。慢慢交往、循序发展可成就良缘。也有再娶之象。\n            \n            疾病：此卦为“归魂卦”，常有耳鸣、心神涣散之象，应往东南方求医。\n            \n            经商：改行、开业吉，渐进有利，过急不利，不可盲目乐观或停步不前。\n            \n            诉讼：一波未平，一波又起。宜进不宜退，退则输，进则胜。\n            \n            出行：有消息将至，三人中有一人先去。\n            \n            人生：做事讲技巧，重名声。若有优秀的技术和创新，能获得声誉或权力。"], "yunshi": []}, "54": {"shici": ["象征少女行为不当的婚嫁，没有好处\n\n                 归妹，征凶，无攸利。\n\n                 归妹卦，征伐会有凶险，无所利。\n\n                 “归”的本意是女子出嫁，引申义为归宿、回家。归妹代表少女出嫁。出嫁是女人的最终归宿，上一卦渐卦为女子待嫁，所以渐卦的后面是归妹卦。归妹是关系到人类终始的大问题。《易经》中有四卦表示男女关系：咸、恒、渐、归妹，其中数归妹卦最不好。在六十四卦中，卦辞没有一点好处的只有归妹与否两卦。出嫁是喜庆的事情，但此卦并非正常结婚，不是两厢情愿，而是去抢夺少女成婚。此时女性处于被动地位，多为被迫进行肉体的结合，缺乏精神之爱。另外，此卦含有小妹比姐姐更急于出嫁之象，多为感情冲动、不理智，所以为小吉带凶。\n\n在我国上古时代，抢婚制较为流行。如果女方不愿意，男方强迫娶妻，这对双方都没有好处。《易经》成书时，抢婚只是一种形势，早已没有了当初的强迫与残忍。但此时出现了女人夺夫权的问题。一个家庭中，男主人与女主人经常为了权力而争吵，怎么会有好处呢？这也反映出臣下权大欺君的弊端。\n\n女性得此卦者多有障碍，思虑不决。求财多为半途而废，需要独立的商业意识，适应和朋友共同奋斗合作。成就事情需要独立精神，家族很难成为其有力依托。预测婚姻，女性有被外诱之象，也有重夫之象，非良缘，易失败。应充实精神，促进成长，使其长久维持下去。"], "shuoming": [], "guayi": ["归妹卦运势（事业、爱情、经商、诉讼、出行、人生）\n            本文所属分类：归妹卦 \n            \n            运势：初时有悦，不久反凶，祸出百端，愿望受阻，有违常理，不可强行。\n            \n            事业：百事难保，多有不测之祸，正直反而有困难，也有色情破财之兆。\n            \n            爱情：有女追男之象，但多为悲剧。不可违背原则。不可强求，宁可晚婚。\n            \n            疾病：易反复，会恶化。多为肝病、肿瘤、骨髓之病。宜向东南方求医。\n            \n            经商：开拓新的市场即将成功。在商业活动中注意与他人的合作。\n            \n            诉讼：事情可能与女人有关，暗昧不清晰，宜和解。\n            \n            出行：女人不动则无事，如果遇阻隔，在未申日可动。\n            \n            人生：要注重追随权贵之人。仕途上难成魁首，有封号也是傀儡。"], "yunshi": []}, "55": {"shici": ["象征丰硕丰盛，自然亨通\n\n                    丰，亨，王假之，勿忧，宜日中。\n\n                    丰卦，亨通，君王来到，不必忧虑，适宜日在中午。\n\n                    丰是一个象形字。甲骨文的丰字为“豐”，他本是盛有贵重物品的礼器。所以丰的引申义是丰满、丰盛、硕大、丰富。丰卦的盛大非同一般，它是一种无与伦比的绝对盛大，太阳刚升起或将降落时都不可能有丰盛的光照，只有升到高空时，才有万丈光芒。但月盈则亏，盛大一旦超过极点，必定会由盛变衰。盛大的背后就隐藏着衰落，这不能不使人如履薄冰。所以盛大的表面是喜悦，实际上是忧虑，不要头脑发昏，使行为超过极限。要保持如日中天的现况，而不能扩张新事业。\n\n此卦虽然气势大，但盛为衰之时，百事不应进，应退守。有虚言计谋、意外惊险，应格外注意隐藏的忧患。预测婚姻，不易顺利，虽可成但不利。容易恋爱也容易分手，婚姻容易破裂。多为长男与次女的成熟夫妻，但不久将衰微。男女之间有损名节之事，但光明正大者则为吉。"], "shuoming": [], "guayi": ["丰卦运势（事业、爱情、经商、诉讼、出行、人生）\n            本文所属分类：丰卦 \n            \n            运势：吉中带小凶。雷电交加，声势壮大，运势极强，注意物极必反。\n            \n            事业：鼎盛时期，但注意衰败之兆，应防微杜渐，保持当前状况的延长。\n            \n            爱情：情投意合则速成，得意忘形则有失。如果一方自持或动摇则不利。\n            \n            疾病：多为急性病，注意心脏病或意外伤害，可往东南方求医。\n            \n            经商：改行、开业者吉。利于短期投资，但若有不慎，可能在一夜间破产。\n            \n            诉讼：先吉后凶，小事变大，多反复。若拖延很长时间才见官，会难以摆脱。\n            \n            出行：有阻隔，为他人所误，不可急动。\n            \n            人生：人生平淡无奇。成功多为爆发，持续时间不长，而后恢复平淡。"], "yunshi": []}, "56": {"shici": ["象征旅行，旅途，不安定\n\n                    旅，小亨，旅贞吉。\n\n                    旅卦，有小的亨通，旅行在外守正道则吉祥。\n\n                    象辞说：山上有火便是旅卦的卦象。君子从卦象中受到启示，明察审慎地使用刑罚，尽量不将犯人关在牢狱里。\n\n旅字本意指兵士。兵士在战争中走到哪里便在哪里安营扎寨，没有固定的居所，所以旅字的引申义为抛家舍业、羁旅于外、无家可归、寄人篱下。上一卦丰卦出现了大运动，这会使一些人迁徙奔波，所以丰卦后面是旅卦。从卦象上看，旅卦外卦为离为火，内卦为艮为山，山上有火。远古人类追逐猎物，随处而居，有洞穴则居于洞穴中，没有洞穴则宿于露天。在露宿的周围点燃篝火，以防野兽的侵袭。这就是旅卦的大形象。\n\n旅行在古代是一大难事，因为那时交通不便，旅行是一种不安定的行为，人在旅途，孤独寂寞，缺少照应，没有援助，不会亨通。一般来讲，家道穷困，不能维持生活，如果亲友多便会得到支持，不至于出门流浪。如果亲友少，便不得不背井离乡，另谋出路。流落异乡的人要想立刻有大作为是不可能的。这时不要勉强开拓道路，最好接受现实，入乡随俗。\n\n得此卦者，住处多有劳苦，居无定所。为始吉后忧之象。但适合做小事。预测婚姻，为多劳不稳、易生离别、外遇。求财可少得，远求有利，近求不利。财富追求大都在旅途中，适合在动中求财，如从事装饰、树立形象等方面的行业。不适合搞房地产等静止的行业。"], "shuoming": [], "guayi": ["旅卦运势（事业、爱情、经商、诉讼、出行、人生）\n            本文所属分类：旅卦 \n            \n            运势：小吉。变动不定，只能坚守信心，从小处着手，多参考他人意见。\n            \n            事业：事情多变，虽不现凶象，但令人烦心。应先图生存，先易后难。\n            \n            爱情：小矛盾多，意见不一。不确定因素多，游戏心态重。容易离婚。\n            \n            疾病：情况变化不定，有病情转移之象，应速求医，不可拖延。\n            \n            经商：障碍多，意料之外之事会随时发生。不可冒险，应从小买卖做起。\n            \n            诉讼：即使我方有理也应和解，若不和则有灾。\n            \n            出行：情况反覆，一会东一会西，两人同行则不可求财，否则易有损失。\n            \n            人生：不安分，思想灵动，很有活力。喜欢走动，但容易疲惫孤独。"], "yunshi": []}, "57": {"shici": ["象曰：一叶孤舟落沙滩，有篙无水进退难，时逢大雨江湖溢，不用费力任往返。", "巽，小亨，利有攸往，利见大人。\n\n            巽卦，有小的亨通，前往有利，利于拜见大人物。\n            \n            巽在八卦中代表风，风柔顺而无孔不入，能在每一角落和每一裂缝中穿行，随时令变化而变化，对任何事物均有柔软适应性。它无实体，变化莫测。人们可以感受他的存在，但无法保存和掌握，容易有波折和变化。它有弹性但易陷入无原则性的危险中，优柔寡断，进退两难，智者遵循这一原则，不断调整自己，以顺应社会环境的变化。\n\n巽卦阐述了顺从上级的做法，是与比自己位置高的人相处的智慧。顺从要保持在适当的时位上，不同的时位有不同的顺从方法。顺从不是懦弱的表现，不是无原则地服从。要从心底出发，不矫揉造作、勉强犹豫。卦辞说：君王让命令传达天下才能成就大业。古代信息业不发达，让天下人知道自己的命令是不容易的。现在社会也存在着上传下达的问题，如宣而不传、传而不做等。\n\n巽是宇宙创生的初始作用，与震卦的作用相互垂直，呈现为波的扩展。如果将震卦定义为垂直的作用，则巽卦为水平的作用。\n\n得此卦者性格飘忽不定，做事无定性，时而柔顺，时而狂暴。有骤变、破坏力强的一面。"], "shuoming": [], "guayi": ["巽卦运势（事业、爱情、经商、诉讼、出行、人生）\n            本文所属分类：巽卦 \n            \n            运势：六冲卦，大好大坏之象。多波折，游离不定，应随机应变。\n            \n            事业：谦虚处世，会受到同辈欢迎和上级重视。但不可懦弱和虚伪。\n            \n            爱情：时好时坏，轻飘不实，把戏不少，风波已生，不可轻率。\n            \n            疾病：久病则凶，且病情多变。多为糖尿病、胃肠病等，宜往西南方求医。\n            \n            经商：开业可行，但不可急。易有变动。应以谦逊的态度行事。\n            \n            诉讼：能和能散，是当前的形势。宜和解，和解则会有贵人。\n            \n            出行：若无口舌，便有虚惊。宜二人同行，应速出行，不利北方。\n            \n            人生：性格飘忽不定，不愿深入思考，容易接受随风而来的新思潮。"], "yunshi": [{"yaoci": "初六：进退，利武人之贞。", "fanyi": "初六：进退不决，利于武士守正道。", "jiedu": "初六体弱性柔，没有主心骨，进退犹豫，思想混乱，疑惑不决，补刚是初六的首要任务。如果临事能用武人的正气加以调整，则可勇猛果断，济其柔弱之不足。对症下药首先要整治其混乱的思想，树立其坚守正道的意志。"}, {"yaoci": "九二：巽在床下，用史巫纷若，吉无咎。", "fanyi": "九二：进入床下隐藏起来，让史官、巫官祷告敬神，吉祥没有灾难。", "jiedu": "九二钻到了床底下，因为床底下有初六。这种行为是有些不太雅观。可是其实这是一种巫术的仪式，是叫来史官巫师驱除室内的邪气，这自然不是有伤大雅的事情了，所以吉祥。九二帮助初六是出于正道，而不是出于自私的目的，所以吉祥没有灾难。"}, {"yaoci": "九三：频巽，吝。", "fanyi": "九三：一味顺从，会有忧吝。", "jiedu": "一个人自己没有主见，肯定不会有好结果。九三一直听六四的。六四为上卦的阴，所以九三有些太愚蠢了，他不相信家里人，反而相信外面的妇人之言，这怎么能不发生忧吝的事情呢？俗话说“妇人之口是非多”。在古代，妇女不关心国家大事，她们所关心的就是东家长西家短，这样说三道四肯定会招惹是非。所以古人认为听信妇人之言不会有好结果。"}, {"yaoci": "六四：悔亡，田获三品。", "fanyi": "六四：没有悔恨，田猎中捕获了三种猎物。", "jiedu": "六四柔居于偶位为得位，并且又可以得到九五与九三阳的帮助，所以他的收获不小。这就像打猎一样，他得到了很多猎物。“田获三品”指的是什么呢？指的是巽卦上卦巽为鸡，巽卦上互卦离为牛，巽卦下互卦兑为羊。当然，也指他可以笼络九五、九六、九三这三个阳。总之位高权重，又善于笼络人心，自然会左右逢源了。"}, {"yaoci": "九五：贞吉悔亡，无不利。无初有终，先庚三日，后庚三日，吉。", "fanyi": "九五：守正道吉祥没有悔恨，没有任何不利的。没有善始却有善终，庚日的前三天（丁日），庚日的后三天（癸日），吉祥。", "jiedu": "社会发生弊病时需要改革，要改革就要制定政策、发布命令并具体实施，在这一系列过程中特别注意做到谨慎，不可躁进躁动，要酝酿宣传在前，试行并总结经验于后。九五以阳居阳，损于谦逊，没有良好的开端却有良好的结尾。在变更的前三天发布新令，在后三天实行新令，办事谨严缜密，必获吉祥。”"}, {"yaoci": "上九：巽在床下，丧其资斧，贞凶。", "fanyi": "上九：躲藏在床下，失去了钱财，守正道凶险。", "jiedu": "在继位的皇帝中，太子为了及早得到君权而发动政变把父亲赶下台的事太多了。上九就是这么一个被赶下台的君王，是一个真正的懦夫，不仅屈居床下，连象征临事决断的利斧都丢了。与其说上九逊顺，不如说是卑躬屈节。如果不能做到守持阳刚之正，等待他的只能是凶险的死路。"}]}, "58": {"shici": ["兑，亨，利贞。\n            \n            兑卦，亨通，利于守正道。\n            \n            兑有中心诚实不虚伪之象，待人逊顺而不粗暴，所以给人带来喜悦。从卦象上看，兑为泽，有互相润泽、给予喜悦的含义；兑又为口，所以还有进行语言交流的含义。俗话说“会做的不如会说的”，“好汉出在嘴上，好马出在腿上”，可见语言的重要意义。谈话会使心灵沟通，但弄不好会相互谩骂，招致不合，所以善于言谈的人必须诚实，避免巧言令色。\n\n得此卦者，有双重喜悦，受外物影响而有所变动。此卦有与女性和悦之情，男性得此卦有色情损财之灾，为了博取短暂的愉悦而产生困扰，所以不可放纵任性，沉醉在美人窝中。女性得此卦则吉利。求财，疑虑多不能决，有难成之兆，做大事易成，做小事难成。预测婚姻，有良缘，但须防口舌。在宗教信仰上，对佛教、道教都有兴趣，在文化上喜欢思考儒家思想。"], "shuoming": [], "guayi": ["兑卦运势（事业、爱情、经商、诉讼、出行、人生）\n            本文所属分类：兑卦 \n            \n            运势：六冲卦，不顺。两泽相依，令人怡悦，但有喜有忧。\n            \n            事业：善长人际关系，能团结他人，获得援助。应保持谦虚，不可过分自信。\n            \n            爱情：和悦，也会娇蛮、任性、斗嘴，不可意气用事，随和自律为吉。\n            \n            疾病：多为与女色或口舌有关之病，可治。但久病则难愈。宜往东南方求医。\n            \n            经商：改行、开业吉利。交易中可获利丰厚，但有反复之象。\n            \n            诉讼：不是大事，只是有来往是非，有人解说后会和解。\n            \n            出行：虽有失脱，一失一喜，有人同行则会有口舌。\n            \n            人生：善于文化工作和语言表达。性格灵动温和，柔美内秀。"], "yunshi": [{"yaoci": "初九：和兑，吉。", "fanyi": "初九：和合喜悦，吉祥。", "jiedu": "初九刚居于奇位为得位，可是他属于处于孤独中自得其乐。这就好比孔门弟子困于贫穷中束发而歌。虽然生活清苦，但能够自得其乐。这是古代儒家所倡导的行为。这种人自然不会得到别人的猜疑，因为他不与是非之人交往，所以吉祥。"}, {"yaoci": "九二：孚兑，吉，悔亡。", "fanyi": "九二：诚信而喜悦，吉祥，没有悔恨。", "jiedu": "九二用诚信感化六三，就好比一个男子追求异性，要用真情使对方感动。可是对于国家来说，则是九二这个大夫用一片爱国之心使他的领导感动，当然这也就说明他的领导不是很爱国了。可是九二爱国，所以这种爱国热情会使六三受到感染。"}, {"yaoci": "六三：来兑，凶。", "fanyi": "六三：来求喜悦，凶险。", "jiedu": "六三就像脚踩两只船的女子。她并不是想从两个人中间选择一个作为自己的终身伴侣，而是在追求情欲的享乐，所以会带来凶险。对于国家来说，六三就是一个自私心很重的大臣，他四处讨好，左右逢源，但拉拢关系是为了私欲。这种行为会受到君王的高度警觉，六三难逃凶险。"}, {"yaoci": "九四：商兑，未宁，介疾有喜。", "fanyi": "九四：在喜悦的气氛中进行协商，还不安宁，除掉小毛病有喜庆之事。", "jiedu": "九四明白自己与六三相处的害处。所以他要与六三商量：“咱们是不是交往得太勤了，能不能少见几回面？”九四断决与六三的来往才会有喜庆之事。这就好比一个国家重臣，面对下面官员的糖衣炮弹的攻击，明白应该如何正确对待。所以他只要做到为官清廉，不收贿赂就会吉祥。"}, {"yaoci": "九五：孚于剥，有厉。", "fanyi": "九五：信任剥蚀阳刚的小人，有危险。", "jiedu": "对于一个君王来说，放纵自己的情欲是最危险的。比如夏桀与喜妹放纵情欲，喜妹在夏桀的眼里比天下还重要；殷纣与妲己放纵情欲，结果使纣王不再关心朝政；周幽王与褒姒放纵情欲，使西周走向了灭亡。总之，君王如果放纵情欲，便会把国家的政权交到自己所爱的女子手中。”"}, {"yaoci": "上六：引兑。", "fanyi": "上六：用引诱取悦于人。", "jiedu": "上六用引诱取悦于人，她所勾引的人便是九五君王。可是她不像六三那样不忠，所以她也没有六三那样危险。所以卦辞中没有“凶”的断语。比如武则天用姿色勾引君王使自己受宠，并因此而得到了权力。由于她执法严明，所以延续了唐朝的盛世，所以没有凶险可言。"}]}, "59": {"shici": ["象征涣散，焕发离散，形散而神聚\n\n                   涣，亨。王假有庙，利涉大川，利贞。\n\n                   涣卦，亨通。君王来到宗庙祭祀先祖，有利于跋涉大川，利于守正道。\n\n                   涣本意指水流分散，引申义为涣散、离散，主凶象。也表示民心反离、分裂。涣散不完全等于凶险，事物的发展往往是有散有聚的，散与聚是互相依存的辩证关系。水聚集于湖中，蒸发为水汽，这是散；但是雨又给湖泊补充了新的水源，这是聚。人与人、每个组织之间都经历过有散有聚的过程，原有的形态在完成特定性的使命后终将瓦解，而新的关系又将逐步确立。涣散促使陈旧制度瓦解，而孕育着新事物的诞生。关键是要抓住机遇，拯救涣散，促使其向聚合的方向转化。\n\n涣卦所描述的便是人类大迁移的场面。远古人类发明了舟楫，于是离开故居，漂洋过海，流散到世界各地。如美洲的印第安人便是从我国流散过去的移民。迁移更有利于生存，所以亨通。来到新的居住地后，部落酋长第一件事便是要建宗庙，因为宗庙祭祀可以团结民众，所以这是最重要的事。\n\n得此卦者会有任性、放纵的性格。求财难成，有不测之灾或蒙受损失，也有住居劳苦之象。我难彼顺，有颓废不振的运势。陷入困难，涣散溃败，向心力丧失，离心力增加。事业、感情、婚姻的根基开始松动，内部有不和，导致人们心神不宁、精神不佳，心绪沉闷。应稳定情绪、定下心神，在不稳定的情况下坚持主见，或远方交涉，或迁居，收拾涣散之局，重整聚合。"], "shuoming": [], "guayi": ["涣卦运势（事业、爱情、经商、诉讼、出行、人生）\n            本文所属分类：涣卦 \n            \n            运势：有冰雪消解之意。初有小损失，但终可解困。忌任性、放纵、散慢。\n            \n            事业：人心不齐，要去除私心，牺牲小我。不可介入争端，应力求重获安定。\n            \n            爱情：因小障碍、外在因素而离散，但情缘仍在，可能复合。\n            \n            疾病：病不稳定，有险象，但有解。起初体弱多病，多为逐渐康复之象。\n            \n            经商：起初有损失和波折，但可渐入佳境。目标准确则有利，可适当冒险。\n            \n            诉讼：宜缓不宜急，有第八个人和解，或不成事。\n            \n            出行：身已动又回。若寻人，之前有信息则不可确定，而后有信息可速动。\n            \n            人生：有强烈的权利欲望，有领导才能。做事情容易有所成就。"], "yunshi": []}, "60": {"shici": ["象征节制，但过分节制会自讨苦吃\n\n                   节，亨。苦节不可贞。\n\n                   节卦，亨通。苦苦节制不能够守正道。\n\n                   节的本意是竹节，竹子都分为数节，每一节都有适中的长度，所以节的引申义是节制、限制、节俭、衔接、关联。人的健康（节制）、人际关系（节操）、政策（节义）、天地变化（季节），一切都要遵守节才能顺利。所以象辞中对君子的告诫是：要掌握好分寸。比如，什么级别享受什么样的待遇，要有明文规定。不超过这个度，就是节俭，超过这个度，便是奢侈。\n\n从卦象上看，外卦坎为水，内卦兑为泽，泽上有水。水会由高至低流动，如果经过一个浅坑，水便会被积蓄而停止流动。沼泽比地面要低，可以蓄水。积水成泽便是节卦的大形象。节制是自然与人类社会共有的规律，刚柔相节，生成春夏秋冬四时，冬不能无限长，以春节制，夏也不能无限长，以秋来节制。\n\n比如洛克菲勒就是因为节省一滴焊锡而发展起来的。当时美国装石油用铁桶，而从石油注入铁桶一直到用焊锡封口都是由机械完成。洛克菲勒观察焊接这道工序，发现每次都可以节省一个焊点。于是他对机械进行改造，使焊每一桶都可以节省下一小滴焊锡。这个小发明给老板带来了很大的经济效益，洛克菲勒因此而受到了老板的重用。这是正确的节俭之道。\n\n得此卦者，应节制适中。于人于事，要有节度与分寸，适可而止。但若过于固执，又不近情理。应该明确自己的角色和定位，事业成功的重要条件是看首领人物是否使自己被量才使用。"], "shuoming": [], "guayi": ["节卦运势（事业、爱情、经商、诉讼、出行、人生）\n            本文所属分类：节卦 \n            \n            运势：状况卦，吉凶未定。有志不能伸，应和悦，并有节制。\n            \n            事业：不可冒进，应适当节制。节制必须有限度，过于节制会适得其反。\n            \n            爱情：多留意自己的言行举止，是否过份或放纵。男得此卦多有桃花。\n            \n            疾病：心脑血管、颈椎关节易出问题。病情有拖延之象，可往西北方求医。\n            \n            经商：改行、开业应缓，计划周详才可行。投资要有节制，适可而止。\n            \n            诉讼：应防女人。我方控诉对方，时间长了容易和解。\n            \n            出行：出行者还在路上，未归。未出行者宜静不宜动。\n            \n            人生：中意于仕途。人生呈阶段性特征，一段时间亨通，一段时间阻塞。"], "yunshi": []}, "61": {"shici": ["象征诚信，能感化万物\n\n                      中孚，豚鱼吉，利涉大川，利贞。\n\n                      中孚卦，对小猪小鱼都有诚信所以吉祥，利于跋涉大川险阻，利于守正道。\n\n                      中孚之意为诚信、真诚。“孚”字原为“孵”字，鸟孵卵有固定的日期，不能延误，小鸟应该多少天出生就必然在那天破壳。所以“孚”字有信守时间、承诺的意思。诚信十分重要。儒家提出了“仁、义、礼、智、信”五德，把仁排在第一位，信排在最后一位，不是说信不重要，而是说他是做人的道德底线，人不可以突破这个底线。\n\n从卦象上看，中孚卦的六爻组成一个符契的形象。古人订合同时将内容写在竹板上，然后把竹板断成两块，每人一块。当两块竹板能够完整地对在一起时，合同才可以生效。所以说符契是取信的证据。从内外卦看，泽上有风。这个风指信风，每年相同的时间，信风都会从同一个方向吹来，这是风的诚信。\n\n卦辞说：“君子以议狱缓死”，意为尽量不处死罪犯。罪犯虽然罪孽深重，但如果他们在受刑前有了悔改的诚意，想重新做人，为什么不能相信他们一次呢？所以应“缓死”。君子的诚信之德要无所不施，对犯人也不例外。\n\n此卦始凶后吉，主吉象。得此卦者应正直而诚信，不得虚伪。如果此卦为本卦，变而成其他卦，多为事不成之兆；反之，如果此卦由其他卦变来，则多为可成，但有口舌。"], "shuoming": [], "guayi": ["中孚卦运势（事业、爱情、经商、诉讼、出行、人生）\n            本文所属分类：中孚卦 \n            \n            运势：泽水相应而起波浪，为共鸣之象。诚信则吉，利于他乡财路。\n            \n            事业：不可以孤傲的性格自我封闭。真诚守信，和悦谦虚，可亡羊补牢。\n            \n            爱情：结局吉，双方以诚相待可成良缘。男性得此卦有左右逢源之象。\n            \n            疾病：小凶之象，腰部、下腹部容易得病。可往东南方求医。\n            \n            经商：讲究信义，保质保量则吉，甚至冒险犯难也不会出问题。\n            \n            诉讼：飞来之事，宜速速处理，如果延迟则有损伤。\n            \n            出行：会遇到其他人，凡事方便、顺利。\n            \n            人生：适合在政法、医院工作，多为中级干部，执掌过渡性的权力。"], "yunshi": []}, "62": {"shici": ["象征小有过失，过度，警示过错\n\n                      小过，亨，利贞，可小事，不可大事。飞鸟遗之音，不宜上宜下，大吉。\n\n                      小过卦，亨通，利于守正道。可以做小事情，不可做大事情。飞鸟遗有余音，不宜向上飞，宜于向下飞，大吉祥。\n\n                      过是经过、度过、过度、超越的意思。小过卦象征小有过越，在小有过错的时候，适合做阴柔、柔小的事，以柔克刚，谦恭卑柔的心态可以改变局面。向上行大志则易违逆，向下施行小事则会安顺。向上过越则凶险，向下过越则吉祥。大过卦与小过卦的区别主要在于“大”与“小”的差异。\n\n从卦象上看，小过卦像一只飞鸟，中间两个阳爻为鸟身，上下四个阴爻为展开的鸟翅，所以有小鸟飞过的形象。从内外卦看，外卦为震为雷，内卦为艮为山，山顶响惊雷。此时，小的过错太多，或稍微有些过分。山顶的雷声比平地上的要响亮，这喻示着对过错的警示。卦中阴爻代表小人，他们包围着阳爻，且数量多于阳爻，为小人猖獗得意。\n\n得此卦者，工作、事业、婚恋容易走错路，需要再次努力。求财应迟。预测婚姻，虽有碍有疑但终可成，虽成又有不和。不应做大事、走大路，做事情要步步小心，走小路才能取得成功。"], "shuoming": [], "guayi": ["小过卦运势（事业、爱情、经商、诉讼、出行、人生）\n            本文所属分类：小过卦 \n            \n            运势：小有不顺，或被打压，忌冲动犯上。应做小事，不应做大事。\n            \n            事业：行动应谨慎小心，步步为营，知退守则吉。不可冒险或钻营。\n            \n            爱情：相处有障碍，常生口角，有去外地之象。虽可成功但最终又不和。\n            \n            疾病：病在神经，行动不变，食物不落，心痛腹痛，宜向往东南方求医。\n            \n            经商：改行、开业不利。应稍试探便收敛。不应大规模行动，应逐步发展。\n            \n            诉讼：有人作梗，宜和解，和解则没有损失。\n            \n            出行：会忧疑，破财后方能行动；或者在外有阻，事情反复。\n            \n            人生：具有两面、多变性格。仕途上寻求靠山，会当秘书。"], "yunshi": []}, "63": {"shici": ["象征事已成功，但过于完整反而易僵化，不能再有大作为\n\n                   既济，亨小，利贞，初吉终乱。\n\n                   既济卦，小有亨通，利于守正道，起初吉祥最终混乱。\n\n                   既是成功、完成；济是渡河。既济是成功渡过的意思。将细节之事做得完美就会成就大事，所以小过卦的后面是既济卦。既济卦与乾卦似乎有某种联系，从乾卦开始的人生奋斗经历了六十余卦的变化发展，进入大功告成的既济境界。既济卦是六十四卦中最完美的一卦：一、卦爻的排列方式完全符合阳奇阴偶的规则，各爻均在正位，且相互正应，这是最理想的形态；二、卦中各爻都有相应相合者，没有一个爻处于孤立之中；三、从卦象上看，外卦为水，内卦为火，坎水润下，离火炎上，水与火相交相合，互相补救，处于平衡状态。\n\n比如治国，高明的君王总是奸臣与忠诚并用，这便是水与火的平衡。比如乾隆既任用纪晓岚、刘墉，又任用何珅；慈禧太后既任用洋务派大臣，又任用保守派大臣……这是统治者的统御之道。只有忠臣，忠臣逐着权势加大也会变成妄为；只有奸臣，更会使局面动荡混乱。以忠臣克制奸臣，以奸臣制约忠臣，是最高明的统治之道。由此可以看出水火相交是多么重要。\n\n既济是万物经过变化达到阴阳平衡的局面，代表大功告成。但既济只是人生的一个驿站，而不是终点。物极必反，成功后容易陷入懈怠、混乱，所以守成更为艰难。此时不要进行新事业，维持现状最重要。一旦平衡局面被打破，出现新的矛盾，新的过程又将开始，既济也就又转为未济。所以居安思危、慎终如始是既济卦的核心思想。\n\n得此卦时，不懈怠则可保吉祥，若气盛骄傲则有凶。求财，似成而不成。预测婚姻，应缓慢发展。"], "shuoming": [], "guayi": ["既济卦运势（事业、爱情、经商、诉讼、出行、人生）\n          本文所属分类：既济卦 \n          \n          运势：吉中带凶之象。百事有成，应保持初吉之成果，退守为吉，骄惰为凶。\n          \n          事业：大功已成。保住这种势头是关键。盛极将衰，应思患预防，防微杜渐。\n          \n          爱情：初时多为出双入对，形影不离，久后则易生变，甚至离散。\n          \n          疾病：阴入阳体，相互抗衡，日轻夜重，需尽快处理。可往西北方求医。\n          \n          经商：改行、开业不利。虽然形势有利，收益较多，但危机可能随时出现。\n          \n          诉讼：有小人侵犯，但最终不过是一场虚惊。\n          \n          出行：宜出行但不宜求财，往东北方有利，宜与人同行。\n          \n          人生：年轻时灿烂辉煌，晚年孤独寂寞。财富机遇好坏参半。"], "yunshi": []}, "64": {"shici": ["象征事未成，但充满着发展的可能性\n\n                   未济，亨，小狐汔济，濡其尾，无攸利。\n\n                   未济卦，亨通，小狐狸快要能够走过小河，沾湿了它的尾巴，无所利。\n\n                   既济表示事已成，未济表示事未成。与既济卦水在火上可以煮食相反，未济卦火在水上，不能烹饪，象征事未成，处于完全的混乱无序状态中。未济是没渡过河的意思。其引申义为未完成、未终止。人们常用“时运不济”形容运气不佳，这“不济”就是“未济”。既济之时要慎终如始，未济之时则要慎始慎终，一个环节疏忽大意就可能功亏一篑。\n\n从卦象上看，火在水上，火向上而水向下，不再相交，无法互补平衡。六爻皆不得位，君不像君臣不像臣，国已不国。这么不好，卦辞中怎么还有“亨”呢？因为此卦是一个新开始的过渡阶段，任何力量也阻挡不了，所以亨通。但这种过渡极其艰苦，君子该怎么办呢？要明辨各类事物，重点在于选择。一切均会雨过天晴，值得等待。\n\n既济、未济两卦在六十四卦中的地位极为特殊，仅次于乾、坤两卦。《易经》的作者把事物看做有始有终、终而复始、有生有灭、生生不息的过程。而这个过程是由阴阳相聚所形成的天地为起始的，故以乾坤两卦为开始；天地生成万物，遂有千万种变化，故乾坤两卦之后的各卦展开各种矛盾斗争：从自然规律到政治形势，从统治阶级到普通百姓，从婚姻家庭到衣食住行，从文化民俗到哲学思想……过程总有穷尽之时，矛盾总有解决之时，所以经过无数阴阳消长、事物盛衰的矛盾斗争，终于有了一个终结，迎来了阴阳协调、矛盾消失、大功告成、万事亨通的既济时代。矛盾的止息只是相对的，运动才是绝对的，随着旧事物的终结，新事物必将产生，所以并不以既济作结，而是以未济作结。这充分反映了作者对宇宙变易无穷的认识。\n\n此卦有妇凌夫之象。男性有较女方贫困而受其辱的可能，女性应防外遇。预测婚姻，多劳但可成，有先难后易之象。也有精神恋爱的可能，或没有恋爱过程而直接结婚。性格上有自己的处世理论，忘记昨天而去做明天的事情。容易追求虚幻的东西，如信仰道教。"], "shuoming": [], "guayi": ["未济卦运势（事业、爱情、经商、诉讼、出行、人生）\n          本文所属分类：未济卦 \n          \n          运势：凶中带小吉、初衰后盛之象。气运不通，百事不如愿，阴阳不调和。\n          \n          事业：运气不佳，处于关键时刻。但因为“未完成”，所以前途无量。\n          \n          爱情：开始时不能沟通，背对而处，格格不入。应该慢慢接受对方。\n          \n          疾病：容易得慢性疾病。病情很不稳定，似有危险，应往东北方求医。\n          \n          经商：改行、开业为吉。初时不佳，前景不明确，有渐渐好转之象。\n          \n          诉讼：事情头绪杂乱，矛盾难解，我方克对方，最终会和解。\n          \n          出行：有四人同行，先失后得，虽有口舌但无妨。\n          \n          人生：自己闯荡，获得财富没有过程只有结果，适合长期投资。"], "yunshi": []}};

document.getElementById("result-overlay").addEventListener("click",function(){this.style.display="none";document.getElementById("hint").style.display=""});
function showDetail(){if(!currentId)return;document.getElementById("result-overlay").style.display="none";renderDetail(currentId)}
function goGua(id){currentId=id;document.getElementById("hint").style.display="none";document.getElementById("result-overlay").style.display="none";renderDetail(id)}
function renderDetail(id){var g=GUAS[id];if(!g)return;document.getElementById("d-num").textContent=id;document.getElementById("d-name").textContent=NAMES[id]||"";var h="";if(g.shuoming&&g.shuoming.length>0){h+='<div class="section"><div class="section-label">卦辞</div>';g.shuoming.forEach(function(s){h+='<div class="section-text o">'+s+"</div>"});h+="</div>"}if(g.guayi&&g.guayi.length>0){h+='<div class="section"><div class="section-label">卦义</div>';g.guayi.forEach(function(s){h+='<div class="section-text r">'+s+"</div>"});h+="</div>"}if(g.shici&&g.shici.length>0){h+='<div class="section"><div class="section-label">诗辞</div>';g.shici.forEach(function(s){h+='<div class="section-text p">'+s+"</div>"});h+="</div>"}if(g.yunshi&&g.yunshi.length>0){h+='<div class="section"><div class="section-label">爻辞</div>';g.yunshi.forEach(function(y){h+='<div class="yao-item"><div class="yao-label">'+y.yaoci+'</div><div class="section-text g" style="margin-top:6px">'+y.fanyi+'</div><div class="section-text" style="margin-top:6px">'+y.jiedu+"</div></div>"});h+="</div>"}document.getElementById("d-content").innerHTML=h;document.getElementById("detail").classList.add("active");document.getElementById("detail").scrollTop=0}
function hideDetail(){document.getElementById("detail").classList.remove("active");document.getElementById("hint").style.display=""}
</script>
