<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中间地点推荐</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%234ecdc4'/><text x='50' y='58' text-anchor='middle' font-size='36' fill='%23000' font-weight='bold'>📍</text></svg>" type="image/svg+xml">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#1a1a2e;color:#eee;height:100vh;display:flex;flex-direction:column}
.top{background:rgba(20,20,40,0.95);padding:16px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:10;border-bottom:1px solid rgba(255,255,255,0.08)}
.top label{font-size:0.85em;color:#aaa;white-space:nowrap}
.top input{padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:#fff;font-size:0.9em;width:160px;outline:none}
.top input:focus{border-color:#ffd200}
.top select{padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:#fff;font-size:0.9em;outline:none}
.top button{padding:8px 20px;border-radius:8px;border:none;background:linear-gradient(135deg,#f7971e,#ffd200);color:#000;font-weight:bold;cursor:pointer;font-size:0.9em}
.top button:hover{opacity:0.9}
.main{flex:1;display:flex;min-height:0}
#map{flex:1}
#panel{width:380px;background:rgba(20,20,40,0.95);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
#panel h3{font-size:1em;color:#ffd200;margin-bottom:4px}
.type-tabs{display:flex;gap:6px;margin-bottom:4px}
.type-tab{padding:4px 12px;border-radius:12px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:#aaa;cursor:pointer;font-size:0.8em}
.type-tab.active{background:#ffd200;color:#000;border-color:#ffd200}
.result-card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:10px 12px;cursor:pointer;transition:0.15s;display:flex;gap:10px;align-items:center}
.result-card:hover,.result-card.active{border-color:#ffd200;background:rgba(255,210,0,0.06)}
.result-card .num{width:24px;height:24px;border-radius:50%;background:rgba(255,210,0,0.15);display:flex;align-items:center;justify-content:center;font-size:0.75em;flex-shrink:0}
.result-card .info{flex:1;min-width:0}
.result-card .info .name{font-weight:600;font-size:0.85em}
.result-card .info .addr{font-size:0.7em;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-card .meta{text-align:right;flex-shrink:0}
.result-card .meta .score{color:#ffd200;font-weight:bold;font-size:0.9em}
.result-card .meta .dist{font-size:0.65em;color:#888}
.hint{text-align:center;color:#666;font-size:0.85em;padding:40px 0}
.mid-info{background:rgba(255,210,0,0.08);border-radius:8px;padding:8px 12px;font-size:0.8em;color:#ffd200;text-align:center;display:none}
</style>
</head>
<body>
<div class="top">
  <label>起点：</label><input id="addr1" placeholder="如：北京刘家窑" value="北京刘家窑">
  <label>终点：</label><input id="addr2" placeholder="如：北京中关村" value="北京中关村">
  <button onclick="search()">🔍 搜中间地点</button>
  <span style="font-size:0.7em;color:#666;margin-left:8px">按回车快速搜索</span>
</div>
<div class="main">
  <div id="map"></div>
  <div id="panel">
    <div class="hint">👆 输入两个地址，点击搜索</div>
    <div class="mid-info" id="midInfo"></div>
    <div id="results"></div>
  </div>
</div>

<script>
window._AMapSecurityConfig = { securityJsCode: '' };
const KEY = '8d740b0d034e0c3d8ccf3403f99464f6';
</script>
<script src="https://webapi.amap.com/maps?v=2.0&key=8d740b0d034e0c3d8ccf3403f99464f6"></script>
<script>
let map, markers=[], midMarker, circleMarker, currentType='咖啡';

const TYPES = {
  '咖啡': {kw:'咖啡',icon:'☕',color:'#8B4513'},
  '公园': {kw:'公园',icon:'🌳',color:'#228B22'},
  '餐厅': {kw:'餐厅',icon:'🍽',color:'#DC143C'}
};

function initMap(){
  map = new AMap.Map('map',{zoom:12,center:[116.40,39.90],resizeEnable:true});
  document.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')search()}));
}

function showType(type){
  currentType=type;
  document.querySelectorAll('.type-tab').forEach(t=>t.classList.toggle('active',t.textContent.includes(type)));
  search();
}

async function search(){
  const a1=document.getElementById('addr1').value.trim();
  const a2=document.getElementById('addr2').value.trim();
  if(!a1||!a2) return;

  clearMarkers();
  document.getElementById('results').innerHTML='<div class="hint">搜索中...</div>';
  document.getElementById('midInfo').style.display='none';

  let p1,p2;
  try{
    const r1=await geocode(a1);
    const r2=await geocode(a2);
    p1=[r1.location.lng,r1.location.lat];
    p2=[r2.location.lng,r2.location.lat];
  }catch(e){
    document.getElementById('results').innerHTML='<div class="hint">❌ 地址解析失败: '+e.toString().substring(0,50)+'</div>';console.error('Geocode error:',e);
    return;
  }

  const mid=[(p1[0]+p2[0])/2,(p1[1]+p2[1])/2];
  const dist=AMap.GeometryUtil.distance(p1,p2)/1000;

  // Markers
  addMarker(p1,'起点：'+a1,'#ff6b6b');
  addMarker(p2,'终点：'+a2,'#4ecdc4');
  midMarker=addMarker(mid,'中间点','#ffd200','★');
  circleMarker=new AMap.Circle({center:mid,radius:5000,map,strokeColor:'#ffd200',strokeWeight:1,strokeOpacity:0.3,fillOpacity:0.04,zIndex:1});
  map.setFitView(null,false,[80,80,380,80]);

  document.getElementById('midInfo').style.display='block';
  document.getElementById('midInfo').innerHTML=`📍 中间点 · 相距 ${dist.toFixed(1)}km · 搜索半径5km`;

  // Search POIs
  const cfg=TYPES[currentType];
  const kw=cfg.kw;
  const pois=await searchAround(mid,kw,5000,15);
  renderResults(pois,cfg,mid);
}

function geocode(addr){
  if(!addr.includes('北京')&&!addr.includes('市')&&addr.length<8) addr='北京'+addr;
  return fetch(`https://restapi.amap.com/v3/geocode/geo?key=${KEY}&address=${encodeURIComponent(addr)}`)
    .then(r=>r.json())
    .then(d=>{
      if(d.status==='1') return {location:{lng:parseFloat(d.geocodes[0].location.split(',')[0]),lat:parseFloat(d.geocodes[0].location.split(',')[1])}};
      throw new Error(d.info||'geocode failed');
    });
}

function searchAround(center,kw,radius,limit){
  return new Promise((resolve)=>{
    const url=`https://restapi.amap.com/v3/place/around?key=${KEY}&location=${center[0]},${center[1]}&keywords=${encodeURIComponent(kw)}&radius=${radius}&offset=${limit}&extensions=all&sortrule=distance`;
    fetch(url).then(r=>r.json()).then(d=>resolve(d.pois||[]));
  });
}

function addMarker(pos,label,color,star){
  const size=star?32:22;
  const m=new AMap.Marker({
    position:pos,map,
    icon:new AMap.Icon({
      size:new AMap.Size(size,size),imageSize:new AMap.Size(size,size),
      image:'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}"><circle cx="${size/2}" cy="${star?size*0.4:size/2}" r="${star?size*0.35:size*0.4}" fill="${color}" opacity="0.9" stroke="#333" stroke-width="1.5"/>${star?`<polygon points="${size/2},${size-2} ${size*0.15},${size*0.55} ${size*0.85},${size*0.55}" fill="${color}" stroke="#333" stroke-width="1.5"/><text x="${size/2}" y="${size*0.48}" text-anchor="middle" fill="#000" font-size="${size*0.28}" font-weight="bold">★</text>`:''}</svg>`)
    }),
    label:star?{content:label,direction:'top',offset:new AMap.Pixel(0,-8),style:{color:'#ffd200',fontSize:'11px',background:'rgba(0,0,0,0.75)',padding:'2px 6px',borderRadius:'4px'}}:null
  });
  markers.push(m);
  return m;
}

function clearMarkers(){
  markers.forEach(m=>m.setMap(null));markers=[];
  if(midMarker){midMarker.setMap(null);midMarker=null;}
  if(circleMarker){circleMarker.setMap(null);circleMarker=null;}
}

function renderResults(pois,cfg,center){
  const panel=document.getElementById('results');
  if(!pois.length){panel.innerHTML='<div class="hint">未找到结果</div>';return;}

  // Type tabs
  let html='<div class="type-tabs">';
  for(const [t,c] of Object.entries(TYPES)){
    html+=`<button class="type-tab${t===currentType?' active':''}" onclick="showType('${t}')">${c.icon} ${t}</button>`;
  }
  html+='</div>';

  const top10=pois.slice(0,10);
  const color=cfg.color;

  top10.forEach((p,i)=>{
    const dist=p.distance?parseInt(p.distance):0;
    html+=`<div class="result-card" onclick="focusPOI([${p.location.split(',')[0]},${p.location.split(',')[1]}],'${p.name.replace(/'/g,"\\'")}')">
      <div class="num" style="${i<3?'background:linear-gradient(135deg,#f7971e,#ffd200);color:#000':''}">${i+1}</div>
      <div class="info"><div class="name">${p.name}</div><div class="addr">${p.address||''}</div></div>
      <div class="meta"><div class="score">${p.biz_ext&&p.biz_ext.rating?'⭐'+p.biz_ext.rating:''}</div><div class="dist">${dist>1000?(dist/1000).toFixed(1)+'km':dist+'m'}</div><a href="https://www.dianping.com/search/keyword/2/0_${p.name}" target="_blank" style="font-size:0.65em;color:#ffd200;text-decoration:none;margin-top:2px;display:block" onclick="event.stopPropagation()">🔍 大众点评</a></div>
    </div>`;

    // POI marker - 加大标记，颜色更醒目
    const poiData = p;
    const markerSize = 28;
    const m=new AMap.Marker({
      position:[p.location.split(',')[0],p.location.split(',')[1]],map,
      icon:new AMap.Icon({
        size:new AMap.Size(markerSize,markerSize),imageSize:new AMap.Size(markerSize,markerSize),
        image:'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${markerSize}" height="${markerSize}"><defs><filter id="s"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.4"/></filter></defs><circle cx="${markerSize/2}" cy="${markerSize/2}" r="10" fill="${color}" stroke="#333" stroke-width="2.5" filter="url(#s)"/><text x="${markerSize/2}" y="${markerSize/2+4}" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">${cfg.icon}</text></svg>`)
      }),
      zIndex: 120,
      extData: poiData
    });
    // 点击标记弹出详情
    m.on('click', function(e){
      const d = e.target.getExtData();
      const rating = d.biz_ext && d.biz_ext.rating ? '⭐'+d.biz_ext.rating : '';
      const tel = d.tel ? '<br> '+d.tel : '';
      const type = d.type ? '<br> '+d.type : '';
      const dpUrl = `https://www.dianping.com/search/keyword/2/0_${d.name}`;
      const content = `<div style="padding:12px;max-width:300px">
        <div style="font-size:15px;font-weight:bold;margin-bottom:6px;color:#222">${cfg.icon} ${d.name}</div>
        <div style="font-size:12px;color:#333;margin-bottom:4px">📍 ${d.address||'暂无地址'}</div>
        ${rating?'<div style="font-size:13px;margin-bottom:4px;color:#222">'+rating+'</div>':''}
        ${tel?'<div style="font-size:12px;color:#333">'+tel+'</div>':''}
        ${type?'<div style="font-size:12px;color:#444">'+type+'</div>':''}
        <div style="font-size:11px;color:#555;margin-top:6px;margin-bottom:10px">距中间点 ${d.distance?parseInt(d.distance)>1000?(parseInt(d.distance)/1000).toFixed(1)+'km':d.distance+'m':'--'}</div>
        <a href="${dpUrl}" target="_blank" style="display:inline-block;padding:6px 16px;background:#f63;font-size:12px;color:#fff;text-decoration:none;border-radius:14px;font-weight:bold">🔥 大众点评查看详情</a>
      </div>`;
      const infoWindow = new AMap.InfoWindow({
        content: content,
        offset: new AMap.Pixel(0, -20)
      });
      infoWindow.open(map, [d.location.split(',')[0], d.location.split(',')[1]]);
    });
    markers.push(m);
  });

  panel.innerHTML=html;
}

let selectedMarker = null;
function focusPOI(pos,name){
  var lng = parseFloat(pos[0]), lat = parseFloat(pos[1]);
  map.setCenter([lng,lat]);
  map.setZoom(16);
  // 找到最近的POI标记并高亮
  var best = null, bestDist = Infinity;
  markers.forEach(function(m){
    var mp = m.getPosition();
    var d = Math.abs(mp.lng-lng)+Math.abs(mp.lat-lat);
    if(d < bestDist){ bestDist = d; best = m; }
  });
  if(best){
    if(selectedMarker) selectedMarker.setIcon(selectedMarker._normalIcon);
    best._normalIcon = best.getIcon();
    best.setIcon(new AMap.Icon({
      size: new AMap.Size(36,36), imageSize: new AMap.Size(36,36),
      image: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36"><circle cx="18" cy="13" r="12" fill="#ffd200" opacity="0.95" stroke="#333" stroke-width="2"/><polygon points="18,36 7,18 29,18" fill="#ffd200" stroke="#333" stroke-width="2"/><text x="18" y="16" text-anchor="middle" fill="#000" font-size="12" font-weight="bold">📍</text></svg>')
    }));
    selectedMarker = best;
    // 弹信息窗
    var info = new AMap.InfoWindow({
      content: '<div style="padding:4px 8px;font-size:14px;font-weight:bold;color:#fff;background:#333;border-radius:4px">'+name+'</div>',
      offset: new AMap.Pixel(0,-40)
    });
    info.open(map, [lng,lat]);
    setTimeout(function(){ info.close(); }, 3000);
  }
}
</script>
<script>initMap();setTimeout(function(){search();},800);</script>
</body>
</html>
