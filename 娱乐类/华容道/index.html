<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华容道</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: 'Microsoft YaHei', sans-serif;
        }
        #game-container {
            background: #D2691E;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #header { text-align: center; color: #fff; margin-bottom: 10px; }
        #header h1 { font-size: 24px; }
        #info { display: flex; justify-content: center; gap: 20px; margin-top: 10px; }
        .info-item { background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 20px; }
        #game-board {
            position: relative;
            width: 250px;
            height: 312px;
            background: #DEB887;
            border: 4px solid #8B4513;
            border-radius: 8px;
            overflow: hidden;
        }
        .block {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: inset 2px 2px 5px rgba(255,255,255,0.3);
        }
        .block:hover { filter: brightness(1.1); }
        .caocao { background: #e74c3c; }
        .general-v { background: #3498db; }
        .general-h { background: #9b59b6; }
        .soldier { background: #2ecc71; }
        .exit {
            position: absolute;
            bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 125px; height: 30px;
            background: rgba(255,255,0,0.6);
            border: 2px dashed #f1c40f;
            border-top: none;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #8B4513;
            font-weight: bold;
            z-index: 1;
        }
        #controls { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; border: none; padding: 10px 20px;
            font-size: 14px; border-radius: 20px; cursor: pointer;
        }
        .btn:hover { transform: scale(1.05); }
        #win-message {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: white; padding: 40px;
            border-radius: 20px; text-align: center; z-index: 100;
        }
        #win-message.show { transform: translate(-50%, -50%) scale(1); }
        #win-message h2 { color: #e74c3c; font-size: 32px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="header">
            <h1>🏯 华容道</h1>
            <div id="info">
                <div class="info-item">🔢 步数：<span id="moves">0</span></div>
                <div class="info-item">⏱️ 时间：<span id="timer">0</span>s</div>
            </div>
        </div>
        <div id="game-board"></div>
        <div id="controls">
            <button class="btn" onclick="resetGame()">🔄 重新开始</button>
            <button class="btn" onclick="showHelp()">📖 玩法说明</button>
            <button class="btn" onclick="autoSolve()">🤖 自动演示</button>
        </div>
    </div>
    <div id="win-message">
        <h2>🎉 曹操逃脱了!</h2>
        <button class="btn" onclick="resetGame(); document.getElementById('win-message').classList.remove('show')">再来一局</button>
    </div>

    <script>
        const board = document.getElementById('game-board');
        const movesEl = document.getElementById('moves');
        const timerEl = document.getElementById('timer');

        // 5x6 网格，每格 50px + 1px 间隙
        const GW = 5, GH = 6, C = 50;

        // 简化布局 - 保证能走出去
        const layout = [
            { id: 'cc', t: 'caocao', w: 2, h: 2, x: 1, y: 1, n: '曹操' },
            { id: 'f', t: 'general-v', w: 1, h: 2, x: 0, y: 0, n: '张飞' },
            { id: 'm', t: 'general-v', w: 1, h: 2, x: 4, y: 0, n: '马超' },
            { id: 'h', t: 'general-v', w: 1, h: 2, x: 0, y: 2, n: '黄忠' },
            { id: 'z', t: 'general-v', w: 1, h: 2, x: 4, y: 2, n: '赵云' },
            { id: 'g', t: 'general-h', w: 2, h: 1, x: 1, y: 3, n: '关羽' },
            { id: 'b1', t: 'soldier', w: 1, h: 1, x: 1, y: 4, n: '卒' },
            { id: 'b2', t: 'soldier', w: 1, h: 1, x: 2, y: 4, n: '卒' },
            { id: 'b3', t: 'soldier', w: 1, h: 1, x: 3, y: 4, n: '卒' },
            { id: 'b4', t: 'soldier', w: 1, h: 1, x: 0, y: 5, n: '卒' },
            { id: 'b5', t: 'soldier', w: 1, h: 1, x: 4, y: 5, n: '卒' },
        ];

        let blocks = [], moves = 0, timer = null, auto = false, timerStart;

        function init() {
            blocks = JSON.parse(JSON.stringify(layout));
            moves = 0; movesEl.textContent = 0;
            timerEl.textContent = 0;
            auto = false;
            clearInterval(timer);
            timer = setInterval(() => timerEl.textContent = Math.floor((Date.now() - timerStart) / 1000), 1000);
            timerStart = Date.now();
            render();
        }

        function render() {
            board.innerHTML = '<div class="exit">🚪 出口</div>';
            blocks.forEach(b => {
                const el = document.createElement('div');
                el.className = 'block ' + b.t;
                el.style.cssText = 'width:'+(b.w*C-2)+'px;height:'+(b.h*C-2)+'px;left:'+(b.x*C+1)+'px;top:'+(b.y*C+1)+'px';
                el.textContent = b.n;
                if (!auto) el.onclick = () => move(b);
                board.appendChild(el);
            });
        }

        function ok(b, dx, dy) {
            const nx = b.x + dx, ny = b.y + dy;
            if (nx < 0 || nx + b.w > GW || ny < 0 || ny + b.h > GH) return false;
            return !blocks.some(x => x !== b && x.x < nx + b.w && x.x + x.w > nx && x.y < ny + b.h && x.y + x.h > ny);
        }

        function move(b) {
            if (auto) return;
            for (let [dx, dy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
                if (ok(b, dx, dy)) {
                    b.x += dx; b.y += dy;
                    moves++; movesEl.textContent = moves;
                    render();
                    check();
                    return;
                }
            }
        }

        function go(id, dx, dy) {
            const b = blocks.find(x => x.id === id);
            if (b && ok(b, dx, dy)) {
                b.x += dx; b.y += dy;
                moves++; movesEl.textContent = moves;
                render();
                return true;
            }
            return false;
        }

        // 解法步骤
        const steps = [
            ['b1',0,1],['b2',1,0],['b3',-1,0],['g',0,1],
            ['cc',0,1],['f',1,0],['h',0,-1],['b4',1,0],
            ['g',-1,0],['cc',0,1]
        ];

        async function autoSolve() {
            if (auto) return;
            auto = true;
            blocks = JSON.parse(JSON.stringify(layout));
            moves = 0; movesEl.textContent = 0;

            for (let [id, dx, dy] of steps) {
                await new Promise(r => setTimeout(r, 400));
                if (!go(id, dx, dy)) break;
                if (checkCond()) { check(); break; }
            }
            auto = false;
        }

        function checkCond() {
            const c = blocks.find(b => b.id === 'cc');
            return c && c.x === 1 && c.y === 4;
        }

        function check() {
            if (checkCond()) {
                clearInterval(timer);
                document.getElementById('win-message').classList.add('show');
            }
        }

        function resetGame() { clearInterval(timer); init(); }
        function showHelp() { alert('让曹操从底部出口出去！\n点击方块移动到相邻空位。'); }

        timerStart = Date.now();
        init();
    </script>
</body>
</html>
