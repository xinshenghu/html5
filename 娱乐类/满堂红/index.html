<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>满堂红</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #c0392b 0%, #e74c3c 100%);
            font-family: 'Microsoft YaHei', sans-serif;
        }
        #game-container {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #header {
            text-align: center;
            margin-bottom: 20px;
        }
        #header h1 { color: #c0392b; font-size: 32px; margin-bottom: 15px; }
        #info { display: flex; justify-content: center; gap: 20px; }
        .info-item { background: #f5f5f5; padding: 10px 20px; border-radius: 20px; font-size: 16px; }
        #game-board {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            grid-template-rows: repeat(4, 80px);
            gap: 8px;
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
        }
        .cell {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            user-select: none;
        }
        .cell:hover { transform: scale(1.05); }
        .cell:active { transform: scale(0.95); }
        .cell.empty { background: #e0e0e0; cursor: default; }
        .cell.selected { background: linear-gradient(135deg, #f1c40f, #f39c12); transform: scale(0.95); }
        .cell.matched { background: linear-gradient(135deg, #2ecc71, #27ae60); animation: pulse 0.5s; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        #win-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            z-index: 100;
            transition: transform 0.5s;
        }
        #win-message.show { transform: translate(-50%, -50%) scale(1); }
        #win-message h2 { color: #e74c3c; font-size: 32px; margin-bottom: 20px; }
        #win-message p { color: #333; font-size: 18px; margin-bottom: 20px; }
        #restart-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
        }
        #restart-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="header">
            <h1>🀄 满堂红</h1>
            <div id="info">
                <div class="info-item">🔢 步数：<span id="moves">0</span></div>
                <div class="info-item">⏱️ 时间：<span id="timer">0</span>s</div>
                <div class="info-item">🎯 消除：<span id="matched">0</span>/8</div>
            </div>
        </div>
        <div id="game-board"></div>
    </div>
    <div id="win-message">
        <h2>🎉 满堂红!</h2>
        <p>所有配对都消除完成!</p>
        <p>用时：<span id="final-time"></span> 秒 | 步数：<span id="final-moves"></span></p>
        <button id="restart-btn">再来一局</button>
    </div>

    <script>
        const board = document.getElementById('game-board');
        const movesEl = document.getElementById('moves');
        const timerEl = document.getElementById('timer');
        const matchedEl = document.getElementById('matched');
        const winMessage = document.getElementById('win-message');
        const restartBtn = document.getElementById('restart-btn');

        // 使用 emoji 作为配对图案
        const emojis = ['🍎', '', '🍇', '🍓', '🎈', '🎁', '⭐', '🌟'];
        let cards = [];
        let flipped = [];
        let matched = 0;
        let moves = 0;
        let startTime = null;
        let timerInterval = null;
        let canFlip = true;

        function initGame() {
            // 生成配对卡片
            cards = [...emojis, ...emojis];
            shuffle(cards);

            matched = 0;
            moves = 0;
            flipped = [];
            canFlip = true;
            matchedEl.textContent = 0;
            movesEl.textContent = 0;
            timerEl.textContent = 0;
            winMessage.classList.remove('show');

            clearInterval(timerInterval);
            startTime = Date.now();
            timerInterval = setInterval(() => {
                timerEl.textContent = Math.floor((Date.now() - startTime) / 1000);
            }, 1000);

            render();
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function render() {
            board.innerHTML = '';
            cards.forEach((emoji, index) => {
                const cell = document.createElement('div');
                cell.className = 'cell';
                if (emoji === null) {
                    cell.classList.add('empty');
                    cell.textContent = '';
                } else if (flipped.includes(index)) {
                    cell.classList.add('selected');
                    cell.textContent = emoji;
                } else {
                    cell.textContent = '?';
                    cell.onclick = () => flipCard(index);
                }
                board.appendChild(cell);
            });
        }

        function flipCard(index) {
            if (!canFlip || flipped.includes(index) || cards[index] === null) return;

            flipped.push(index);
            moves++;
            movesEl.textContent = moves;
            render();

            if (flipped.length === 2) {
                canFlip = false;
                const [idx1, idx2] = flipped;

                if (cards[idx1] === cards[idx2]) {
                    // 配对成功
                    setTimeout(() => {
                        document.querySelectorAll('.cell.selected').forEach((el, i) => {
                            el.classList.add('matched');
                            el.classList.remove('selected');
                        });
                        cards[idx1] = null;
                        cards[idx2] = null;
                        matched++;
                        matchedEl.textContent = matched;
                        flipped = [];
                        canFlip = true;

                        if (matched === 8) {
                            setTimeout(showWin, 500);
                        }
                    }, 500);
                } else {
                    // 配对失败
                    setTimeout(() => {
                        flipped = [];
                        canFlip = true;
                        render();
                    }, 1000);
                }
            }
        }

        function showWin() {
            clearInterval(timerInterval);
            const finalTime = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('final-time').textContent = finalTime;
            document.getElementById('final-moves').textContent = moves;
            winMessage.classList.add('show');
        }

        restartBtn.onclick = initGame;
        initGame();
    </script>
</body>
</html>
