<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>青蛙冥想</title>
<meta name="description" content="青蛙冥想网页版：可后台单曲 / 前台混音，曲库与微信小程序同步。">
<style>
:root{--ink:#0f172a;--accent:#60a5fa}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#fff;overflow:hidden;background:#0f172a}
a{color:inherit;text-decoration:none}
.bg-layer{position:fixed;inset:0;z-index:-2;transition:background .8s ease}
.bg-mask{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.45))}
.nav-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;position:relative;z-index:5}
.nav-title{font-size:18px;font-weight:800;letter-spacing:1px}
.nav-right{display:flex;gap:8px}
.nav-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;border:1px solid rgba(255,255,255,.1);position:relative}
.nav-btn.active{background:rgba(96,165,250,.35);border-color:rgba(96,165,250,.6)}
.timer-count{position:absolute;bottom:-2px;right:-2px;font-size:9px;background:#ef4444;border-radius:8px;padding:1px 4px;font-weight:700}
.wx-banner{margin:0 14px 10px;padding:10px 12px;border-radius:12px;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.35);font-size:12.5px;line-height:1.45;color:rgba(255,255,255,.9)}
.wx-banner b{color:#86efac}
.mode-switch{display:flex;gap:8px;padding:0 14px 10px}
.mode-pill{flex:1;text-align:center;padding:9px 0;border-radius:999px;font-size:13px;font-weight:700;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);cursor:pointer}
.mode-pill.on.mode-bg{background:rgba(96,165,250,.28);border-color:rgba(96,165,250,.55)}
.mode-pill.on.mode-mix{background:rgba(168,85,247,.28);border-color:rgba(168,85,247,.55)}
.scroll-wrap{height:calc(100% - 58px - 118px);overflow-y:auto;padding:0 14px 24px;-webkit-overflow-scrolling:touch}
.scroll-wrap::-webkit-scrollbar{width:0}
.header-tip{display:flex;flex-direction:column;gap:4px;padding:4px 2px 12px;font-size:12.5px;color:rgba(255,255,255,.78)}
.tip-sub{opacity:.85}.count-num{color:#fbbf24;font-weight:800}
.sound-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sound-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 10px;cursor:pointer;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:5px}
.sound-card.active{border-color:var(--card-color);box-shadow:0 0 0 1px var(--card-color)}
.sound-card.active::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--card-color)}
.card-heat{position:absolute;top:8px;right:8px;font-size:10px;color:rgba(255,255,255,.55);background:rgba(0,0,0,.25);padding:2px 6px;border-radius:8px}
.card-icon{font-size:28px;line-height:1}
.card-name{font-size:14px;font-weight:700;padding-right:52px}
.card-state{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.5)}
.sound-card.active .card-state{color:var(--card-color)}
.state-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3)}
.sound-card.active .state-dot{background:var(--card-color);box-shadow:0 0 6px var(--card-color)}
.vol-row{display:none;align-items:center;gap:6px;margin-top:4px}
.mode-mix-on .vol-row{display:flex}
.vol-slider{flex:1;-webkit-appearance:none;height:4px;border-radius:2px;background:rgba(255,255,255,.2);outline:none}
.vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff}
.acc{margin-top:12px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.acc-head{display:flex;align-items:center;gap:8px;padding:12px;background:rgba(255,255,255,.06);cursor:pointer}
.acc-title{font-weight:700;font-size:13px;flex:1}
.acc-meta{font-size:11px;color:rgba(255,255,255,.5)}
.acc-body{padding:10px;background:rgba(0,0,0,.15)}
.dock{position:fixed;bottom:0;left:0;right:0;background:rgba(15,23,42,.9);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.1);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:10}
.dock-row{display:flex;align-items:center;gap:10px}
.master-row{margin-bottom:8px}
.master-label{font-size:12px;color:rgba(255,255,255,.7);white-space:nowrap}
.master-slider{flex:1;-webkit-appearance:none;height:6px;border-radius:3px;background:rgba(255,255,255,.2)}
.master-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff}
.master-val{font-size:11px;width:36px;text-align:right;opacity:.7}
.action-row{display:flex;gap:8px}
.act-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:10px;background:rgba(255,255,255,.08);cursor:pointer;border:1px solid rgba(255,255,255,.08);font-size:11px}
.act-btn.primary{background:rgba(96,165,250,.2);border-color:rgba(96,165,250,.4)}
.act-btn.danger{background:rgba(244,63,94,.18);border-color:rgba(244,63,94,.4)}
.act-icon{font-size:16px}
.mask-layer{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none}
.mask-layer.show{display:block}
.sheet{position:fixed;bottom:0;left:0;right:0;background:#1e293b;border-radius:18px 18px 0 0;padding:18px;z-index:30;transform:translateY(100%);transition:transform .28s;max-height:70vh;overflow-y:auto}
.sheet.show{transform:translateY(0)}
.sheet-title{font-size:15px;font-weight:700;margin-bottom:12px;text-align:center}
.sheet-hint{font-size:11px;color:rgba(255,255,255,.4);text-align:center;margin-top:10px}
.bg-grid,.timer-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.timer-grid{grid-template-columns:repeat(3,1fr)}
.bg-item{height:64px;border-radius:10px;cursor:pointer;position:relative;border:2px solid transparent}
.bg-item.active{border-color:#60a5fa}
.bg-name{position:absolute;bottom:5px;left:7px;font-size:11px;font-weight:600;text-shadow:0 1px 3px #000}
.timer-item{padding:12px 0;text-align:center;border-radius:10px;background:rgba(255,255,255,.08);cursor:pointer;font-size:13px;border:1px solid transparent}
.timer-item.active{background:rgba(96,165,250,.25);border-color:rgba(96,165,250,.6)}
.custom-timer{display:none;margin-top:12px;padding:12px;background:rgba(255,255,255,.06);border-radius:10px}
.custom-timer.show{display:block}
.ct-row{display:flex;gap:8px;margin-top:8px}
.ct-input{flex:1;padding:9px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.3);color:#fff}
.ct-btn{padding:9px 16px;border-radius:8px;background:#60a5fa;border:none;color:#fff;font-weight:600;cursor:pointer}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);padding:10px 16px;border-radius:10px;font-size:13px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.loading{padding:40px;text-align:center;opacity:.7}
.error{padding:20px;color:#fca5a5;font-size:13px;line-height:1.5}
@media(min-width:641px){
  .scroll-wrap{max-width:560px;margin:0 auto}
  .nav-bar,.dock,.mode-switch,.wx-banner{max-width:560px;margin-left:auto;margin-right:auto}
  .dock{left:50%;transform:translateX(-50%);width:100%}
}
</style>
</head>
<body class="mode-bg-on">
<div class="bg-layer" id="bgLayer"></div>
<div class="bg-mask"></div>

<div class="nav-bar">
  <div class="nav-title" id="navTitle">🐸 青蛙冥想</div>
  <div class="nav-right">
    <div class="nav-btn" id="bgBtn" title="背景">🖼️</div>
    <div class="nav-btn" id="timerBtn" title="定时">⏱️<span class="timer-count" id="timerCount" style="display:none"></span></div>
  </div>
</div>

<div class="wx-banner">网页版与小程序<strong>曲库同步</strong>。完整可后台体验请微信搜 <b>青蛙冥想</b>（息屏播单曲更稳）。</div>

<div class="mode-switch">
  <div class="mode-pill mode-bg on" data-mode="bg">可后台</div>
  <div class="mode-pill mode-mix" data-mode="mix">混音</div>
</div>

<div class="scroll-wrap" id="scrollWrap">
  <div class="loading" id="bootMsg">加载曲库中…</div>
</div>

<div class="dock">
  <div class="dock-row master-row">
    <span class="master-label">总音量</span>
    <input type="range" class="master-slider" id="masterSlider" min="0" max="1" step="0.05" value="0.8">
    <span class="master-val" id="masterVal">80%</span>
  </div>
  <div class="dock-row action-row">
    <div class="act-btn" id="dockBgBtn"><span class="act-icon">🖼️</span><span class="act-text">背景</span></div>
    <div class="act-btn primary" id="dockTimerBtn"><span class="act-icon">⏱️</span><span class="act-text" id="dockTimerText">定时</span></div>
    <div class="act-btn danger" id="resetBtn"><span class="act-icon">🔄</span><span class="act-text">重置</span></div>
  </div>
</div>

<div class="mask-layer" id="mask"></div>
<div class="sheet" id="bgSheet">
  <div class="sheet-title">选择背景主题</div>
  <div class="bg-grid" id="bgGrid"></div>
  <div class="sheet-hint">渐变背景 · 点击切换</div>
</div>
<div class="sheet" id="timerSheet">
  <div class="sheet-title">定时关闭</div>
  <div class="timer-grid" id="timerGrid"></div>
  <div class="custom-timer" id="customTimer">
    <div class="ct-label">自定义分钟数（1–240）</div>
    <div class="ct-row">
      <input type="number" class="ct-input" id="customInput" value="30" min="1" max="240">
      <button class="ct-btn" id="customConfirm" type="button">确定</button>
    </div>
  </div>
  <div class="sheet-hint">时间到后全部停止</div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = 'https://frog-meditation-263821-11-1322666988.sh.run.tcloudbase.com'
const FIRST_N = 10
const COLORS = ['#3b82f6','#06b6d4','#10b981','#f97316','#0ea5e9','#84cc16','#94a3b8','#a78bfa','#f43f5e','#eab308','#6366f1','#14b8a6']
const BG_LIST = [
  {id:'forest-morning',name:'晨光林间',gradient:'linear-gradient(135deg,#064e3b 0%,#065f46 40%,#134e4a 80%,#0c4a6e 100%)'},
  {id:'snow-lake',name:'冬日落雪',gradient:'linear-gradient(135deg,#1e293b 0%,#334155 50%,#1e3a5f 80%,#0f172a 100%)'},
  {id:'sunset-lake',name:'湖边晚霞',gradient:'linear-gradient(135deg,#7c2d12 0%,#9a3412 30%,#be123c 60%,#581c87 90%,#1e1b4b 100%)'},
  {id:'stream-forest',name:'溪流树林',gradient:'linear-gradient(135deg,#052e16 0%,#14532d 40%,#0e7490 75%,#164e63 100%)'}
]
const TIMER_OPTIONS = [
  {label:'关闭',value:0},{label:'1分钟',value:1},{label:'10分钟',value:10},
  {label:'30分钟',value:30},{label:'自定义',value:-1}
]
const CAT_FALLBACK = ['自然声','fc游戏','其他']

const state = {
  playMode: localStorage.getItem('frog_h5_mode') === 'mix' ? 'mix' : 'bg',
  maxActive: 1,
  sounds: [],       // full catalog sorted
  plays: {},
  intro: '',
  appName: '青蛙冥想',
  categoryOrder: CAT_FALLBACK,
  activeSet: new Set(),
  volumeMap: {},
  audioMap: {},
  masterVolume: 0.8,
  bgIndex: 0,
  timerVal: 0,
  timerEnd: 0,
  timerIv: null,
  moreOpen: false,
  catOpen: {}
}

function toast(msg){
  const el = document.getElementById('toast')
  el.textContent = msg
  el.classList.add('show')
  clearTimeout(toast._t)
  toast._t = setTimeout(()=>el.classList.remove('show'),1800)
}
function colorFor(id){
  let h=0; for(let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i))>>>0
  return COLORS[h % COLORS.length]
}
function formatHeat(n){
  n = Number(n)||0
  if(n<=0) return '0'
  if(n>=10000) return (Math.round(n/1000)/10).toString().replace(/\.0$/,'') + '万'
  return String(n)
}
function maxActive(){ return state.playMode === 'mix' ? 3 : 1 }

async function fetchJson(url){
  const r = await fetch(url + (url.includes('?')?'&':'?') + '_t=' + Date.now())
  if(!r.ok) throw new Error('http '+r.status)
  return r.json()
}

function buildCatalog(meta){
  const soundsObj = meta.sounds || {}
  const order = Array.isArray(meta.sound_order) ? meta.sound_order.slice() : []
  const ids = order.length ? order.slice() : Object.keys(soundsObj)
  Object.keys(soundsObj).forEach(id=>{ if(!ids.includes(id)) ids.push(id) })
  const list = []
  ids.forEach(id=>{
    const info = soundsObj[id]
    if(!info || typeof info !== 'object') return
    const url = (info.url || '').trim()
    if(!url) return
    list.push({
      id,
      name: info.name || id,
      icon: info.icon || '🎧',
      desc: info.desc || '',
      category: String(info.category || '其他').trim() || '其他',
      order: Number(info.order)||999,
      url,
      color: colorFor(id)
    })
  })
  return list
}

function ensureAudio(id){
  if(state.audioMap[id]) return state.audioMap[id]
  const s = state.sounds.find(x=>x.id===id)
  if(!s) return null
  const a = new Audio(s.url)
  a.loop = true
  a.preload = 'none'
  a.crossOrigin = 'anonymous'
  const vol = state.volumeMap[id] !== undefined ? state.volumeMap[id] : 0.7
  a.volume = Math.min(1, vol * state.masterVolume)
  a.addEventListener('error', ()=> toast('加载失败：'+(s.name||id)))
  state.audioMap[id] = a
  return a
}
function applyVol(id){
  const a = state.audioMap[id]
  if(!a) return
  const vol = state.volumeMap[id] !== undefined ? state.volumeMap[id] : 0.7
  a.volume = Math.min(1, Math.max(0, vol * state.masterVolume))
}
function updateMediaSession(sound){
  if(!('mediaSession' in navigator) || !sound) return
  try{
    navigator.mediaSession.metadata = new MediaMetadata({
      title: sound.name,
      artist: '青蛙冥想',
      album: state.playMode === 'bg' ? '可后台' : '混音'
    })
    navigator.mediaSession.setActionHandler('pause', ()=> stopAll())
    navigator.mediaSession.setActionHandler('stop', ()=> stopAll())
  }catch(e){}
}

async function hitPlay(id){
  try{
    const r = await fetch(API+'/api/hit', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({id})
    })
    if(r.ok){
      const j = await r.json()
      if(j.plays) state.plays = j.plays
      else if(typeof j.count === 'number') state.plays[id] = j.count
      paint()
    }
  }catch(e){}
}

function stopId(id){
  const a = state.audioMap[id]
  if(a){ try{ a.pause(); a.currentTime = 0 }catch(e){} }
  state.activeSet.delete(id)
}
function stopAll(){
  ;[...state.activeSet].forEach(stopId)
  paint()
}
async function toggleSound(id){
  if(state.activeSet.has(id)){
    stopId(id)
    paint()
    return
  }
  if(state.activeSet.size >= maxActive()){
    if(state.playMode === 'bg'){
      ;[...state.activeSet].forEach(stopId)
    } else {
      toast('最多同时 '+maxActive()+' 路')
      return
    }
  }
  const a = ensureAudio(id)
  if(!a) return
  applyVol(id)
  try{
    await a.play()
  }catch(e){
    toast('请再点一次播放（浏览器限制）')
    return
  }
  state.activeSet.add(id)
  const sound = state.sounds.find(x=>x.id===id)
  updateMediaSession(sound)
  hitPlay(id)
  paint()
}

function setMode(mode){
  if(mode !== 'bg' && mode !== 'mix') return
  if(mode === state.playMode) return
  stopAll()
  state.playMode = mode
  state.maxActive = maxActive()
  localStorage.setItem('frog_h5_mode', mode)
  document.body.classList.toggle('mode-mix-on', mode==='mix')
  document.body.classList.toggle('mode-bg-on', mode==='bg')
  document.querySelectorAll('.mode-pill').forEach(el=>{
    el.classList.toggle('on', el.dataset.mode === mode)
  })
  toast(mode==='bg' ? '可后台：点哪个播哪个（网页息屏因浏览器而异）' : '混音：最多 3 路，可调分轨音量')
  paint()
}

function cardHtml(s){
  const active = state.activeSet.has(s.id)
  const vol = state.volumeMap[s.id] !== undefined ? state.volumeMap[s.id] : 0.7
  const heat = formatHeat(state.plays[s.id]||0)
  return `<div class="sound-card ${active?'active':''}" data-id="${s.id}" style="--card-color:${s.color}">
    <div class="card-heat">热度 ${heat}</div>
    <div class="card-icon">${s.icon}</div>
    <div class="card-name">${escapeHtml(s.name)}</div>
    <div class="card-state"><span class="state-dot"></span><span>${active?'播放中':'点击播放'}</span></div>
    <div class="vol-row" data-vol>
      <span>🔈</span>
      <input type="range" class="vol-slider" data-id="${s.id}" min="0" max="1" step="0.05" value="${vol}">
      <span>🔊</span>
    </div>
  </div>`
}
function escapeHtml(t){
  return String(t).replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]))
}
function groupCats(list){
  const map = {}
  list.forEach(s=>{
    const c = s.category || '其他'
    if(!map[c]) map[c]=[]
    map[c].push(s)
  })
  const groups = []
  const push = (name)=>{
    if(!map[name]||!map[name].length) return
    groups.push({name, list:map[name], count:map[name].length})
    delete map[name]
  }
  const order = (state.categoryOrder||[]).filter(n=>n && n!=='其他')
  order.forEach(push)
  Object.keys(map).filter(n=>n!=='其他').forEach(push)
  push('其他')
  return groups
}

function paint(){
  const wrap = document.getElementById('scrollWrap')
  const tip = state.playMode==='bg'
    ? (state.intro || '单曲播放 · 网页可试听，完整息屏请用微信小程序')
    : '混音最多 3 路 · 每路可调音量（切后台可能被浏览器暂停）'
  const top = state.sounds.slice(0, FIRST_N)
  const more = state.sounds.slice(FIRST_N)
  const cats = groupCats(state.sounds)

  let html = `<div class="header-tip">
    <div class="tip-main">${escapeHtml(tip)}</div>
    <div class="tip-sub">已开启 <span class="count-num">${state.activeSet.size}</span>/${maxActive()}
      ${state.timerEnd ? ' · 定时中' : ''}
    </div>
  </div>
  <div class="sound-grid">${top.map(cardHtml).join('')}</div>`

  if(more.length){
    html += `<div class="acc">
      <div class="acc-head" data-acc="more">
        <span class="acc-title">${state.moreOpen?'收起更多':'更多音效'}</span>
        <span class="acc-meta">${more.length} 条</span>
        <span>${state.moreOpen?'▴':'▾'}</span>
      </div>
      ${state.moreOpen?`<div class="acc-body"><div class="sound-grid">${more.map(cardHtml).join('')}</div></div>`:''}
    </div>`
  }

  cats.forEach(g=>{
    const open = !!state.catOpen[g.name]
    html += `<div class="acc">
      <div class="acc-head" data-cat="${escapeHtml(g.name)}">
        <span class="acc-title">${escapeHtml(g.name)}</span>
        <span class="acc-meta">${g.count} 条</span>
        <span>${open?'▴':'▾'}</span>
      </div>
      ${open?`<div class="acc-body"><div class="sound-grid">${g.list.map(cardHtml).join('')}</div></div>`:''}
    </div>`
  })

  wrap.innerHTML = html
  document.getElementById('navTitle').textContent = '🐸 ' + (state.appName || '青蛙冥想')
}

function bindUi(){
  document.getElementById('scrollWrap').addEventListener('click', e=>{
    const head = e.target.closest('.acc-head')
    if(head){
      if(head.dataset.acc==='more'){ state.moreOpen = !state.moreOpen; paint(); return }
      if(head.dataset.cat){
        const n = head.dataset.cat
        state.catOpen[n] = !state.catOpen[n]
        paint(); return
      }
    }
    const card = e.target.closest('.sound-card')
    if(card && !e.target.classList.contains('vol-slider')){
      toggleSound(card.dataset.id)
    }
  })
  document.getElementById('scrollWrap').addEventListener('input', e=>{
    if(!e.target.classList.contains('vol-slider')) return
    const id = e.target.dataset.id
    state.volumeMap[id] = Number(e.target.value)
    applyVol(id)
  })
  document.querySelectorAll('.mode-pill').forEach(el=>{
    el.addEventListener('click', ()=> setMode(el.dataset.mode))
  })
  document.getElementById('masterSlider').addEventListener('input', e=>{
    state.masterVolume = Number(e.target.value)
    document.getElementById('masterVal').textContent = Math.round(state.masterVolume*100)+'%'
    state.activeSet.forEach(applyVol)
  })
  document.getElementById('resetBtn').addEventListener('click', ()=>{
    stopAll(); toast('已重置')
  })

  // sheets
  const mask = document.getElementById('mask')
  const bgSheet = document.getElementById('bgSheet')
  const timerSheet = document.getElementById('timerSheet')
  function closeSheets(){
    mask.classList.remove('show'); bgSheet.classList.remove('show'); timerSheet.classList.remove('show')
  }
  function openSheet(el){
    mask.classList.add('show'); el.classList.add('show')
  }
  mask.addEventListener('click', closeSheets)
  function openBg(){
    renderBg(); openSheet(bgSheet)
  }
  function openTimer(){
    renderTimer(); openSheet(timerSheet)
  }
  document.getElementById('bgBtn').addEventListener('click', openBg)
  document.getElementById('dockBgBtn').addEventListener('click', openBg)
  document.getElementById('timerBtn').addEventListener('click', openTimer)
  document.getElementById('dockTimerBtn').addEventListener('click', openTimer)

  document.getElementById('bgGrid').addEventListener('click', e=>{
    const item = e.target.closest('.bg-item')
    if(!item) return
    state.bgIndex = Number(item.dataset.index)
    applyBg(); renderBg(); closeSheets()
  })
  document.getElementById('timerGrid').addEventListener('click', e=>{
    const item = e.target.closest('.timer-item')
    if(!item) return
    const v = Number(item.dataset.value)
    if(v===-1){
      document.getElementById('customTimer').classList.add('show')
      state.timerVal = -1; renderTimer(); return
    }
    document.getElementById('customTimer').classList.remove('show')
    setTimer(v); closeSheets()
  })
  document.getElementById('customConfirm').addEventListener('click', ()=>{
    const m = Number(document.getElementById('customInput').value)||0
    if(m<1||m>240){ toast('请输入 1–240'); return }
    setTimer(m); closeSheets()
  })
}

function applyBg(){
  document.getElementById('bgLayer').style.background = BG_LIST[state.bgIndex].gradient
}
function renderBg(){
  document.getElementById('bgGrid').innerHTML = BG_LIST.map((b,i)=>
    `<div class="bg-item ${i===state.bgIndex?'active':''}" data-index="${i}" style="background:${b.gradient}"><div class="bg-name">${b.name}</div></div>`
  ).join('')
}
function renderTimer(){
  document.getElementById('timerGrid').innerHTML = TIMER_OPTIONS.map(t=>
    `<div class="timer-item ${t.value===state.timerVal?'active':''}" data-value="${t.value}">${t.label}</div>`
  ).join('')
}
function setTimer(minutes){
  clearInterval(state.timerIv); state.timerIv=null
  state.timerVal = minutes
  const badge = document.getElementById('timerCount')
  const dock = document.getElementById('dockTimerText')
  if(!minutes){
    state.timerEnd = 0
    badge.style.display='none'
    dock.textContent='定时'
    toast('定时已关闭')
    return
  }
  state.timerEnd = Date.now() + minutes*60*1000
  badge.style.display='block'
  const tick=()=>{
    const left = Math.max(0, state.timerEnd - Date.now())
    const m = Math.ceil(left/60000)
    badge.textContent = m
    dock.textContent = m+'分'
    if(left<=0){
      clearInterval(state.timerIv); state.timerIv=null
      stopAll(); state.timerEnd=0; state.timerVal=0
      badge.style.display='none'; dock.textContent='定时'
      toast('定时到，已停止')
    }
  }
  tick()
  state.timerIv = setInterval(tick, 1000)
  toast('已设 '+minutes+' 分钟')
}

async function boot(){
  bindUi()
  applyBg()
  setMode(state.playMode)
  document.body.classList.toggle('mode-mix-on', state.playMode==='mix')
  try{
    const [meta, plays] = await Promise.all([
      fetchJson(API+'/api/meta'),
      fetchJson(API+'/api/plays').catch(()=>({}))
    ])
    state.appName = meta.app_name || '青蛙冥想'
    state.intro = meta.intro || ''
    state.categoryOrder = meta.category_order || CAT_FALLBACK
    state.sounds = buildCatalog(meta)
    state.plays = (plays && typeof plays === 'object') ? plays : {}
    if(!state.sounds.length) throw new Error('曲库为空')
    paint()
  }catch(e){
    document.getElementById('scrollWrap').innerHTML =
      `<div class="error">曲库加载失败：${escapeHtml(e.message||e)}<br>请检查网络后刷新。也可微信搜「青蛙冥想」。</div>`
  }
}
boot()
</script>
</body>
</html>
