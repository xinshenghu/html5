<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>青蛙冥想</title>
<meta name="description" content="青蛙冥想网页版：可后台单曲 / 前台混音，曲库与微信小程序同步。">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#f1f5f9;overflow:hidden;background:#0f172a}
.page{position:fixed;inset:0;overflow:hidden}
.bg-layer{position:absolute;inset:0;z-index:0;background:linear-gradient(135deg,#064e3b 0%,#065f46 40%,#134e4a 80%,#0c4a6e 100%)}
.bg-mask{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.15) 25%,rgba(0,0,0,.35) 75%,rgba(0,0,0,.65) 100%)}
.scroll-wrap{position:absolute;top:0;bottom:132px;left:0;right:0;z-index:2;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 24px 24px}
.scroll-wrap::-webkit-scrollbar{width:0}
.content-inner{max-width:560px;margin:0 auto;padding-bottom:8px}
.mode-switch{display:flex;gap:8px;padding:4px 0 10px}
.mode-pill{flex:1;height:36px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:rgba(241,245,249,.75);cursor:pointer}
.mode-pill.mode-bg{background:rgba(96,165,250,.18);border-color:rgba(96,165,250,.55);color:#dbeafe}
.mode-pill.mode-mix{background:rgba(52,211,153,.18);border-color:rgba(52,211,153,.55);color:#d1fae5}
.mode-pill.on{color:#fff;font-weight:600}
.mode-pill.mode-bg.on{background:rgba(96,165,250,.45);border-color:#60a5fa}
.mode-pill.mode-mix.on{background:rgba(52,211,153,.45);border-color:#34d399}
.header-tip{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:0 0 14px}
.tip-main{flex:1;min-width:0;font-size:13px;line-height:1.4;color:rgba(241,245,249,.85)}
.tip-sub{flex-shrink:0;font-size:13px;color:rgba(241,245,249,.85);white-space:nowrap}
.count-num{font-weight:700;color:#fbbf24;font-size:15px;padding:0 4px}
.timer-tip{color:rgba(147,197,253,.95)}
.sound-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:8px}
.sound-card{--card-color:#60a5fa;position:relative;padding:16px 14px 12px;border-radius:18px;background:rgba(255,255,255,.08);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);overflow:hidden;cursor:pointer;transition:all .25s ease}
.sound-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--card-color);opacity:.6}
.sound-card.active{background:rgba(255,255,255,.14);border-color:var(--card-color);box-shadow:0 0 0 1px var(--card-color) inset,0 8px 24px rgba(0,0,0,.3);transform:translateY(-1px)}
.sound-card.active::before{opacity:1}
.card-heat{position:absolute;top:8px;right:8px;z-index:2;font-size:9px;font-weight:500;color:rgba(241,245,249,.82);line-height:1;text-align:right;max-width:56px}
.card-icon{font-size:30px;line-height:1;margin-bottom:8px}
.card-name{font-size:16px;font-weight:600;margin-bottom:4px;padding-right:48px}
.card-state{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(241,245,249,.78);margin-bottom:8px}
.state-dot{width:8px;height:8px;border-radius:50%;background:rgba(241,245,249,.35)}
.sound-card.active .state-dot{background:var(--card-color);box-shadow:0 0 0 3px rgba(255,255,255,.1),0 0 8px var(--card-color)}
.vol-row{display:none;align-items:center;gap:6px;padding-top:8px;border-top:1px solid rgba(255,255,255,.08)}
.mode-mix-on .vol-row{display:flex}
.vol-label{font-size:12px;color:rgba(241,245,249,.7);width:16px;text-align:center;flex-shrink:0}
.vol-slider{flex:1;-webkit-appearance:none;height:4px;border-radius:2px;background:rgba(255,255,255,.2);outline:none}
.vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff}
.more-acc,.cat-acc{margin:4px 0 8px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
.cat-acc{margin:8px 0 0}
.acc-head{display:flex;align-items:center;gap:8px;padding:14px 16px;cursor:pointer}
.acc-title{flex:1;font-size:14px;font-weight:600;color:#e2e8f0}
.acc-meta{font-size:12px;color:rgba(226,232,240,.65)}
.acc-chevron{font-size:12px;color:rgba(226,232,240,.55)}
.acc-body{padding:0 12px 12px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:10px 24px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(180deg,rgba(15,23,42,0) 0%,rgba(15,23,42,.88) 28%,rgba(15,23,42,.97) 100%);backdrop-filter:blur(10px);pointer-events:auto}
.dock-inner{max-width:560px;margin:0 auto}
.master-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.master-label{font-size:12px;color:rgba(255,255,255,.7);white-space:nowrap}
.master-slider{flex:1;-webkit-appearance:none;height:6px;border-radius:3px;background:rgba(255,255,255,.2)}
.master-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff}
.master-val{font-size:11px;width:36px;text-align:right;opacity:.7}
.action-row{display:flex;gap:10px}
.act-btn{flex:1;height:48px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:14px;font-weight:500;color:#f1f5f9}
.act-btn.primary{background:linear-gradient(135deg,rgba(59,130,246,.45),rgba(99,102,241,.45));border-color:rgba(96,165,250,.5)}
.act-btn.danger{background:linear-gradient(135deg,rgba(239,68,68,.35),rgba(249,115,22,.35));border-color:rgba(248,113,113,.5)}
.act-icon{font-size:18px}
.mask-layer{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s}
.mask-layer.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:110;padding:18px 18px calc(env(safe-area-inset-bottom) + 20px);background:linear-gradient(180deg,#1e293b 0%,#0f172a 100%);border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -8px 32px rgba(0,0,0,.4)}
.sheet.show{transform:translateY(0)}
.sheet-title{font-size:17px;font-weight:700;text-align:center;padding:4px 0 16px}
.timer-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.timer-item{height:48px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer}
.timer-item.active{background:rgba(96,165,250,.3);border-color:rgba(96,165,250,.6);font-weight:600}
.custom-timer{display:none;margin-top:14px}
.custom-timer.show{display:block}
.ct-label{font-size:12px;color:rgba(241,245,249,.7);margin-bottom:8px}
.ct-row{display:flex;gap:10px}
.ct-input{flex:1;height:42px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);font-size:15px;color:#f1f5f9}
.ct-btn{width:84px;height:42px;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#6366f1);border:none;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);padding:10px 16px;border-radius:10px;font-size:13px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80%;text-align:center}
.toast.show{opacity:1}
.loading,.error{padding:40px 8px;text-align:center;opacity:.75;font-size:13px;line-height:1.5}
.error{color:#fca5a5;opacity:1}
</style>
</head>
<body>
<div class="page mode-bg-on" id="page">
  <div class="bg-layer"></div>
  <div class="bg-mask"></div>

  <div class="scroll-wrap" id="scrollWrap">
    <div class="content-inner">
      <div class="mode-switch">
        <div class="mode-pill mode-bg on" data-mode="bg">可后台</div>
        <div class="mode-pill mode-mix" data-mode="mix">混音</div>
      </div>
      <div class="header-tip">
        <div class="tip-main" id="tipMain">加载中…</div>
        <div class="tip-sub">已开启 <span class="count-num" id="countNum">0</span>/<span id="maxNum">1</span><span class="timer-tip" id="timerTip"></span></div>
      </div>
      <div id="listRoot"><div class="loading">加载曲库中…</div></div>
    </div>
  </div>

  <div class="dock">
    <div class="dock-inner">
      <div class="master-row">
        <span class="master-label">总音量</span>
        <input type="range" class="master-slider" id="masterSlider" min="0" max="1" step="0.05" value="0.8">
        <span class="master-val" id="masterVal">80%</span>
      </div>
      <div class="action-row">
        <div class="act-btn primary" id="timerBtn"><span class="act-icon">⏱️</span><span id="timerBtnText">定时</span></div>
        <div class="act-btn danger" id="resetBtn"><span class="act-icon">🔄</span><span>重置</span></div>
      </div>
    </div>
  </div>
</div>

<div class="mask-layer" id="mask"></div>
<div class="sheet" id="timerSheet">
  <div class="sheet-title">定时关闭</div>
  <div class="timer-grid" id="timerGrid"></div>
  <div class="custom-timer" id="customTimer">
    <div class="ct-label">自定义分钟数（1–240）</div>
    <div class="ct-row">
      <input class="ct-input" id="customInput" type="number" value="30" min="1" max="240">
      <button class="ct-btn" id="customConfirm" type="button">确定</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = 'https://frog-meditation-263821-11-1322666988.sh.run.tcloudbase.com'
const FIRST_N = 10
const COLORS = ['#3b82f6','#06b6d4','#10b981','#f97316','#0ea5e9','#84cc16','#94a3b8','#a78bfa','#f43f5e','#eab308','#6366f1','#14b8a6','#ca8a04']
const TIMER_OPTIONS = [
  {label:'关闭',value:0},{label:'1分钟',value:1},{label:'10分钟',value:10},
  {label:'30分钟',value:30},{label:'自定义',value:-1}
]
const CAT_FALLBACK = ['自然声','fc游戏','其他']

const state = {
  playMode: localStorage.getItem('frog_h5_mode') === 'mix' ? 'mix' : 'bg',
  sounds: [],
  plays: {},
  intro: '',
  categoryOrder: CAT_FALLBACK,
  activeSet: new Set(),
  volumeMap: {},
  audioMap: {},
  masterVolume: 0.8,
  moreOpen: false,
  catOpen: {},
  timerVal: 0,
  timerEnd: 0,
  timerIv: null,
  unlocked: false
}

function toast(msg){
  const el = document.getElementById('toast')
  el.textContent = msg
  el.classList.add('show')
  clearTimeout(toast._t)
  toast._t = setTimeout(()=>el.classList.remove('show'),1800)
}
function escapeHtml(t){
  return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
}
function colorFor(id){
  let h=0; for(let i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))>>>0
  return COLORS[h%COLORS.length]
}
function formatHeat(n){
  n=Number(n)||0
  if(n>=10000) return (Math.round(n/1000)/10).toString().replace(/\.0$/,'')+'万'
  return String(n)
}
function maxActive(){ return state.playMode==='mix' ? 3 : 1 }

async function unlockAudio(){
  if(state.unlocked) return
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext
    if(Ctx){
      const ctx = new Ctx()
      if(ctx.state==='suspended') await ctx.resume()
      const buf = ctx.createBuffer(1,1,22050)
      const src = ctx.createBufferSource()
      src.buffer = buf
      src.connect(ctx.destination)
      src.start(0)
    }
    // silent HTMLAudio unlock
    const a = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=')
    a.volume = 0.01
    await a.play().catch(()=>{})
    a.pause()
    state.unlocked = true
  }catch(e){}
}

async function fetchJson(url){
  const r = await fetch(url+(url.includes('?')?'&':'?')+'_t='+Date.now())
  if(!r.ok) throw new Error('http '+r.status)
  return r.json()
}

function buildCatalog(meta){
  const soundsObj = meta.sounds || {}
  const order = Array.isArray(meta.sound_order) ? meta.sound_order.slice() : []
  const ids = order.length ? order.slice() : Object.keys(soundsObj)
  Object.keys(soundsObj).forEach(id=>{ if(!ids.includes(id)) ids.push(id) })
  return ids.map(id=>{
    const info = soundsObj[id]
    if(!info || typeof info!=='object') return null
    const url = (info.url||'').trim()
    if(!url) return null
    return {
      id, name: info.name||id, icon: info.icon||'🎧',
      category: String(info.category||'其他').trim()||'其他',
      url, color: colorFor(id)
    }
  }).filter(Boolean)
}

function ensureAudio(id){
  if(state.audioMap[id]) return state.audioMap[id]
  const s = state.sounds.find(x=>x.id===id)
  if(!s) return null
  const a = new Audio()
  a.preload = 'auto'
  a.loop = true
  a.crossOrigin = 'anonymous'
  a.src = s.url
  const vol = state.volumeMap[id]!==undefined ? state.volumeMap[id] : 0.7
  a.volume = Math.min(1, vol * state.masterVolume)
  a.addEventListener('error', ()=> toast('加载失败：'+(s.name||id)))
  state.audioMap[id] = a
  return a
}
function applyVol(id){
  const a = state.audioMap[id]
  if(!a) return
  const vol = state.volumeMap[id]!==undefined ? state.volumeMap[id] : 0.7
  a.volume = Math.min(1, Math.max(0, vol * state.masterVolume))
}
function updateMediaSession(sound){
  if(!('mediaSession' in navigator) || !sound) return
  try{
    navigator.mediaSession.metadata = new MediaMetadata({
      title: sound.name, artist: '青蛙冥想', album: state.playMode==='bg'?'可后台':'混音'
    })
    navigator.mediaSession.setActionHandler('pause', ()=> stopAll())
    navigator.mediaSession.setActionHandler('stop', ()=> stopAll())
  }catch(e){}
}
async function hitPlay(id){
  try{
    const r = await fetch(API+'/api/hit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id})})
    if(r.ok){
      const j = await r.json()
      if(j.plays) state.plays = j.plays
      else if(typeof j.count==='number') state.plays[id]=j.count
      paintList()
      paintTip()
    }
  }catch(e){}
}
function stopId(id){
  const a = state.audioMap[id]
  if(a){ try{ a.pause(); a.currentTime=0 }catch(e){} }
  state.activeSet.delete(id)
}
function stopAll(){
  ;[...state.activeSet].forEach(stopId)
  paintList(); paintTip()
}
async function toggleSound(id){
  await unlockAudio()
  if(state.activeSet.has(id)){
    stopId(id); paintList(); paintTip(); return
  }
  if(state.activeSet.size >= maxActive()){
    if(state.playMode==='bg') [...state.activeSet].forEach(stopId)
    else { toast('最多同时 '+maxActive()+' 路'); return }
  }
  const a = ensureAudio(id)
  if(!a) return
  applyVol(id)
  try{
    if(a.readyState < 2){
      await new Promise((resolve,reject)=>{
        const ok=()=>{ cleanup(); resolve() }
        const bad=()=>{ cleanup(); reject(new Error('load')) }
        const cleanup=()=>{ a.removeEventListener('canplay',ok); a.removeEventListener('error',bad) }
        a.addEventListener('canplay',ok,{once:true})
        a.addEventListener('error',bad,{once:true})
        a.load()
        setTimeout(()=>{ cleanup(); resolve() }, 2500)
      })
    }
    await a.play()
  }catch(e){
    toast('请再点一次播放')
    return
  }
  state.activeSet.add(id)
  updateMediaSession(state.sounds.find(x=>x.id===id))
  hitPlay(id)
  paintList(); paintTip()
}
function setMode(mode){
  if(mode!=='bg' && mode!=='mix') return
  if(mode===state.playMode) return
  stopAll()
  state.playMode = mode
  localStorage.setItem('frog_h5_mode', mode)
  document.getElementById('page').classList.toggle('mode-mix-on', mode==='mix')
  document.getElementById('page').classList.toggle('mode-bg-on', mode==='bg')
  document.querySelectorAll('.mode-pill').forEach(el=> el.classList.toggle('on', el.dataset.mode===mode))
  paintTip(); paintList()
}

function cardHtml(s){
  const active = state.activeSet.has(s.id)
  const vol = state.volumeMap[s.id]!==undefined ? state.volumeMap[s.id] : 0.7
  return `<div class="sound-card ${active?'active':''}" data-id="${s.id}" style="--card-color:${s.color}">
    <div class="card-heat">热度 ${formatHeat(state.plays[s.id]||0)}</div>
    <div class="card-icon">${s.icon}</div>
    <div class="card-name">${escapeHtml(s.name)}</div>
    <div class="card-state"><span class="state-dot"></span><span>${active?'播放中':'点击播放'}</span></div>
    <div class="vol-row" data-vol>
      <span class="vol-label">🔈</span>
      <input type="range" class="vol-slider" data-id="${s.id}" min="0" max="1" step="0.05" value="${vol}">
      <span class="vol-label">🔊</span>
    </div>
  </div>`
}
function groupCats(list){
  const map={}
  list.forEach(s=>{ const c=s.category||'其他'; (map[c]=map[c]||[]).push(s) })
  const groups=[]; const push=n=>{ if(!map[n]||!map[n].length) return; groups.push({name:n,list:map[n],count:map[n].length}); delete map[n] }
  ;(state.categoryOrder||[]).filter(n=>n&&n!=='其他').forEach(push)
  Object.keys(map).filter(n=>n!=='其他').forEach(push)
  push('其他')
  return groups
}
function paintTip(){
  const tip = state.intro || (state.playMode==='bg' ? '单曲可后台 · 音量用手机侧键' : '混音最多 3 路 · 每路可调音量')
  document.getElementById('tipMain').textContent = tip
  document.getElementById('countNum').textContent = state.activeSet.size
  document.getElementById('maxNum').textContent = maxActive()
  const tt = document.getElementById('timerTip')
  if(state.timerEnd){
    const m = Math.max(1, Math.ceil((state.timerEnd-Date.now())/60000))
    tt.textContent = ' · 定时 '+m+'分'
  } else tt.textContent = ''
}
function paintList(){
  const root = document.getElementById('listRoot')
  const top = state.sounds.slice(0, FIRST_N)
  const more = state.sounds.slice(FIRST_N)
  const cats = groupCats(state.sounds)
  let html = `<div class="sound-grid">${top.map(cardHtml).join('')}</div>`
  if(more.length){
    html += `<div class="more-acc">
      <div class="acc-head" data-acc="more">
        <span class="acc-title">${state.moreOpen?'收起更多':'更多音效'}</span>
        <span class="acc-meta">${more.length} 条</span>
        <span class="acc-chevron">${state.moreOpen?'▴':'▾'}</span>
      </div>
      ${state.moreOpen?`<div class="acc-body"><div class="sound-grid">${more.map(cardHtml).join('')}</div></div>`:''}
    </div>`
  }
  cats.forEach(g=>{
    const open = !!state.catOpen[g.name]
    html += `<div class="cat-acc">
      <div class="acc-head" data-cat="${escapeHtml(g.name)}">
        <span class="acc-title">${escapeHtml(g.name)}</span>
        <span class="acc-meta">${g.count} 条</span>
        <span class="acc-chevron">${open?'▴':'▾'}</span>
      </div>
      ${open?`<div class="acc-body"><div class="sound-grid">${g.list.map(cardHtml).join('')}</div></div>`:''}
    </div>`
  })
  root.innerHTML = html
}

function renderTimer(){
  document.getElementById('timerGrid').innerHTML = TIMER_OPTIONS.map(t=>
    `<div class="timer-item ${t.value===state.timerVal?'active':''}" data-value="${t.value}">${t.label}</div>`
  ).join('')
}
function setTimer(minutes){
  clearInterval(state.timerIv); state.timerIv=null
  state.timerVal = minutes
  const btn = document.getElementById('timerBtnText')
  if(!minutes){
    state.timerEnd=0; btn.textContent='定时'; paintTip(); toast('定时已关闭'); return
  }
  state.timerEnd = Date.now()+minutes*60*1000
  const tick=()=>{
    const left=Math.max(0,state.timerEnd-Date.now())
    const m=Math.ceil(left/60000)
    btn.textContent = m+'分'
    paintTip()
    if(left<=0){
      clearInterval(state.timerIv); state.timerIv=null
      stopAll(); state.timerEnd=0; state.timerVal=0
      btn.textContent='定时'; toast('定时到，已停止')
    }
  }
  tick(); state.timerIv=setInterval(tick,1000)
  toast('已设 '+minutes+' 分钟')
}

function bindUi(){
  document.querySelectorAll('.mode-pill').forEach(el=>{
    el.addEventListener('click', async ()=>{ await unlockAudio(); setMode(el.dataset.mode) })
  })
  const root = document.getElementById('listRoot')
  root.addEventListener('click', e=>{
    const head = e.target.closest('.acc-head')
    if(head){
      if(head.dataset.acc==='more'){ state.moreOpen=!state.moreOpen; paintList(); return }
      if(head.dataset.cat){ state.catOpen[head.dataset.cat]=!state.catOpen[head.dataset.cat]; paintList(); return }
    }
    const card = e.target.closest('.sound-card')
    if(card && !e.target.classList.contains('vol-slider')) toggleSound(card.dataset.id)
  })
  root.addEventListener('input', e=>{
    if(!e.target.classList.contains('vol-slider')) return
    state.volumeMap[e.target.dataset.id]=Number(e.target.value)
    applyVol(e.target.dataset.id)
  })
  document.getElementById('resetBtn').addEventListener('click', ()=>{ stopAll(); toast('已重置') })
  document.getElementById('masterSlider').addEventListener('input', e=>{
    state.masterVolume = Number(e.target.value)
    document.getElementById('masterVal').textContent = Math.round(state.masterVolume*100)+'%'
    state.activeSet.forEach(applyVol)
  })

  const mask=document.getElementById('mask')
  const sheet=document.getElementById('timerSheet')
  const close=()=>{ mask.classList.remove('show'); sheet.classList.remove('show') }
  const open=()=>{ renderTimer(); mask.classList.add('show'); sheet.classList.add('show') }
  mask.addEventListener('click', close)
  document.getElementById('timerBtn').addEventListener('click', open)
  document.getElementById('timerGrid').addEventListener('click', e=>{
    const item=e.target.closest('.timer-item'); if(!item) return
    const v=Number(item.dataset.value)
    if(v===-1){ document.getElementById('customTimer').classList.add('show'); state.timerVal=-1; renderTimer(); return }
    document.getElementById('customTimer').classList.remove('show')
    setTimer(v); close()
  })
  document.getElementById('customConfirm').addEventListener('click', ()=>{
    const m=Number(document.getElementById('customInput').value)||0
    if(m<1||m>240){ toast('请输入 1–240'); return }
    setTimer(m); close()
  })
  // first gesture unlock
  document.body.addEventListener('touchstart', unlockAudio, {once:true, passive:true})
  document.body.addEventListener('click', unlockAudio, {once:true})
}

async function boot(){
  document.getElementById('page').classList.toggle('mode-mix-on', state.playMode==='mix')
  document.querySelectorAll('.mode-pill').forEach(el=> el.classList.toggle('on', el.dataset.mode===state.playMode))
  bindUi()
  try{
    const [meta, plays] = await Promise.all([
      fetchJson(API+'/api/meta'),
      fetchJson(API+'/api/plays').catch(()=>({}))
    ])
    state.intro = meta.intro || ''
    state.categoryOrder = meta.category_order || CAT_FALLBACK
    state.sounds = buildCatalog(meta)
    state.plays = (plays && typeof plays==='object') ? plays : {}
    if(!state.sounds.length) throw new Error('曲库为空')
    document.title = meta.app_name || '青蛙冥想'
    paintTip(); paintList()
  }catch(e){
    document.getElementById('listRoot').innerHTML =
      `<div class="error">曲库加载失败：${escapeHtml(e.message||e)}<br>可微信搜「青蛙冥想」。</div>`
  }
}
boot()
</script>
</body>
</html>
